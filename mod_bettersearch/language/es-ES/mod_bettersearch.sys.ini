MOD_BETTERSEARCH="Better Search for Gridbox - campo de búsqueda"
MOD_BETTERSEARCH_XML_DESCRIPTION="Un campo de búsqueda con los resultados en vivo de Better Search for Gridbox, para lugares sin un elemento de búsqueda de Gridbox (p. ej. mediante el elemento de Gridbox «Joomla Module»). Requiere el plugin «Sistema - Better Search for Gridbox»."
