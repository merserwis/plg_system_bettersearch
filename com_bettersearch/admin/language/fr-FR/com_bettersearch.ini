COM_BETTERSEARCH_ENABLED="Le plugin Better Search est activé."
COM_BETTERSEARCH_NO_GRIDBOX="Gridbox n'est pas installé ou est désactivé. Better Search fonctionne uniquement avec Balbooa Gridbox."
COM_BETTERSEARCH_START_TITLE="Commencez par la configuration rapide"
COM_BETTERSEARCH_START_TEXT="Quelques commutateurs aux valeurs recommandées configurent la recherche. Tout le reste se trouve dans les tuiles ci-dessous, quand vous en avez besoin. Mettez ensuite l'index à jour sur la page Index."
