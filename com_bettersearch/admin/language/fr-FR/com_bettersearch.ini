COM_BETTERSEARCH_TEST_SEARCH="Tester une recherche"
COM_BETTERSEARCH_CLEAR_CACHE="Vider le cache"
COM_BETTERSEARCH_CACHE_CLEARED="Les caches de la recherche ont été vidés."
COM_BETTERSEARCH_OPEN_GRIDBOX="Ouvrir Gridbox"
COM_BETTERSEARCH_CHECK_TITLE="Vérifiez votre site"
COM_BETTERSEARCH_CHECK_TEXT="Après avoir activé ou modifié une fonction, vérifiez sur votre propre site qu'elle fonctionne comme prévu : en tant qu'invité (dans une fenêtre privée), sur ordinateur et sur téléphone, sur plusieurs types de pages (accueil, produit, catégorie, page de résultats). Chaque site Joomla + Gridbox est construit différemment. Si quelque chose ne fonctionne pas correctement, désactivez cette fonction et signalez le problème."
COM_BETTERSEARCH_CHECK_SITE="Vérifiez sur votre site que les fonctions modifiées fonctionnent comme prévu, de préférence en tant qu'invité dans une fenêtre privée : tapez dans un champ de recherche, ouvrez les résultats instantanés et la page de résultats."
COM_BETTERSEARCH_SUPPORT="Signalez les problèmes et les idées sur <a href=\"https://github.com/merserwis/plg_system_bettersearch/issues\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub</a>."
