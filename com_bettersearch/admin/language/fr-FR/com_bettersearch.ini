; configuration rapide
COM_BETTERSEARCH_SETUP_INTRO="Les principaux commutateurs de la recherche au même endroit. Chacun indique s'il est recommandé pour la plupart des sites, et le bouton ci-dessous active tous ceux qui le sont (les optionnels restent tels quels). Seuls les commutateurs que vous modifiez sont enregistrés. Les détails de chaque outil se trouvent ensuite sur sa propre page."
COM_BETTERSEARCH_SETUP_RECOMMENDED_ALL="Activer les recommandés"
COM_BETTERSEARCH_SETUP_RECOMMENDED_ON="Recommandé"
COM_BETTERSEARCH_SETUP_RECOMMENDED_OFF="Optionnel"
COM_BETTERSEARCH_SETUP_SAVED="Configuration rapide enregistrée. Paramètres modifiés : %d."
COM_BETTERSEARCH_SETUP_SAVED_0="Configuration rapide enregistrée, aucun paramètre modifié."
COM_BETTERSEARCH_SETUP_SAVED_1="Configuration rapide enregistrée. Paramètres modifiés : 1."
COM_BETTERSEARCH_SETUP_LIVE_ENABLED_LABEL="Résultats instantanés"
COM_BETTERSEARCH_SETUP_LIVE_ENABLED_DESC="Une fenêtre de résultats s'ouvre sous le champ de recherche pendant que le visiteur tape."
COM_BETTERSEARCH_SETUP_REPLACE_RESULTS_LABEL="Page de résultats de Better Search"
COM_BETTERSEARCH_SETUP_REPLACE_RESULTS_DESC="La page de tous les résultats de Gridbox est remplacée par celle de Better Search, avec tri et filtres."
COM_BETTERSEARCH_SETUP_QS_FORGIVING_LABEL="Recherche tolérante"
COM_BETTERSEARCH_SETUP_QS_FORGIVING_DESC="Trouve un produit malgré une faute de frappe, une terminaison ou un fragment de mot, et propose le bon mot (« Vouliez-vous dire… »)."
COM_BETTERSEARCH_SETUP_INDEX_PAGES_LABEL="Aussi les pages et articles de blog"
COM_BETTERSEARCH_SETUP_INDEX_PAGES_DESC="La recherche trouve aussi les pages ordinaires et les articles de blog, pas seulement les produits. Activez-le si les visiteurs cherchent des articles."
COM_BETTERSEARCH_SETUP_QS_INDEX_LABEL="Index toujours à jour"
COM_BETTERSEARCH_SETUP_QS_INDEX_DESC="Une page ou un produit que vous enregistrez est aussitôt dans la recherche, et une vérification de temps à autre rattrape le reste."
COM_BETTERSEARCH_SETUP_VOICE_SEARCH_LABEL="Recherche vocale"
COM_BETTERSEARCH_SETUP_VOICE_SEARCH_DESC="Un micro dans les champs de recherche, sur tous les appareils. Son emplacement (tous les appareils ou mobiles seulement) se règle dans la Configuration."
COM_BETTERSEARCH_SETUP_THUMBNAILS_LABEL="Images allégées dans les résultats"
COM_BETTERSEARCH_SETUP_THUMBNAILS_DESC="Les résultats affichent de petites copies des images au lieu des originales, et s'ouvrent donc plus vite."
COM_BETTERSEARCH_SETUP_QS_SEO_LABEL="Référencement (SEO)"
COM_BETTERSEARCH_SETUP_QS_SEO_DESC="Le navigateur peut ajouter votre recherche (OpenSearch), la page de résultats a la bonne adresse canonique et ses données structurées."
COM_BETTERSEARCH_SETUP_LOG_SEARCHES_LABEL="Mémoriser les recherches"
COM_BETTERSEARCH_SETUP_LOG_SEARCHES_DESC="Ce que les visiteurs ont saisi et le nombre de résultats obtenus, pour les statistiques (aucune donnée personnelle)."
COM_BETTERSEARCH_SETUP_TRACK_CONVERSIONS_LABEL="Compter les clics et les paniers"
COM_BETTERSEARCH_SETUP_TRACK_CONVERSIONS_DESC="Quelles recherches ont mené à un clic sur un résultat et à un produit dans le panier."
COM_BETTERSEARCH_SETUP_REPORT_ENABLED_LABEL="Rapport par e-mail"
COM_BETTERSEARCH_SETUP_REPORT_ENABLED_DESC="Un résumé des recherches envoyé par e-mail (chaque semaine par défaut). Nécessite les destinataires, réglés sur la page Statistiques."
COM_BETTERSEARCH_SETUP_FEATURED_BADGE_LABEL="Badge des produits mis en avant"
COM_BETTERSEARCH_SETUP_FEATURED_BADGE_DESC="Un produit que vous placez en premier pour un mot porte un badge dans les résultats."
COM_BETTERSEARCH_SETUP_AVAIL_ENABLED_LABEL="Disponibilité des produits"
COM_BETTERSEARCH_SETUP_AVAIL_ENABLED_DESC="En stock, stock faible et rupture de stock affichés dans les résultats. Réglez les champs du délai de livraison sur la page Produits."
COM_BETTERSEARCH_SETUP_CART_BUTTON_LABEL="Bouton « Ajouter au panier »"
COM_BETTERSEARCH_SETUP_CART_BUTTON_DESC="Un bouton sur le produit dans les résultats qui le met dans le panier."
COM_BETTERSEARCH_SETUP_QUOTE_BUTTON_LABEL="Bouton « Demander un devis »"
COM_BETTERSEARCH_SETUP_QUOTE_BUTTON_DESC="Un bouton sur les produits sans prix (ou selon votre choix) qui mène à votre formulaire ou à un e-mail."
