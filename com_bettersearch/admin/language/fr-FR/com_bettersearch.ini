; les sections du tableau de bord
COM_BETTERSEARCH_GROUP_SEARCH="Recherche"
COM_BETTERSEARCH_GROUP_SEARCH_DESC="Ce qui est recherché, comment c'est trouvé et dans quel ordre."
COM_BETTERSEARCH_GROUP_DISPLAY="Résultats"
COM_BETTERSEARCH_GROUP_DISPLAY_DESC="Les résultats instantanés, la page de résultats et leur apparence."
COM_BETTERSEARCH_GROUP_INSIGHTS="Analyses"
COM_BETTERSEARCH_GROUP_INSIGHTS_DESC="Ce que les visiteurs recherchent, ce qui en découle et le rapport."
COM_BETTERSEARCH_GROUP_SHOP="Boutique"
COM_BETTERSEARCH_GROUP_SHOP_DESC="Badges, disponibilité et boutons des produits dans les résultats."
COM_BETTERSEARCH_GROUP_CONFIG="Configuration"
COM_BETTERSEARCH_GROUP_CONFIG_DESC="À régler une fois, puis à oublier."
; les pages des outils
COM_BETTERSEARCH_PAGE_INDEX="Index"
COM_BETTERSEARCH_PAGE_INDEX_DESC="L'index est la liste de vos pages et produits que la recherche lit. Vous y voyez ce qu'il contient, vous le mettez à jour et vous choisissez ce qui y entre et à quelle fréquence il est actualisé."
COM_BETTERSEARCH_PAGE_ENGINE="Moteur de recherche"
COM_BETTERSEARCH_PAGE_ENGINE_DESC="Comment un mot saisi par un visiteur est reconnu : fautes de frappe, terminaisons, synonymes et poids du titre, de la référence (SKU) et de la description. La console de test montre pourquoi chaque résultat est à sa place."
COM_BETTERSEARCH_PAGE_RULES="Règles"
COM_BETTERSEARCH_PAGE_RULES_DESC="Placez des produits choisis en premier pour des mots choisis, donnez plus ou moins de poids aux catégories et aux produits, et écartez ce qui ne doit jamais être trouvé."
COM_BETTERSEARCH_PAGE_LIVE="Résultats instantanés"
COM_BETTERSEARCH_PAGE_LIVE_DESC="La fenêtre de résultats qui s'ouvre sous le champ de recherche pendant que le visiteur tape : ce qu'elle affiche, son apparence et son comportement. L'aperçu montre vos modifications non enregistrées."
COM_BETTERSEARCH_PAGE_RESULTS="Page de résultats"
COM_BETTERSEARCH_PAGE_RESULTS_DESC="La page de tous les résultats qui remplace celle de Gridbox : tri, filtres, cartes et leur apparence. L'aperçu montre vos modifications non enregistrées."
COM_BETTERSEARCH_PAGE_APPEARANCE="Apparence"
COM_BETTERSEARCH_PAGE_APPEARANCE_DESC="Le thème des résultats instantanés et de la page de résultats : thèmes prêts à l'emploi, couleurs et polices, votre propre CSS et la mise en évidence des mots trouvés."
COM_BETTERSEARCH_PAGE_STATS="Statistiques"
COM_BETTERSEARCH_PAGE_STATS_DESC="Ce que les visiteurs recherchent, quelles recherches ne donnent rien et lesquelles mènent à un clic ou à une commande. Le rapport par e-mail et Google Search Console sont ici aussi."
COM_BETTERSEARCH_PAGE_PRODUCTS="Produits"
COM_BETTERSEARCH_PAGE_PRODUCTS_DESC="Badges, disponibilité, délai de livraison et boutons (ajouter au panier, demander un devis) des produits affichés dans les résultats."
COM_BETTERSEARCH_PAGE_CONFIG="Configuration"
COM_BETTERSEARCH_PAGE_CONFIG_DESC="Ce qui se règle une fois puis s'oublie : recherche vocale, référencement, textes et images, fichier de paramètres et informations générales."
; les onglets de la configuration sous forme de tuiles
COM_BETTERSEARCH_CFG_VOICE="Recherche vocale"
COM_BETTERSEARCH_CFG_VOICE_DESC="Un micro dans les champs de recherche ; les mots prononcés affichent les résultats instantanés ou ouvrent la page de résultats."
COM_BETTERSEARCH_CFG_SEO="Référencement (SEO)"
COM_BETTERSEARCH_CFG_SEO_DESC="Règles pour les robots et adresse canonique de la page de résultats, titres, données structurées et champ de recherche pour les navigateurs."
COM_BETTERSEARCH_CFG_TEXTS="Textes et images"
COM_BETTERSEARCH_CFG_TEXTS_DESC="Chaque texte que le visiteur lit dans les résultats, dans la langue du site, et les copies allégées des images."
COM_BETTERSEARCH_CFG_BACKUP="Fichier de paramètres"
COM_BETTERSEARCH_CFG_BACKUP_DESC="Enregistrez les paramètres dans un fichier, chargez-les sur un autre site ou revenez aux valeurs par défaut."
COM_BETTERSEARCH_CFG_BASIC="Général"
COM_BETTERSEARCH_CFG_BASIC_DESC="Le commutateur entre les paramètres de base et avancés, et où signaler un problème."
