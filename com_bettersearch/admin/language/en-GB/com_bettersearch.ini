; quick setup
COM_BETTERSEARCH_SETUP_INTRO="The main switches of the search in one place. Each one shows whether it is recommended for most sites, and the button below turns on all the recommended ones (the optional ones stay as they are). Only the switches you change are saved. The details of each tool are on its own page afterwards."
COM_BETTERSEARCH_SETUP_RECOMMENDED_ALL="Turn on the recommended"
COM_BETTERSEARCH_SETUP_RECOMMENDED_ON="Recommended"
COM_BETTERSEARCH_SETUP_RECOMMENDED_OFF="Optional"
