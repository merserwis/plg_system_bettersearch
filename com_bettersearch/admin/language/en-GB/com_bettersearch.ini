; the pages of the tools
COM_BETTERSEARCH_PAGE_INDEX="Index"
COM_BETTERSEARCH_PAGE_INDEX_DESC="The index is the list of your pages and products that the search reads. Here you see what is in it, update it and choose what goes into it and how often it is brought up to date."
COM_BETTERSEARCH_PAGE_ENGINE="Search Engine"
COM_BETTERSEARCH_PAGE_ENGINE_DESC="How a word typed by a visitor is matched: typing mistakes, word endings, synonyms and the weight of the title, the SKU and the description. The test console shows why each result is where it is."
COM_BETTERSEARCH_PAGE_RULES="Rules"
COM_BETTERSEARCH_PAGE_RULES_DESC="Put chosen products first for chosen words, give categories and products more or less weight, and leave out what should never be found."
COM_BETTERSEARCH_PAGE_LIVE="Live Results"
COM_BETTERSEARCH_PAGE_LIVE_DESC="The window of results that opens under the search field while a visitor types: what it shows, how it looks and how it moves. The preview shows your unsaved changes."
COM_BETTERSEARCH_PAGE_RESULTS="Results Page"
COM_BETTERSEARCH_PAGE_RESULTS_DESC="The page with all the results that replaces the one of Gridbox: sorting, filters, the cards and their look. The preview shows your unsaved changes."
COM_BETTERSEARCH_PAGE_APPEARANCE="Appearance"
COM_BETTERSEARCH_PAGE_APPEARANCE_DESC="The theme of the live results and of the results page: ready themes, the colours and fonts, your own CSS, and how the found words are marked."
COM_BETTERSEARCH_PAGE_STATS="Statistics"
COM_BETTERSEARCH_PAGE_STATS_DESC="What visitors search for, which searches find nothing, and which lead to a click or an order. The e-mail report and Google Search Console are here too."
COM_BETTERSEARCH_PAGE_PRODUCTS="Products"
COM_BETTERSEARCH_PAGE_PRODUCTS_DESC="Badges, availability, delivery time and the buttons (add to cart, ask for a quote) of the products shown in the results."
COM_BETTERSEARCH_PAGE_CONFIG="Configuration"
COM_BETTERSEARCH_PAGE_CONFIG_DESC="What is set once and forgotten: voice search, search engine optimisation, the texts and images, the settings file and the general information."
; the tabs of the configuration as tiles
COM_BETTERSEARCH_CFG_VOICE="Voice Search"
COM_BETTERSEARCH_CFG_VOICE_DESC="A microphone in the search fields; the spoken words show the live results or open the results page."
COM_BETTERSEARCH_CFG_SEO="Search Engine Optimisation"
COM_BETTERSEARCH_CFG_SEO_DESC="Robots rules and the canonical address of the results page, titles, structured data and the search box for browsers."
COM_BETTERSEARCH_CFG_TEXTS="Texts and Images"
COM_BETTERSEARCH_CFG_TEXTS_DESC="Every text the visitor reads in the results, in the language of the site, and the lighter copies of the pictures."
COM_BETTERSEARCH_CFG_BACKUP="Settings File"
COM_BETTERSEARCH_CFG_BACKUP_DESC="Save the settings to a file, load them on another site, or go back to the defaults."
COM_BETTERSEARCH_CFG_BASIC="General"
COM_BETTERSEARCH_CFG_BASIC_DESC="The switch between the basic and the advanced settings, and where to report a problem."
