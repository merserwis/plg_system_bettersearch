COM_BETTERSEARCH_SETUP_LIVE_ENABLED_LABEL="Live results"
COM_BETTERSEARCH_SETUP_LIVE_ENABLED_DESC="A window of results opens under the search field while a visitor types."
COM_BETTERSEARCH_SETUP_REPLACE_RESULTS_LABEL="Better Search results page"
COM_BETTERSEARCH_SETUP_REPLACE_RESULTS_DESC="The page of all the results of Gridbox is replaced by the one of Better Search, with sorting and filters."
COM_BETTERSEARCH_SETUP_QS_FORGIVING_LABEL="Forgiving search"
COM_BETTERSEARCH_SETUP_QS_FORGIVING_DESC="Finds a product despite a typing mistake, a word ending or a part of a word, and suggests the right word (“did you mean”)."
COM_BETTERSEARCH_SETUP_INDEX_PAGES_LABEL="Pages and blog posts too"
COM_BETTERSEARCH_SETUP_INDEX_PAGES_DESC="The search also finds ordinary pages and blog posts, not only products. Turn it on if visitors look for articles."
COM_BETTERSEARCH_SETUP_QS_INDEX_LABEL="Index kept up to date"
COM_BETTERSEARCH_SETUP_QS_INDEX_DESC="A page or a product you save is in the search at once, and a check from time to time catches the rest."
COM_BETTERSEARCH_SETUP_VOICE_SEARCH_LABEL="Voice search"
COM_BETTERSEARCH_SETUP_VOICE_SEARCH_DESC="A microphone in the search fields, on all devices. Its place (all devices or mobile only) is in the Configuration."
COM_BETTERSEARCH_SETUP_THUMBNAILS_LABEL="Lighter pictures in the results"
COM_BETTERSEARCH_SETUP_THUMBNAILS_DESC="The results show small copies of the pictures instead of the full ones, so they open faster."
COM_BETTERSEARCH_SETUP_QS_SEO_LABEL="Search engine optimisation"
COM_BETTERSEARCH_SETUP_QS_SEO_DESC="The browser can add your search (OpenSearch), the results page has the right canonical address and its structured data."
COM_BETTERSEARCH_SETUP_LOG_SEARCHES_LABEL="Remember the searches"
COM_BETTERSEARCH_SETUP_LOG_SEARCHES_DESC="What visitors typed and how many results they got, for the statistics (no personal data)."
COM_BETTERSEARCH_SETUP_TRACK_CONVERSIONS_LABEL="Count clicks and carts"
COM_BETTERSEARCH_SETUP_TRACK_CONVERSIONS_DESC="Which searches led to a click on a result and to a product in the cart."
COM_BETTERSEARCH_SETUP_REPORT_ENABLED_LABEL="E-mail report"
COM_BETTERSEARCH_SETUP_REPORT_ENABLED_DESC="A summary of the searches sent by e-mail (every week by default). Needs the recipients, set on the Statistics page."
COM_BETTERSEARCH_SETUP_FEATURED_BADGE_LABEL="Badge of the featured products"
COM_BETTERSEARCH_SETUP_FEATURED_BADGE_DESC="A product you put first for a word wears a badge in the results."
COM_BETTERSEARCH_SETUP_AVAIL_ENABLED_LABEL="Availability of products"
COM_BETTERSEARCH_SETUP_AVAIL_ENABLED_DESC="In stock, low stock and out of stock shown in the results. Set the fields of the delivery time on the Products page."
COM_BETTERSEARCH_SETUP_CART_BUTTON_LABEL="Add to cart button"
COM_BETTERSEARCH_SETUP_CART_BUTTON_DESC="A button on the product in the results that puts it in the cart."
COM_BETTERSEARCH_SETUP_QUOTE_BUTTON_LABEL="Ask for a quote button"
COM_BETTERSEARCH_SETUP_QUOTE_BUTTON_DESC="A button on the products without a price (or as you choose) that leads to your form or to an e-mail."
