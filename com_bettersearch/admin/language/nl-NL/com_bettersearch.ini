COM_BETTERSEARCH_SETUP_SAVED_1="Snelle instelling opgeslagen. Gewijzigde instellingen: 1."
COM_BETTERSEARCH_SETUP_LIVE_ENABLED_LABEL="Live resultaten"
COM_BETTERSEARCH_SETUP_LIVE_ENABLED_DESC="Een resultatenvenster opent onder het zoekveld terwijl een bezoeker typt."
COM_BETTERSEARCH_SETUP_REPLACE_RESULTS_LABEL="Resultatenpagina van Better Search"
COM_BETTERSEARCH_SETUP_REPLACE_RESULTS_DESC="De pagina met alle resultaten van Gridbox wordt vervangen door die van Better Search, met sortering en filters."
COM_BETTERSEARCH_SETUP_QS_FORGIVING_LABEL="Vergevingsgezinde zoekfunctie"
COM_BETTERSEARCH_SETUP_QS_FORGIVING_DESC="Vindt een product ondanks een typfout, een woordeinde of een deel van een woord en stelt het juiste woord voor („Bedoelde u…”)."
COM_BETTERSEARCH_SETUP_INDEX_PAGES_LABEL="Ook pagina's en blogberichten"
COM_BETTERSEARCH_SETUP_INDEX_PAGES_DESC="De zoekfunctie vindt ook gewone pagina's en blogberichten, niet alleen producten. Zet dit aan als bezoekers naar artikelen zoeken."
COM_BETTERSEARCH_SETUP_QS_INDEX_LABEL="Index altijd bijgewerkt"
COM_BETTERSEARCH_SETUP_QS_INDEX_DESC="Een pagina of product dat u opslaat staat meteen in de zoekfunctie, en een controle van tijd tot tijd vangt de rest op."
COM_BETTERSEARCH_SETUP_VOICE_SEARCH_LABEL="Spraakzoeken"
COM_BETTERSEARCH_SETUP_VOICE_SEARCH_DESC="Een microfoon in de zoekvelden, op alle apparaten. De plaats ervan (alle apparaten of alleen mobiel) stelt u in bij de Configuratie."
COM_BETTERSEARCH_SETUP_THUMBNAILS_LABEL="Lichtere afbeeldingen in de resultaten"
COM_BETTERSEARCH_SETUP_THUMBNAILS_DESC="De resultaten tonen kleine kopieën van de afbeeldingen in plaats van de volledige, zodat ze sneller openen."
COM_BETTERSEARCH_SETUP_QS_SEO_LABEL="Zoekmachineoptimalisatie"
COM_BETTERSEARCH_SETUP_QS_SEO_DESC="De browser kan uw zoekfunctie toevoegen (OpenSearch), de resultatenpagina heeft het juiste canonieke adres en gestructureerde gegevens."
COM_BETTERSEARCH_SETUP_LOG_SEARCHES_LABEL="Zoekopdrachten onthouden"
COM_BETTERSEARCH_SETUP_LOG_SEARCHES_DESC="Wat bezoekers hebben getypt en hoeveel resultaten ze kregen, voor de statistieken (geen persoonsgegevens)."
COM_BETTERSEARCH_SETUP_TRACK_CONVERSIONS_LABEL="Klikken en winkelwagens tellen"
COM_BETTERSEARCH_SETUP_TRACK_CONVERSIONS_DESC="Welke zoekopdrachten tot een klik op een resultaat en tot een product in de winkelwagen hebben geleid."
COM_BETTERSEARCH_SETUP_REPORT_ENABLED_LABEL="E-mailrapport"
COM_BETTERSEARCH_SETUP_REPORT_ENABLED_DESC="Een samenvatting van de zoekopdrachten per e-mail (standaard elke week). Vereist de ontvangers, in te stellen op de pagina Statistieken."
COM_BETTERSEARCH_SETUP_FEATURED_BADGE_LABEL="Label op uitgelichte producten"
COM_BETTERSEARCH_SETUP_FEATURED_BADGE_DESC="Een product dat u voor een woord vooraan zet, draagt in de resultaten een label."
COM_BETTERSEARCH_SETUP_AVAIL_ENABLED_LABEL="Beschikbaarheid van producten"
COM_BETTERSEARCH_SETUP_AVAIL_ENABLED_DESC="Op voorraad, lage voorraad en niet op voorraad worden in de resultaten getoond. Stel de velden van de levertijd in op de pagina Producten."
COM_BETTERSEARCH_SETUP_CART_BUTTON_LABEL="Knop “In winkelwagen”"
COM_BETTERSEARCH_SETUP_CART_BUTTON_DESC="Een knop bij het product in de resultaten die het in de winkelwagen legt."
COM_BETTERSEARCH_SETUP_QUOTE_BUTTON_LABEL="Knop “Offerte aanvragen”"
COM_BETTERSEARCH_SETUP_QUOTE_BUTTON_DESC="Een knop bij producten zonder prijs (of naar uw keuze) die naar uw formulier of naar een e-mail leidt."
