COM_BETTERSEARCH_CHECK_TITLE="Controleer uw site"
COM_BETTERSEARCH_CHECK_TEXT="Controleer na het inschakelen of wijzigen van een functie op uw eigen site of die werkt zoals het hoort: als gast (in een privévenster), op een computer en op een telefoon, op meerdere soorten pagina's (startpagina, product, categorie, resultatenpagina). Elke Joomla + Gridbox-site is anders opgebouwd. Als iets niet goed werkt, schakel die functie dan uit en meld het probleem."
COM_BETTERSEARCH_CHECK_SITE="Controleer op uw site of de functies die u hebt gewijzigd werken zoals het hoort, het best als gast in een privévenster: typ in een zoekveld, open de live resultaten en de resultatenpagina."
