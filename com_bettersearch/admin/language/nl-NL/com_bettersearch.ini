; de onderdelen van het controlepaneel
COM_BETTERSEARCH_GROUP_SEARCH="Zoeken"
COM_BETTERSEARCH_GROUP_SEARCH_DESC="Wat er wordt doorzocht, hoe het wordt gevonden en in welke volgorde."
COM_BETTERSEARCH_GROUP_DISPLAY="Resultaten"
COM_BETTERSEARCH_GROUP_DISPLAY_DESC="De live resultaten, de resultatenpagina en hoe ze eruitzien."
COM_BETTERSEARCH_GROUP_INSIGHTS="Inzichten"
COM_BETTERSEARCH_GROUP_INSIGHTS_DESC="Waar bezoekers naar zoeken, wat ervan komt en het rapport."
COM_BETTERSEARCH_GROUP_SHOP="Winkel"
COM_BETTERSEARCH_GROUP_SHOP_DESC="Labels, beschikbaarheid en knoppen van de producten in de resultaten."
COM_BETTERSEARCH_GROUP_CONFIG="Configuratie"
COM_BETTERSEARCH_GROUP_CONFIG_DESC="Eén keer instellen en vergeten."
; de pagina's van de hulpmiddelen
COM_BETTERSEARCH_PAGE_INDEX="Index"
COM_BETTERSEARCH_PAGE_INDEX_DESC="De index is de lijst van uw pagina's en producten die de zoekfunctie leest. Hier ziet u wat erin staat, werkt u hem bij en kiest u wat erin komt en hoe vaak hij wordt bijgewerkt."
COM_BETTERSEARCH_PAGE_ENGINE="Zoekmachine"
COM_BETTERSEARCH_PAGE_ENGINE_DESC="Hoe een door de bezoeker getypt woord wordt herkend: typfouten, woordeinden, synoniemen en het gewicht van de titel, het artikelnummer en de beschrijving. De testconsole laat zien waarom elk resultaat op zijn plaats staat."
COM_BETTERSEARCH_PAGE_RULES="Regels"
COM_BETTERSEARCH_PAGE_RULES_DESC="Zet gekozen producten vooraan voor gekozen woorden, geef categorieën en producten meer of minder gewicht en sluit uit wat nooit gevonden mag worden."
COM_BETTERSEARCH_PAGE_LIVE="Live resultaten"
COM_BETTERSEARCH_PAGE_LIVE_DESC="Het resultatenvenster dat onder het zoekveld opent terwijl een bezoeker typt: wat het toont, hoe het eruitziet en hoe het beweegt. Het voorbeeld toont ook uw niet-opgeslagen wijzigingen."
COM_BETTERSEARCH_PAGE_RESULTS="Resultatenpagina"
COM_BETTERSEARCH_PAGE_RESULTS_DESC="De pagina met alle resultaten die die van Gridbox vervangt: sortering, filters, de kaarten en hun uiterlijk. Het voorbeeld toont ook uw niet-opgeslagen wijzigingen."
COM_BETTERSEARCH_PAGE_APPEARANCE="Weergave"
COM_BETTERSEARCH_PAGE_APPEARANCE_DESC="Het thema van de live resultaten en de resultatenpagina: kant-en-klare thema's, kleuren en lettertypen, uw eigen CSS en hoe de gevonden woorden worden gemarkeerd."
COM_BETTERSEARCH_PAGE_STATS="Statistieken"
COM_BETTERSEARCH_PAGE_STATS_DESC="Waar bezoekers naar zoeken, welke zoekopdrachten niets vinden en welke leiden tot een klik of een bestelling. Het e-mailrapport en Google Search Console staan hier ook."
COM_BETTERSEARCH_PAGE_PRODUCTS="Producten"
COM_BETTERSEARCH_PAGE_PRODUCTS_DESC="Labels, beschikbaarheid, levertijd en de knoppen (in winkelwagen, offerte aanvragen) van de producten in de resultaten."
COM_BETTERSEARCH_PAGE_CONFIG="Configuratie"
COM_BETTERSEARCH_PAGE_CONFIG_DESC="Wat eenmaal wordt ingesteld en vergeten: spraakzoeken, zoekmachineoptimalisatie, de teksten en afbeeldingen, het instellingenbestand en de algemene informatie."
; de tabbladen van de configuratie als tegels
COM_BETTERSEARCH_CFG_VOICE="Spraakzoeken"
COM_BETTERSEARCH_CFG_VOICE_DESC="Een microfoon in de zoekvelden; de gesproken woorden tonen de live resultaten of openen de resultatenpagina."
COM_BETTERSEARCH_CFG_SEO="Zoekmachineoptimalisatie"
COM_BETTERSEARCH_CFG_SEO_DESC="Robotregels en het canonieke adres van de resultatenpagina, titels, gestructureerde gegevens en het zoekvak voor browsers."
COM_BETTERSEARCH_CFG_TEXTS="Teksten en afbeeldingen"
COM_BETTERSEARCH_CFG_TEXTS_DESC="Elke tekst die de bezoeker in de resultaten leest, in de taal van de site, en de lichtere kopieën van de afbeeldingen."
COM_BETTERSEARCH_CFG_BACKUP="Instellingenbestand"
COM_BETTERSEARCH_CFG_BACKUP_DESC="Sla de instellingen op in een bestand, laad ze op een andere site of ga terug naar de standaardwaarden."
COM_BETTERSEARCH_CFG_BASIC="Algemeen"
COM_BETTERSEARCH_CFG_BASIC_DESC="De schakelaar tussen de basis- en de geavanceerde instellingen en waar u een probleem meldt."
