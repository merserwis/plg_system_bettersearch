; snelle instelling
COM_BETTERSEARCH_SETUP_INTRO="De belangrijkste schakelaars van de zoekfunctie op één plek. Bij elke staat of hij voor de meeste sites wordt aanbevolen, en de knop hieronder zet alle aanbevolen schakelaars aan (de optionele blijven zoals ze zijn). Alleen de schakelaars die u wijzigt worden opgeslagen. De details van elk hulpmiddel staan daarna op de eigen pagina."
COM_BETTERSEARCH_SETUP_RECOMMENDED_ALL="Aanbevolen schakelaars aanzetten"
