; rychlé nastavení
COM_BETTERSEARCH_SETUP_INTRO="Hlavní přepínače vyhledávání na jednom místě. U každého je vidět, zda je doporučen pro většinu webů, a tlačítko níže zapne všechny doporučené (volitelné zůstanou beze změny). Ukládají se jen přepínače, které změníte. Podrobnosti každého nástroje jsou poté na jeho vlastní stránce."
COM_BETTERSEARCH_SETUP_RECOMMENDED_ALL="Zapnout doporučené"
COM_BETTERSEARCH_SETUP_RECOMMENDED_ON="Doporučeno"
COM_BETTERSEARCH_SETUP_RECOMMENDED_OFF="Volitelné"
COM_BETTERSEARCH_SETUP_SAVED="Rychlé nastavení uloženo. Změněná nastavení: %d."
COM_BETTERSEARCH_SETUP_SAVED_0="Rychlé nastavení uloženo, žádné nastavení se nezměnilo."
COM_BETTERSEARCH_SETUP_SAVED_1="Rychlé nastavení uloženo. Změněná nastavení: 1."
COM_BETTERSEARCH_SETUP_LIVE_ENABLED_LABEL="Okamžité výsledky"
COM_BETTERSEARCH_SETUP_LIVE_ENABLED_DESC="Okno s výsledky se otevře pod vyhledávacím polem, zatímco návštěvník píše."
COM_BETTERSEARCH_SETUP_REPLACE_RESULTS_LABEL="Stránka výsledků Better Search"
COM_BETTERSEARCH_SETUP_REPLACE_RESULTS_DESC="Stránka všech výsledků Gridboxu je nahrazena stránkou Better Search s řazením a filtry."
COM_BETTERSEARCH_SETUP_QS_FORGIVING_LABEL="Shovívavé vyhledávání"
COM_BETTERSEARCH_SETUP_QS_FORGIVING_DESC="Najde produkt i přes překlep, koncovku slova nebo část slova a navrhne správné slovo („Mysleli jste…“)."
COM_BETTERSEARCH_SETUP_INDEX_PAGES_LABEL="I stránky a články blogu"
COM_BETTERSEARCH_SETUP_INDEX_PAGES_DESC="Vyhledávání najde i běžné stránky a články blogu, nejen produkty. Zapněte, pokud návštěvníci hledají články."
COM_BETTERSEARCH_SETUP_QS_INDEX_LABEL="Index stále aktuální"
COM_BETTERSEARCH_SETUP_QS_INDEX_DESC="Uložená stránka nebo produkt je ve vyhledávání hned a kontrola čas od času zachytí zbytek."
COM_BETTERSEARCH_SETUP_VOICE_SEARCH_LABEL="Hlasové vyhledávání"
COM_BETTERSEARCH_SETUP_VOICE_SEARCH_DESC="Mikrofon ve vyhledávacích polích, na všech zařízeních. Jeho umístění (všechna zařízení nebo jen mobilní) je v Konfiguraci."
COM_BETTERSEARCH_SETUP_THUMBNAILS_LABEL="Lehčí obrázky ve výsledcích"
COM_BETTERSEARCH_SETUP_THUMBNAILS_DESC="Výsledky ukazují malé kopie obrázků místo původních, takže se otevírají rychleji."
COM_BETTERSEARCH_SETUP_QS_SEO_LABEL="Optimalizace pro vyhledávače"
COM_BETTERSEARCH_SETUP_QS_SEO_DESC="Prohlížeč může přidat vaše vyhledávání (OpenSearch), stránka výsledků má správnou kanonickou adresu a strukturovaná data."
COM_BETTERSEARCH_SETUP_LOG_SEARCHES_LABEL="Pamatovat si hledání"
COM_BETTERSEARCH_SETUP_LOG_SEARCHES_DESC="Co návštěvníci zadali a kolik výsledků dostali, pro statistiky (bez osobních údajů)."
COM_BETTERSEARCH_SETUP_TRACK_CONVERSIONS_LABEL="Počítat kliknutí a košíky"
COM_BETTERSEARCH_SETUP_TRACK_CONVERSIONS_DESC="Která hledání vedla ke kliknutí na výsledek a k produktu v košíku."
COM_BETTERSEARCH_SETUP_REPORT_ENABLED_LABEL="Zpráva e-mailem"
COM_BETTERSEARCH_SETUP_REPORT_ENABLED_DESC="Souhrn hledání odesílaný e-mailem (ve výchozím nastavení každý týden). Vyžaduje příjemce, které se nastavují na stránce Statistiky."
COM_BETTERSEARCH_SETUP_FEATURED_BADGE_LABEL="Štítek doporučených produktů"
COM_BETTERSEARCH_SETUP_FEATURED_BADGE_DESC="Produkt, který pro slovo dáte na první místo, nese ve výsledcích štítek."
COM_BETTERSEARCH_SETUP_AVAIL_ENABLED_LABEL="Dostupnost produktů"
COM_BETTERSEARCH_SETUP_AVAIL_ENABLED_DESC="Skladem, málo kusů a vyprodáno se zobrazí ve výsledcích. Pole dodací lhůty nastavíte na stránce Produkty."
COM_BETTERSEARCH_SETUP_CART_BUTTON_LABEL="Tlačítko Přidat do košíku"
COM_BETTERSEARCH_SETUP_CART_BUTTON_DESC="Tlačítko u produktu ve výsledcích, které jej vloží do košíku."
COM_BETTERSEARCH_SETUP_QUOTE_BUTTON_LABEL="Tlačítko Vyžádat nabídku"
COM_BETTERSEARCH_SETUP_QUOTE_BUTTON_DESC="Tlačítko u produktů bez ceny (nebo podle výběru), které vede na váš formulář nebo na e-mail."
