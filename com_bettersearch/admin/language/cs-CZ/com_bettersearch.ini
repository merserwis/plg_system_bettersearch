; sekce ovládacího panelu
COM_BETTERSEARCH_GROUP_SEARCH="Vyhledávání"
COM_BETTERSEARCH_GROUP_SEARCH_DESC="Co se prohledává, jak se to nachází a v jakém pořadí."
COM_BETTERSEARCH_GROUP_DISPLAY="Výsledky"
COM_BETTERSEARCH_GROUP_DISPLAY_DESC="Okamžité výsledky, stránka výsledků a jak vypadají."
COM_BETTERSEARCH_GROUP_INSIGHTS="Přehledy"
COM_BETTERSEARCH_GROUP_INSIGHTS_DESC="Co návštěvníci hledají, co z toho vzejde a zpráva."
COM_BETTERSEARCH_GROUP_SHOP="Obchod"
COM_BETTERSEARCH_GROUP_SHOP_DESC="Štítky, dostupnost a tlačítka produktů ve výsledcích."
COM_BETTERSEARCH_GROUP_CONFIG="Konfigurace"
COM_BETTERSEARCH_GROUP_CONFIG_DESC="Nastavíte jednou a zapomenete."
; stránky nástrojů
COM_BETTERSEARCH_PAGE_INDEX="Index"
COM_BETTERSEARCH_PAGE_INDEX_DESC="Index je seznam vašich stránek a produktů, který vyhledávání čte. Zde vidíte, co v něm je, můžete jej aktualizovat a vybrat, co do něj patří a jak často se aktualizuje."
COM_BETTERSEARCH_PAGE_ENGINE="Vyhledávač"
COM_BETTERSEARCH_PAGE_ENGINE_DESC="Jak se porovnává slovo zadané návštěvníkem: překlepy, koncovky slov, synonyma a váha názvu, kódu SKU a popisu. Testovací konzole ukáže, proč je každý výsledek na svém místě."
COM_BETTERSEARCH_PAGE_RULES="Pravidla"
COM_BETTERSEARCH_PAGE_RULES_DESC="Dejte vybrané produkty na první místo pro vybraná slova, dejte kategoriím a produktům větší či menší váhu a vynechte to, co se nemá nikdy najít."
COM_BETTERSEARCH_PAGE_LIVE="Okamžité výsledky"
COM_BETTERSEARCH_PAGE_LIVE_DESC="Okno s výsledky, které se otevře pod vyhledávacím polem, zatímco návštěvník píše: co ukazuje, jak vypadá a jak se chová. Náhled ukazuje i neuložené změny."
COM_BETTERSEARCH_PAGE_RESULTS="Stránka výsledků"
COM_BETTERSEARCH_PAGE_RESULTS_DESC="Stránka se všemi výsledky, která nahrazuje stránku Gridboxu: řazení, filtry, karty a jejich vzhled. Náhled ukazuje i neuložené změny."
COM_BETTERSEARCH_PAGE_APPEARANCE="Vzhled"
COM_BETTERSEARCH_PAGE_APPEARANCE_DESC="Motiv okamžitých výsledků a stránky výsledků: hotové motivy, barvy a písma, vlastní CSS a zvýraznění nalezených slov."
COM_BETTERSEARCH_PAGE_STATS="Statistiky"
COM_BETTERSEARCH_PAGE_STATS_DESC="Co návštěvníci hledají, která hledání nic nenajdou a která vedou ke kliknutí nebo objednávce. Je zde i zpráva e-mailem a Google Search Console."
COM_BETTERSEARCH_PAGE_PRODUCTS="Produkty"
COM_BETTERSEARCH_PAGE_PRODUCTS_DESC="Štítky, dostupnost, dodací lhůta a tlačítka (přidat do košíku, vyžádat nabídku) produktů zobrazených ve výsledcích."
COM_BETTERSEARCH_PAGE_CONFIG="Konfigurace"
COM_BETTERSEARCH_PAGE_CONFIG_DESC="Co se nastaví jednou a zapomene: hlasové vyhledávání, optimalizace pro vyhledávače, texty a obrázky, soubor nastavení a obecné informace."
; záložky konfigurace jako dlaždice
COM_BETTERSEARCH_CFG_VOICE="Hlasové vyhledávání"
COM_BETTERSEARCH_CFG_VOICE_DESC="Mikrofon ve vyhledávacích polích; vyslovená slova zobrazí okamžité výsledky nebo otevřou stránku výsledků."
COM_BETTERSEARCH_CFG_SEO="Optimalizace pro vyhledávače"
COM_BETTERSEARCH_CFG_SEO_DESC="Pravidla pro roboty a kanonická adresa stránky výsledků, titulky, strukturovaná data a vyhledávací pole pro prohlížeče."
COM_BETTERSEARCH_CFG_TEXTS="Texty a obrázky"
COM_BETTERSEARCH_CFG_TEXTS_DESC="Každý text, který návštěvník ve výsledcích čte, v jazyce webu, a lehčí kopie obrázků."
COM_BETTERSEARCH_CFG_BACKUP="Soubor nastavení"
COM_BETTERSEARCH_CFG_BACKUP_DESC="Uložte nastavení do souboru, načtěte je na jiném webu nebo se vraťte k výchozím hodnotám."
COM_BETTERSEARCH_CFG_BASIC="Obecné"
COM_BETTERSEARCH_CFG_BASIC_DESC="Přepínač mezi základním a pokročilým nastavením a kam nahlásit problém."
