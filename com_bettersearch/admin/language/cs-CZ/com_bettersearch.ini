COM_BETTERSEARCH_NO_GRIDBOX="Gridbox není nainstalován nebo je zakázán. Better Search funguje pouze s Balbooa Gridbox."
COM_BETTERSEARCH_START_TITLE="Začněte rychlým nastavením"
COM_BETTERSEARCH_START_TEXT="Několik přepínačů s doporučenými hodnotami nastaví vyhledávání. Vše ostatní je v dlaždicích níže, kdykoli to potřebujete. Poté aktualizujte index na stránce Index."
