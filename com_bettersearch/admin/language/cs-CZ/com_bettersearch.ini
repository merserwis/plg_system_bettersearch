COM_BETTERSEARCH_CLEAR_CACHE="Vymazat mezipaměť"
COM_BETTERSEARCH_CACHE_CLEARED="Mezipaměti vyhledávání byly vymazány."
COM_BETTERSEARCH_OPEN_GRIDBOX="Otevřít Gridbox"
COM_BETTERSEARCH_CHECK_TITLE="Zkontrolujte svůj web"
COM_BETTERSEARCH_CHECK_TEXT="Po zapnutí nebo změně jakékoli funkce si na vlastním webu ověřte, že funguje, jak má: jako host (v anonymním okně), na počítači i na telefonu, na několika druzích stránek (úvodní stránka, produkt, kategorie, stránka výsledků). Každý web na Joomle + Gridboxu je postaven jinak. Pokud něco nefunguje správně, danou funkci vypněte a nahlaste problém."
COM_BETTERSEARCH_CHECK_SITE="Ověřte si na svém webu, že funkce, které jste změnili, fungují, jak mají, nejlépe jako host v anonymním okně: zadejte text do vyhledávacího pole, otevřete okamžité výsledky a stránku výsledků."
COM_BETTERSEARCH_SUPPORT="Problémy a nápady hlaste na <a href=\"https://github.com/merserwis/plg_system_bettersearch/issues\" target=\"_blank\" rel=\"noopener noreferrer\">GitHubu</a>."
