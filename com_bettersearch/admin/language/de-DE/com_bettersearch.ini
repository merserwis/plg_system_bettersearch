COM_BETTERSEARCH_GROUP_CONFIG="Konfiguration"
COM_BETTERSEARCH_GROUP_CONFIG_DESC="Einmal einstellen und vergessen."
; die Seiten der Werkzeuge
COM_BETTERSEARCH_PAGE_INDEX="Index"
COM_BETTERSEARCH_PAGE_INDEX_DESC="Der Index ist die Liste Ihrer Seiten und Produkte, die die Suche liest. Hier sehen Sie, was darin ist, aktualisieren ihn und legen fest, was hineinkommt und wie oft er aktualisiert wird."
COM_BETTERSEARCH_PAGE_ENGINE="Suchlogik"
COM_BETTERSEARCH_PAGE_ENGINE_DESC="Wie ein vom Besucher eingegebenes Wort zugeordnet wird: Tippfehler, Wortendungen, Synonyme und das Gewicht von Titel, Artikelnummer und Beschreibung. Die Testkonsole zeigt, warum jedes Ergebnis an seiner Stelle steht."
COM_BETTERSEARCH_PAGE_RULES="Regeln"
COM_BETTERSEARCH_PAGE_RULES_DESC="Setzen Sie ausgewählte Produkte für bestimmte Wörter an die erste Stelle, geben Sie Kategorien und Produkten mehr oder weniger Gewicht und schließen Sie aus, was nie gefunden werden soll."
COM_BETTERSEARCH_PAGE_LIVE="Live-Ergebnisse"
COM_BETTERSEARCH_PAGE_LIVE_DESC="Das Ergebnisfenster, das sich unter dem Suchfeld öffnet, während ein Besucher tippt: was es zeigt, wie es aussieht und wie es sich bewegt. Die Vorschau zeigt auch nicht gespeicherte Änderungen."
COM_BETTERSEARCH_PAGE_RESULTS="Ergebnisseite"
COM_BETTERSEARCH_PAGE_RESULTS_DESC="Die Seite mit allen Ergebnissen, die die von Gridbox ersetzt: Sortierung, Filter, die Karten und ihr Aussehen. Die Vorschau zeigt auch nicht gespeicherte Änderungen."
COM_BETTERSEARCH_PAGE_APPEARANCE="Aussehen"
COM_BETTERSEARCH_PAGE_APPEARANCE_DESC="Das Design der Live-Ergebnisse und der Ergebnisseite: fertige Designs, Farben und Schriften, eigenes CSS und die Hervorhebung der gefundenen Wörter."
COM_BETTERSEARCH_PAGE_STATS="Statistik"
COM_BETTERSEARCH_PAGE_STATS_DESC="Wonach Besucher suchen, welche Suchen nichts finden und welche zu einem Klick oder einer Bestellung führen. Der E-Mail-Bericht und die Google Search Console sind ebenfalls hier."
COM_BETTERSEARCH_PAGE_PRODUCTS="Produkte"
COM_BETTERSEARCH_PAGE_PRODUCTS_DESC="Etiketten, Verfügbarkeit, Lieferzeit und die Schaltflächen („In den Warenkorb“, „Angebot anfragen“) der in den Ergebnissen gezeigten Produkte."
COM_BETTERSEARCH_PAGE_CONFIG="Konfiguration"
COM_BETTERSEARCH_PAGE_CONFIG_DESC="Was einmal eingestellt und vergessen wird: Sprachsuche, Suchmaschinenoptimierung, die Texte und Bilder, die Einstellungsdatei und die allgemeinen Informationen."
; die Reiter der Konfiguration als Kacheln
COM_BETTERSEARCH_CFG_VOICE="Sprachsuche"
COM_BETTERSEARCH_CFG_VOICE_DESC="Ein Mikrofon in den Suchfeldern; die gesprochenen Wörter zeigen die Live-Ergebnisse oder öffnen die Ergebnisseite."
COM_BETTERSEARCH_CFG_SEO="Suchmaschinenoptimierung"
COM_BETTERSEARCH_CFG_SEO_DESC="Robots-Regeln und die kanonische Adresse der Ergebnisseite, Titel, strukturierte Daten und das Suchfeld für Browser."
COM_BETTERSEARCH_CFG_TEXTS="Texte und Bilder"
COM_BETTERSEARCH_CFG_TEXTS_DESC="Jeder Text, den der Besucher in den Ergebnissen liest, in der Sprache der Website, und die leichteren Kopien der Bilder."
COM_BETTERSEARCH_CFG_BACKUP="Einstellungsdatei"
COM_BETTERSEARCH_CFG_BACKUP_DESC="Die Einstellungen in einer Datei speichern, auf einer anderen Website laden oder zu den Standardwerten zurückkehren."
COM_BETTERSEARCH_CFG_BASIC="Allgemein"
COM_BETTERSEARCH_CFG_BASIC_DESC="Der Schalter zwischen den Grund- und den erweiterten Einstellungen und wo man ein Problem meldet."
