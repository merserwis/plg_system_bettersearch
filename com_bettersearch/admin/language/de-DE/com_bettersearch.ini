; die Bereiche der Systemsteuerung
COM_BETTERSEARCH_GROUP_SEARCH="Suche"
COM_BETTERSEARCH_GROUP_SEARCH_DESC="Was durchsucht wird, wie es gefunden wird und in welcher Reihenfolge."
COM_BETTERSEARCH_GROUP_DISPLAY="Ergebnisse"
COM_BETTERSEARCH_GROUP_DISPLAY_DESC="Die Live-Ergebnisse, die Ergebnisseite und ihr Aussehen."
COM_BETTERSEARCH_GROUP_INSIGHTS="Auswertungen"
COM_BETTERSEARCH_GROUP_INSIGHTS_DESC="Wonach Besucher suchen, was daraus wird, und der Bericht."
COM_BETTERSEARCH_GROUP_SHOP="Shop"
