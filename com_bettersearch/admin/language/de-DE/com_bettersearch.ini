COM_BETTERSEARCH_CACHE_CLEARED="Die Such-Caches wurden geleert."
COM_BETTERSEARCH_OPEN_GRIDBOX="Gridbox öffnen"
COM_BETTERSEARCH_CHECK_TITLE="Prüfen Sie Ihre Website"
COM_BETTERSEARCH_CHECK_TEXT="Prüfen Sie nach dem Einschalten oder Ändern einer Funktion auf Ihrer eigenen Website, ob sie wie vorgesehen funktioniert: als Gast (in einem privaten Fenster), am Computer und am Smartphone, auf mehreren Seitentypen (Startseite, Produkt, Kategorie, Ergebnisseite). Jede Joomla-+-Gridbox-Website ist anders aufgebaut. Wenn etwas nicht richtig funktioniert, schalten Sie diese Funktion aus und melden Sie das Problem."
COM_BETTERSEARCH_CHECK_SITE="Prüfen Sie auf Ihrer Website, dass die geänderten Funktionen wie vorgesehen funktionieren, am besten als Gast in einem privaten Fenster: Tippen Sie in ein Suchfeld, öffnen Sie die Live-Ergebnisse und die Ergebnisseite."
COM_BETTERSEARCH_SUPPORT="Probleme und Ideen melden Sie auf <a href=\"https://github.com/merserwis/plg_system_bettersearch/issues\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub</a>."
