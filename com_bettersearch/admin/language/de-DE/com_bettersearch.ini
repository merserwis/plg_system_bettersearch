COM_BETTERSEARCH_ERROR_PLUGIN="Das Plugin Better Search wurde nicht gefunden."
; Schnelleinrichtung
COM_BETTERSEARCH_SETUP_INTRO="Die wichtigsten Schalter der Suche an einem Ort. Jeder zeigt, ob er für die meisten Websites empfohlen ist, und die Schaltfläche unten schaltet alle empfohlenen ein (die optionalen bleiben, wie sie sind). Gespeichert werden nur die Schalter, die Sie ändern. Die Details jedes Werkzeugs finden Sie danach auf seiner eigenen Seite."
COM_BETTERSEARCH_SETUP_RECOMMENDED_ALL="Empfohlene einschalten"
COM_BETTERSEARCH_SETUP_RECOMMENDED_ON="Empfohlen"
COM_BETTERSEARCH_SETUP_RECOMMENDED_OFF="Optional"
COM_BETTERSEARCH_SETUP_SAVED="Schnelleinrichtung gespeichert. Geänderte Einstellungen: %d."
COM_BETTERSEARCH_SETUP_SAVED_0="Schnelleinrichtung gespeichert, keine Einstellung geändert."
COM_BETTERSEARCH_SETUP_SAVED_1="Schnelleinrichtung gespeichert. Geänderte Einstellungen: 1."
COM_BETTERSEARCH_SETUP_LIVE_ENABLED_LABEL="Live-Ergebnisse"
COM_BETTERSEARCH_SETUP_LIVE_ENABLED_DESC="Ein Ergebnisfenster öffnet sich unter dem Suchfeld, während ein Besucher tippt."
COM_BETTERSEARCH_SETUP_REPLACE_RESULTS_LABEL="Ergebnisseite von Better Search"
COM_BETTERSEARCH_SETUP_REPLACE_RESULTS_DESC="Die Seite mit allen Ergebnissen von Gridbox wird durch die von Better Search ersetzt, mit Sortierung und Filtern."
COM_BETTERSEARCH_SETUP_QS_FORGIVING_LABEL="Fehlertolerante Suche"
COM_BETTERSEARCH_SETUP_QS_FORGIVING_DESC="Findet ein Produkt trotz Tippfehler, Wortendung oder Wortteil und schlägt das richtige Wort vor („Meinten Sie …“)."
COM_BETTERSEARCH_SETUP_INDEX_PAGES_LABEL="Auch Seiten und Blogbeiträge"
COM_BETTERSEARCH_SETUP_INDEX_PAGES_DESC="Die Suche findet auch gewöhnliche Seiten und Blogbeiträge, nicht nur Produkte. Schalten Sie das ein, wenn Besucher nach Artikeln suchen."
COM_BETTERSEARCH_SETUP_QS_INDEX_LABEL="Index immer aktuell"
COM_BETTERSEARCH_SETUP_QS_INDEX_DESC="Eine gespeicherte Seite oder ein gespeichertes Produkt ist sofort in der Suche, und eine Prüfung von Zeit zu Zeit erfasst den Rest."
COM_BETTERSEARCH_SETUP_VOICE_SEARCH_LABEL="Sprachsuche"
COM_BETTERSEARCH_SETUP_VOICE_SEARCH_DESC="Ein Mikrofon in den Suchfeldern, auf allen Geräten. Wo es erscheint (alle Geräte oder nur mobile), stellen Sie in der Konfiguration ein."
COM_BETTERSEARCH_SETUP_THUMBNAILS_LABEL="Leichtere Bilder in den Ergebnissen"
COM_BETTERSEARCH_SETUP_THUMBNAILS_DESC="Die Ergebnisse zeigen kleine Kopien der Bilder statt der Originale und öffnen sich so schneller."
COM_BETTERSEARCH_SETUP_QS_SEO_LABEL="Suchmaschinenoptimierung"
COM_BETTERSEARCH_SETUP_QS_SEO_DESC="Der Browser kann Ihre Suche hinzufügen (OpenSearch), die Ergebnisseite hat die richtige kanonische Adresse und ihre strukturierten Daten."
COM_BETTERSEARCH_SETUP_LOG_SEARCHES_LABEL="Suchen speichern"
COM_BETTERSEARCH_SETUP_LOG_SEARCHES_DESC="Was Besucher eingegeben haben und wie viele Ergebnisse sie bekamen, für die Statistik (keine personenbezogenen Daten)."
COM_BETTERSEARCH_SETUP_TRACK_CONVERSIONS_LABEL="Klicks und Warenkörbe zählen"
COM_BETTERSEARCH_SETUP_TRACK_CONVERSIONS_DESC="Welche Suchen zu einem Klick auf ein Ergebnis und zu einem Produkt im Warenkorb geführt haben."
COM_BETTERSEARCH_SETUP_REPORT_ENABLED_LABEL="E-Mail-Bericht"
COM_BETTERSEARCH_SETUP_REPORT_ENABLED_DESC="Eine Zusammenfassung der Suchen per E-Mail (standardmäßig jede Woche). Benötigt die Empfänger, die auf der Seite Statistik eingestellt werden."
COM_BETTERSEARCH_SETUP_FEATURED_BADGE_LABEL="Etikett hervorgehobener Produkte"
COM_BETTERSEARCH_SETUP_FEATURED_BADGE_DESC="Ein Produkt, das Sie für ein Wort an die erste Stelle setzen, trägt in den Ergebnissen ein Etikett."
COM_BETTERSEARCH_SETUP_AVAIL_ENABLED_LABEL="Verfügbarkeit der Produkte"
COM_BETTERSEARCH_SETUP_AVAIL_ENABLED_DESC="Auf Lager, geringer Bestand und nicht vorrätig werden in den Ergebnissen angezeigt. Die Felder der Lieferzeit stellen Sie auf der Seite Produkte ein."
COM_BETTERSEARCH_SETUP_CART_BUTTON_LABEL="Schaltfläche „In den Warenkorb“"
COM_BETTERSEARCH_SETUP_CART_BUTTON_DESC="Eine Schaltfläche am Produkt in den Ergebnissen, die es in den Warenkorb legt."
COM_BETTERSEARCH_SETUP_QUOTE_BUTTON_LABEL="Schaltfläche „Angebot anfragen“"
COM_BETTERSEARCH_SETUP_QUOTE_BUTTON_DESC="Eine Schaltfläche an Produkten ohne Preis (oder nach Ihrer Wahl), die zu Ihrem Formular oder zu einer E-Mail führt."
