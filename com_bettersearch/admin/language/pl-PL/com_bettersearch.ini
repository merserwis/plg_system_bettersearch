COM_BETTERSEARCH_UPDATE_INDEX="Zaktualizuj indeks"
COM_BETTERSEARCH_TEST_SEARCH="Sprawdź wyszukiwanie"
COM_BETTERSEARCH_CLEAR_CACHE="Wyczyść pamięć podręczną"
COM_BETTERSEARCH_CACHE_CLEARED="Pamięć podręczna wyszukiwarki jest wyczyszczona."
COM_BETTERSEARCH_OPEN_GRIDBOX="Otwórz Gridbox"
COM_BETTERSEARCH_CHECK_TITLE="Sprawdź swoją stronę"
COM_BETTERSEARCH_CHECK_TEXT="Po włączeniu lub zmianie każdej funkcji sprawdź na swojej stronie, czy działa prawidłowo: jako gość (w oknie prywatnym), na komputerze i na telefonie, na kilku rodzajach stron (strona główna, produkt, kategoria, strona wyników). Każda strona Joomla + Gridbox jest zbudowana inaczej. Jeśli coś działa nie tak, wyłącz tę funkcję i zgłoś problem."
COM_BETTERSEARCH_CHECK_SITE="Sprawdź na stronie, czy zmienione funkcje działają prawidłowo, najlepiej jako gość w oknie prywatnym: wpisz coś w pole wyszukiwania, otwórz wyniki na żywo i stronę wyników."
COM_BETTERSEARCH_SUPPORT="Problemy i pomysły zgłaszaj na <a href=\"https://github.com/merserwis/plg_system_bettersearch/issues\" target=\"_blank\" rel=\"noopener noreferrer\">GitHubie</a>."
; strony ustawień
COM_BETTERSEARCH_TOOL_OFF="To narzędzie jest wyłączone."
COM_BETTERSEARCH_TOOL_OFF_LINK="Włącz je w ustawieniach."
COM_BETTERSEARCH_SAVED="Ustawienia zapisane."
COM_BETTERSEARCH_ERROR_PAGE="Nie ma takiej strony Better Search."
COM_BETTERSEARCH_ERROR_SAVE="Nie udało się zapisać ustawień."
COM_BETTERSEARCH_ERROR_PLUGIN="Nie znaleziono wtyczki Better Search."
; szybka konfiguracja
COM_BETTERSEARCH_SETUP_INTRO="Główne przełączniki wyszukiwarki w jednym miejscu. Przy każdym jest zaznaczone, czy jest zalecany dla większości stron, a przycisk niżej włącza wszystkie zalecane (opcjonalnych nie rusza). Zapisywane są tylko przełączniki, które zmienisz. Szczegóły każdego narzędzia znajdziesz potem na jego stronie."
COM_BETTERSEARCH_SETUP_RECOMMENDED_ALL="Włącz zalecane"
COM_BETTERSEARCH_SETUP_RECOMMENDED_ON="Zalecane"
COM_BETTERSEARCH_SETUP_RECOMMENDED_OFF="Opcjonalne"
COM_BETTERSEARCH_SETUP_SAVED="Szybka konfiguracja zapisana. Zmienione ustawienia: %d."
COM_BETTERSEARCH_SETUP_SAVED_0="Szybka konfiguracja zapisana, bez zmian w ustawieniach."
COM_BETTERSEARCH_SETUP_SAVED_1="Szybka konfiguracja zapisana. Zmienione ustawienia: 1."
COM_BETTERSEARCH_SETUP_LIVE_ENABLED_LABEL="Wyniki na żywo"
COM_BETTERSEARCH_SETUP_LIVE_ENABLED_DESC="Pod polem wyszukiwania otwiera się okno z wynikami, gdy odwiedzający pisze."
COM_BETTERSEARCH_SETUP_REPLACE_RESULTS_LABEL="Strona wyników Better Search"
COM_BETTERSEARCH_SETUP_REPLACE_RESULTS_DESC="Strona wszystkich wyników z Gridbox jest zastąpiona stroną Better Search, z sortowaniem i filtrami."
COM_BETTERSEARCH_SETUP_QS_FORGIVING_LABEL="Wyszukiwanie wyrozumiałe"
COM_BETTERSEARCH_SETUP_QS_FORGIVING_DESC="Znajduje produkt mimo literówki, innej końcówki lub części słowa i podpowiada właściwe słowo („czy chodziło o…”)."
COM_BETTERSEARCH_SETUP_INDEX_PAGES_LABEL="Także strony i wpisy bloga"
COM_BETTERSEARCH_SETUP_INDEX_PAGES_DESC="Wyszukiwarka znajduje też zwykłe strony i wpisy bloga, nie tylko produkty. Włącz, jeśli odwiedzający szukają artykułów."
COM_BETTERSEARCH_SETUP_QS_INDEX_LABEL="Indeks na bieżąco"
COM_BETTERSEARCH_SETUP_QS_INDEX_DESC="Zapisana strona lub produkt jest w wyszukiwarce od razu, a okresowe sprawdzenie łapie resztę."
COM_BETTERSEARCH_SETUP_VOICE_SEARCH_LABEL="Wyszukiwanie głosowe"
COM_BETTERSEARCH_SETUP_VOICE_SEARCH_DESC="Mikrofon w polach wyszukiwania, na wszystkich urządzeniach. Miejsce (wszystkie urządzenia albo tylko mobilne) ustawisz w Konfiguracji."
COM_BETTERSEARCH_SETUP_THUMBNAILS_LABEL="Lżejsze obrazy w wynikach"
COM_BETTERSEARCH_SETUP_THUMBNAILS_DESC="W wynikach są małe kopie obrazów zamiast pełnych, więc otwierają się szybciej."
COM_BETTERSEARCH_SETUP_QS_SEO_LABEL="Optymalizacja pod wyszukiwarki"
COM_BETTERSEARCH_SETUP_QS_SEO_DESC="Przeglądarka może dodać Twoje wyszukiwanie (OpenSearch), a strona wyników ma właściwy adres kanoniczny i dane strukturalne."
COM_BETTERSEARCH_SETUP_LOG_SEARCHES_LABEL="Zapamiętuj wyszukiwania"
COM_BETTERSEARCH_SETUP_LOG_SEARCHES_DESC="Co wpisali odwiedzający i ile dostali wyników, do statystyk (bez danych osobowych)."
COM_BETTERSEARCH_SETUP_TRACK_CONVERSIONS_LABEL="Licz kliknięcia i koszyki"
COM_BETTERSEARCH_SETUP_TRACK_CONVERSIONS_DESC="Które wyszukiwania prowadziły do kliknięcia wyniku i do produktu w koszyku."
COM_BETTERSEARCH_SETUP_REPORT_ENABLED_LABEL="Raport e-mail"
COM_BETTERSEARCH_SETUP_REPORT_ENABLED_DESC="Podsumowanie wyszukiwań wysyłane e-mailem (domyślnie co tydzień). Wymaga adresatów, ustawianych na stronie Statystyki."
COM_BETTERSEARCH_SETUP_FEATURED_BADGE_LABEL="Plakietka wyróżnionych produktów"
COM_BETTERSEARCH_SETUP_FEATURED_BADGE_DESC="Produkt, który ustawisz na początku dla słowa, ma w wynikach plakietkę."
COM_BETTERSEARCH_SETUP_AVAIL_ENABLED_LABEL="Dostępność produktów"
COM_BETTERSEARCH_SETUP_AVAIL_ENABLED_DESC="W wynikach widać: jest, kończy się, brak. Pola z czasem dostawy ustawisz na stronie Produkty."
COM_BETTERSEARCH_SETUP_CART_BUTTON_LABEL="Przycisk „do koszyka”"
COM_BETTERSEARCH_SETUP_CART_BUTTON_DESC="Przycisk na produkcie w wynikach, który wkłada go do koszyka."
COM_BETTERSEARCH_SETUP_QUOTE_BUTTON_LABEL="Przycisk „zapytaj o ofertę”"
COM_BETTERSEARCH_SETUP_QUOTE_BUTTON_DESC="Przycisk przy produktach bez ceny (albo jak wybierzesz), który prowadzi do Twojego formularza lub do e-maila."
