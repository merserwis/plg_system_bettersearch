; sekcje panelu sterowania
COM_BETTERSEARCH_GROUP_SEARCH="Wyszukiwanie"
COM_BETTERSEARCH_GROUP_SEARCH_DESC="Co jest przeszukiwane, jak to jest znajdowane i w jakiej kolejności."
COM_BETTERSEARCH_GROUP_DISPLAY="Wyniki"
COM_BETTERSEARCH_GROUP_DISPLAY_DESC="Wyniki na żywo, strona wyników i ich wygląd."
COM_BETTERSEARCH_GROUP_INSIGHTS="Analiza"
COM_BETTERSEARCH_GROUP_INSIGHTS_DESC="Czego szukają odwiedzający, co z tego wynika i raport."
COM_BETTERSEARCH_GROUP_SHOP="Sklep"
COM_BETTERSEARCH_GROUP_SHOP_DESC="Plakietki, dostępność i przyciski produktów w wynikach."
COM_BETTERSEARCH_GROUP_CONFIG="Konfiguracja"
COM_BETTERSEARCH_GROUP_CONFIG_DESC="Ustawiasz raz i możesz zapomnieć."
; strony narzędzi
COM_BETTERSEARCH_PAGE_INDEX="Indeks"
COM_BETTERSEARCH_PAGE_INDEX_DESC="Indeks to lista stron i produktów, którą czyta wyszukiwarka. Tu zobaczysz, co w nim jest, zaktualizujesz go i wybierzesz, co do niego trafia i jak często jest odświeżany."
COM_BETTERSEARCH_PAGE_ENGINE="Silnik wyszukiwania"
COM_BETTERSEARCH_PAGE_ENGINE_DESC="Jak dopasowywane jest słowo wpisane przez odwiedzającego: literówki, końcówki, synonimy oraz waga tytułu, numeru katalogowego i opisu. Konsola testowa pokazuje, dlaczego każdy wynik jest tam, gdzie jest."
COM_BETTERSEARCH_PAGE_RULES="Reguły"
COM_BETTERSEARCH_PAGE_RULES_DESC="Wybrane produkty na początku dla wybranych słów, większa lub mniejsza waga kategorii i produktów oraz to, czego nie ma być w wynikach."
COM_BETTERSEARCH_PAGE_LIVE="Wyniki na żywo"
COM_BETTERSEARCH_PAGE_LIVE_DESC="Okno wyników, które otwiera się pod polem wyszukiwania, gdy odwiedzający pisze: co pokazuje, jak wygląda i jak się porusza. Podgląd pokazuje niezapisane zmiany."
COM_BETTERSEARCH_PAGE_RESULTS="Strona wyników"
COM_BETTERSEARCH_PAGE_RESULTS_DESC="Strona ze wszystkimi wynikami, która zastępuje stronę Gridbox: sortowanie, filtry, karty i ich wygląd. Podgląd pokazuje niezapisane zmiany."
COM_BETTERSEARCH_PAGE_APPEARANCE="Wygląd"
COM_BETTERSEARCH_PAGE_APPEARANCE_DESC="Motyw wyników na żywo i strony wyników: gotowe motywy, kolory i czcionki, własny CSS oraz sposób zaznaczania znalezionych słów."
COM_BETTERSEARCH_PAGE_STATS="Statystyki"
COM_BETTERSEARCH_PAGE_STATS_DESC="Czego szukają odwiedzający, które wyszukiwania nic nie znajdują i które kończą się kliknięciem lub zamówieniem. Tu jest też raport e-mail i Google Search Console."
COM_BETTERSEARCH_PAGE_PRODUCTS="Produkty"
COM_BETTERSEARCH_PAGE_PRODUCTS_DESC="Plakietki, dostępność, czas dostawy i przyciski (do koszyka, zapytaj o ofertę) produktów pokazywanych w wynikach."
COM_BETTERSEARCH_PAGE_CONFIG="Konfiguracja"
COM_BETTERSEARCH_PAGE_CONFIG_DESC="To, co ustawia się raz i zapomina: wyszukiwanie głosowe, optymalizacja pod wyszukiwarki, teksty i obrazy, plik ustawień i informacje ogólne."
; zakładki konfiguracji jako kafelki
COM_BETTERSEARCH_CFG_VOICE="Wyszukiwanie głosowe"
COM_BETTERSEARCH_CFG_VOICE_DESC="Mikrofon w polach wyszukiwania; wypowiedziane słowa pokazują wyniki na żywo albo otwierają stronę wyników."
COM_BETTERSEARCH_CFG_SEO="Optymalizacja pod wyszukiwarki"
COM_BETTERSEARCH_CFG_SEO_DESC="Reguły dla robotów i adres kanoniczny strony wyników, tytuły, dane strukturalne i pole wyszukiwania dla przeglądarek."
COM_BETTERSEARCH_CFG_TEXTS="Teksty i obrazy"
COM_BETTERSEARCH_CFG_TEXTS_DESC="Każdy tekst, który odwiedzający czyta w wynikach, w języku strony, oraz lżejsze kopie obrazów."
COM_BETTERSEARCH_CFG_BACKUP="Plik ustawień"
COM_BETTERSEARCH_CFG_BACKUP_DESC="Zapisz ustawienia do pliku, wczytaj je na innej stronie albo wróć do wartości domyślnych."
COM_BETTERSEARCH_CFG_BASIC="Ogólne"
COM_BETTERSEARCH_CFG_BASIC_DESC="Przełącznik między ustawieniami podstawowymi a zaawansowanymi i miejsce zgłaszania problemów."
; panel sterowania
COM_BETTERSEARCH_STATE_ON="Włączone"
COM_BETTERSEARCH_STATE_OFF="Wyłączone"
COM_BETTERSEARCH_NO_PLUGIN="Nie znaleziono wtyczki System - Better Search for Gridbox. Zainstaluj ponownie pakiet Better Search."
COM_BETTERSEARCH_PLUGIN_OFF="Wtyczka System - Better Search for Gridbox jest wyłączona, więc wyszukiwarka nie działa, a jej ustawień nie można pokazać."
COM_BETTERSEARCH_ENABLE="Włącz wtyczkę"
COM_BETTERSEARCH_ENABLED="Wtyczka Better Search jest włączona."
COM_BETTERSEARCH_NO_GRIDBOX="Gridbox nie jest zainstalowany albo jest wyłączony. Better Search działa tylko razem z Balbooa Gridbox."
COM_BETTERSEARCH_START_TITLE="Zacznij od szybkiej konfiguracji"
COM_BETTERSEARCH_START_TEXT="Kilka przełączników z zalecanymi wartościami ustawia wyszukiwarkę. Resztę znajdziesz później w kafelkach poniżej. Potem zaktualizuj indeks na stronie Indeks."
COM_BETTERSEARCH_START_BUTTON="Szybka konfiguracja"
