PLG_SYSTEM_BETTERSEARCH="System - Better Search for Gridbox"
PLG_SYSTEM_BETTERSEARCH_XML_DESCRIPTION="Vervangt de zoekfunctie van Gridbox: live resultaten onder de zoekvelden en de resultatenpagina, vanuit een eigen index waarin modelcodes overeenkomen, hoe ze ook worden getypt (MI 3155 = MI3155 = MI-3155). Handmatige rangschikking, uitsluitingen en volledige controle over de weergave."
PLG_SYSTEM_BETTERSEARCH_INSTALL_NO_GRIDBOX="Better Search for Gridbox werkt met Balbooa Gridbox, dat niet op deze site is geïnstalleerd."
PLG_SYSTEM_BETTERSEARCH_INSTALL_BUILD_INDEX="Better Search for Gridbox: open de plugin, tabblad “Index & hulpmiddelen”, en klik op “Index bijwerken” om de zoekindex op te bouwen (deze wordt ook automatisch opgebouwd bij de eerste bezoeken)."

