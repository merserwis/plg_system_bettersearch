PLG_SYSTEM_BETTERSEARCH_RULES_NOTE="<b>Handmatige volgorde:</b> zet producten bovenaan de resultaten van gekozen zoekopdrachten, in de volgorde die u bepaalt (sleep de producten). <b>Verbergen</b> verwijdert producten uit de resultaten van deze zoekopdrachten. Boosts verplaatsen producten of hele categorieën bij elke zoekopdracht omhoog (positief) of omlaag (negatief)."
