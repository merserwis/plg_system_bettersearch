; ---------------------------------------------------------------- general
PLG_SYSTEM_BETTERSEARCH_INFO_LABEL="Better Search for Gridbox"
PLG_SYSTEM_BETTERSEARCH_INFO_DESC="De zoekvelden van Gridbox (winkelzoekfunctie en zoekelementen) tonen live resultaten van deze plugin, en de Gridbox-pagina met zoekresultaten toont de resultaten ervan. Modelcodes worden gevonden, hoe ze ook worden getypt: <b>MI 3155</b>, <b>MI3155</b> en <b>MI-3155</b> zijn hetzelfde product. Bouw na de installatie de index op via het tabblad <b>Index &amp; hulpmiddelen</b>."
PLG_SYSTEM_BETTERSEARCH_APPS_LABEL="Doorzochte apps"
PLG_SYSTEM_BETTERSEARCH_APPS_DESC="Gridbox-apps waarvan de pagina's worden gevonden. Leeg = alle winkelapps. Voeg blogapps toe om ook artikelen te vinden (die worden als eigen groep getoond)."
PLG_SYSTEM_BETTERSEARCH_LIVE_ENABLED_LABEL="Live resultaten"
PLG_SYSTEM_BETTERSEARCH_LIVE_ENABLED_DESC="Resultaten onder het zoekveld tijdens het typen. Uit = het veld leidt alleen naar de resultatenpagina."
PLG_SYSTEM_BETTERSEARCH_REPLACE_RESULTS_LABEL="Resultatenpagina vervangen"
PLG_SYSTEM_BETTERSEARCH_REPLACE_RESULTS_DESC="De Gridbox-pagina met zoekresultaten toont de resultaten van deze plugin (Gridbox zoekt dan helemaal niet zelf)."
PLG_SYSTEM_BETTERSEARCH_RESULTS_URL_LABEL="Adres van de resultatenpagina"
PLG_SYSTEM_BETTERSEARCH_RESULTS_URL_DESC="Waar Enter en “Alle resultaten tonen” naartoe leiden, bijv. /szukaj. Leeg = het adres dat in het Gridbox-zoekelement is ingesteld (of de zoekpagina van de Gridbox-winkel)."
PLG_SYSTEM_BETTERSEARCH_SELECTOR_LABEL="Zoekvelden (CSS-selector)"
PLG_SYSTEM_BETTERSEARCH_SELECTOR_DESC="Velden die de plugin overneemt. Leeg = de Gridbox-zoekvelden en het veld van de Better Search-module."
PLG_SYSTEM_BETTERSEARCH_LOAD_EVERYWHERE_LABEL="Op elke pagina laden"
PLG_SYSTEM_BETTERSEARCH_LOAD_EVERYWHERE_DESC="Het script wordt alleen toegevoegd aan pagina's met een Gridbox-zoekveld. Zet dit aan wanneer u een eigen selector gebruikt voor velden van andere extensies."
PLG_SYSTEM_BETTERSEARCH_ICON_SUBMIT_LABEL="Vergrootglaspictogram zoekt"
PLG_SYSTEM_BETTERSEARCH_ICON_SUBMIT_DESC="Een klik op het pictogram van een Gridbox-zoekveld opent de resultatenpagina (Gridbox gebruikt het om het veld te wissen)."
PLG_SYSTEM_BETTERSEARCH_AUTO_SYNC_LABEL="Index automatisch bijwerken"
PLG_SYSTEM_BETTERSEARCH_AUTO_SYNC_DESC="Gridbox slaat producten op zonder andere extensies op de hoogte te stellen. De plugin vergelijkt de producten met de index nadat de pagina van een bezoeker is verzonden en indexeert nieuwe en gewijzigde producten."
PLG_SYSTEM_BETTERSEARCH_SYNC_INTERVAL_LABEL="Controleren elke (minuten)"
PLG_SYSTEM_BETTERSEARCH_SYNC_INTERVAL_DESC="Hoe vaak de index met Gridbox wordt vergeleken. Een gewijzigd product is uiterlijk na deze tijd onder zijn nieuwe naam te vinden."
PLG_SYSTEM_BETTERSEARCH_SYNC_BUDGET_LABEL="Producten per controle"
PLG_SYSTEM_BETTERSEARCH_SYNC_BUDGET_DESC="Bij één automatische controle worden hooguit zoveel producten geïndexeerd; de rest volgt bij de volgende controles."
PLG_SYSTEM_BETTERSEARCH_CACHE_LABEL="Resultaten in cache (minuten)"
PLG_SYSTEM_BETTERSEARCH_CACHE_DESC="Resultaten van dezelfde zoekopdracht worden zo lang bewaard. Elke indexupdate en elke wijziging van de instellingen begint opnieuw. 0 = geen cache."
PLG_SYSTEM_BETTERSEARCH_LOG_LABEL="Zoekstatistieken"
PLG_SYSTEM_BETTERSEARCH_LOG_DESC="Telt de zoekopdrachten van de resultatenpagina (geen persoonsgegevens): meest gezocht, zonder resultaten. Zie tabblad “Index &amp; hulpmiddelen”."
PLG_SYSTEM_BETTERSEARCH_SUPPORT_LABEL="Project &amp; ondersteuning"
PLG_SYSTEM_BETTERSEARCH_SUPPORT_DESC="<a href=\"https://github.com/merserwis/\" target=\"_blank\" rel=\"noopener\">github.com/merserwis</a>"

; ---------------------------------------------------------------- engine
PLG_SYSTEM_BETTERSEARCH_ENGINE_NOTE="Elk woord van de zoekopdracht moet in een product voorkomen. Aangrenzende delen van een modelcode vormen één woord: <b>MI 3155</b> wordt gezocht als <b>mi3155</b> en komt ook overeen met “MI-3155” of “MI3155” in het product. Wijzigingen op dit tabblad gelden voor de index: werk deze bij op het tabblad “Index &amp; hulpmiddelen” (of wacht op de automatische controle)."
PLG_SYSTEM_BETTERSEARCH_INDEX_FIELDS_LABEL="Te doorzoeken productvelden"
PLG_SYSTEM_BETTERSEARCH_INDEX_FIELDS_DESC="Waarden van deze Gridbox-velden worden gevonden (bijv. fabrikant, model, parameters). Laat velden weg die veel producten delen, zoals contactpersonen — anders zou elk product op hun namen overeenkomen."
PLG_SYSTEM_BETTERSEARCH_INDEX_VARIATION_SKU_LABEL="Variantcodes (SKU) doorzoeken"
PLG_SYSTEM_BETTERSEARCH_INDEX_PARENT_CATS_LABEL="Namen van bovenliggende categorieën doorzoeken"
PLG_SYSTEM_BETTERSEARCH_INDEX_PARENT_CATS_DESC="Een zoekopdracht met een categorienaam vindt ook de producten van de subcategorieën."
PLG_SYSTEM_BETTERSEARCH_INDEX_TAGS_LABEL="Tags doorzoeken"
PLG_SYSTEM_BETTERSEARCH_INDEX_REDIRECTS_LABEL="Producten vinden via doorverwijzingen"
PLG_SYSTEM_BETTERSEARCH_INDEX_REDIRECTS_DESC="Doorverwijzingen van Joomla (component Doorverwijzingen): een product waarvan het adres naar een ander product wordt doorverwezen, geeft dat product zijn oude naam. Zoeken op de oude naam (bijv. AAA) toont het nieuwe product (BBB) met het label “Vervangen”. De oude naam is de titel van het oude product (als het nog in Gridbox staat, bijv. gedepubliceerd), anders de woorden van zijn adres, plus de notitie van de doorverwijzing."
PLG_SYSTEM_BETTERSEARCH_SEARCH_BODY_LABEL="Beschrijvingen doorzoeken"
PLG_SYSTEM_BETTERSEARCH_SEARCH_BODY_DESC="Woorden die alleen in beschrijvingen voorkomen, tellen veel minder dan in namen, codes, velden en categorieën."
PLG_SYSTEM_BETTERSEARCH_INDEX_INTRO_LABEL="Introtekst"
PLG_SYSTEM_BETTERSEARCH_INDEX_META_LABEL="Metabeschrijving en trefwoorden"
PLG_SYSTEM_BETTERSEARCH_INDEX_CONTENT_LABEL="Pagina-inhoud"
PLG_SYSTEM_BETTERSEARCH_INDEX_CONTENT_DESC="De tekst van de lay-out van de productpagina (tabbladen, beschrijvingen, specificaties)."
PLG_SYSTEM_BETTERSEARCH_CONTENT_LIMIT_LABEL="Tekens beschrijving per product"
PLG_SYSTEM_BETTERSEARCH_MIN_CHARS_LABEL="Minimale lengte van de zoekopdracht"
PLG_SYSTEM_BETTERSEARCH_STEMMING_LABEL="Woorduitgangen"
PLG_SYSTEM_BETTERSEARCH_STEMMING_DESC="“zoekopdrachten” vindt ook “zoekopdracht”, “Messgeräten” vindt “Messgerät”. Eenvoudige regels: altijd Pools (met Engelse meervouden), plus die van de taal van de site — Engels, Duits, Frans, Tsjechisch of Nederlands."
PLG_SYSTEM_BETTERSEARCH_TYPO_LABEL="Typfoutcorrectie"
PLG_SYSTEM_BETTERSEARCH_TYPO_DESC="Als er niets wordt gevonden, worden woorden die de index niet kent vervangen door het dichtstbijzijnde bekende woord (“eurotset” → “eurotest”)."
PLG_SYSTEM_BETTERSEARCH_PARTIAL_LABEL="Gedeeltelijke overeenkomsten"
PLG_SYSTEM_BETTERSEARCH_PARTIAL_DESC="Als geen enkel product alle woorden bevat, worden de producten met de meeste ervan getoond (met een melding)."
PLG_SYSTEM_BETTERSEARCH_MIN_RELEVANCE_LABEL="Zwakke overeenkomsten weglaten (%)"
PLG_SYSTEM_BETTERSEARCH_MIN_RELEVANCE_DESC="Resultaten die lager scoren dan dit percentage van het beste resultaat worden weggelaten (bijv. producten die het woord alleen diep in de beschrijving noemen). 0 = alles behouden."
PLG_SYSTEM_BETTERSEARCH_SYNONYMS_LABEL="Synoniemen"
PLG_SYSTEM_BETTERSEARCH_SYNONYMS_DESC="Eén groep per regel, gescheiden door komma's: <code>multimetr, miernik uniwersalny</code> — elk woord vindt de andere. In één richting: <code>rcd =&gt; wyłącznik różnicowoprądowy</code>. Regels die met # beginnen, worden genegeerd."
PLG_SYSTEM_BETTERSEARCH_STOPWORDS_LABEL="Genegeerde woorden"
PLG_SYSTEM_BETTERSEARCH_STOPWORDS_DESC="Gescheiden door komma’s. Genegeerd tenzij de zoekopdracht niets anders bevat, en nooit binnen een modelcode (“A 1199”). Leeg = de ingebouwde lijst: Poolse en Engelse woorden plus die van de taal van de site (Duits, Frans, Tsjechisch of Nederlands)."
PLG_SYSTEM_BETTERSEARCH_STOPWORDS_HINT="Leeg = ingebouwde lijst voor de taal van de site"
PLG_SYSTEM_BETTERSEARCH_WEIGHTS_LABEL="Gewichten"
PLG_SYSTEM_BETTERSEARCH_WEIGHTS_DESC="Hoeveel een woord telt, afhankelijk van waar het wordt gevonden. De testconsole op het tabblad “Index &amp; hulpmiddelen” toont de score van elk resultaat en waarom."
PLG_SYSTEM_BETTERSEARCH_W_SKU_LABEL="Productcode (SKU)"
PLG_SYSTEM_BETTERSEARCH_W_TITLE_LABEL="Naam"
PLG_SYSTEM_BETTERSEARCH_W_FIELDS_LABEL="Velden"
