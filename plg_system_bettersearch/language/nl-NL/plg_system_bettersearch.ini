PLG_SYSTEM_BETTERSEARCH_W_BODY_LABEL="Beschrijvingen"
PLG_SYSTEM_BETTERSEARCH_W_DIGITS_LABEL="Woorden met cijfers ×"
PLG_SYSTEM_BETTERSEARCH_W_DIGITS_DESC="Modelnummers zeggen meer dan woorden: hun gewicht wordt met deze factor vermenigvuldigd."
PLG_SYSTEM_BETTERSEARCH_POPULARITY_LABEL="Populariteit"
PLG_SYSTEM_BETTERSEARCH_POPULARITY_DESC="Punten voor paginaweergaven (logaritmisch): bij gelijke overeenkomsten komt het vaker bekeken product eerst. 0 = uit."
PLG_SYSTEM_BETTERSEARCH_MAX_CANDIDATES_LABEL="Maximaal aantal kandidaten per zoekopdracht"

