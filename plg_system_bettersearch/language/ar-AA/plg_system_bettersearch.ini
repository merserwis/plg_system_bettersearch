PLG_SYSTEM_BETTERSEARCH_INSTANT_REINDEX_LABEL="تحديث الفهرس فور أي تغيير"
PLG_SYSTEM_BETTERSEARCH_INSTANT_REINDEX_DESC="عند حفظ صفحة أو منتج في Gridbox أو نشره أو إلغاء نشره أو نقله إلى المهملات (في محرر Gridbox أو في القوائم)، تُعاد فهرسة العناصر المعدّلة مباشرة بعد ذلك الطلب، فيُظهر البحث التغيير فورًا بدل انتظار التحقق التالي."
PLG_SYSTEM_BETTERSEARCH_TRACK_CONVERSIONS_LABEL="إحصاءات التحويل"
PLG_SYSTEM_BETTERSEARCH_TRACK_CONVERSIONS_DESC="عدّ النقرات على نتائج البحث والمنتجات المضافة إلى السلة بعد هذه النقرة، لكل استعلام (الأدوات ← التحويلات). يربط ملف تعريف ارتباط من الطرف الأول (bs_src: معرّف المنتج ← الاستعلام، لمدة 30 يومًا) السلة بالبحث؛ ولا تُخزَّن أي بيانات شخصية."
PLG_SYSTEM_BETTERSEARCH_REDIRECTS_LABEL="عمليات إعادة التوجيه"
PLG_SYSTEM_BETTERSEARCH_REDIRECTS_DESC="واحدة في كل سطر: العبارات (مفصولة بفواصل) =&gt; العنوان، واختياريًا | التسمية. البحث عن تلك العبارة بالضبط (بأي طريقة كُتبت: «MI-3155» = «mi 3155») يفتح العنوان بدل صفحة النتائج؛ وتعرضه النتائج الفورية كأول خيار. العناوين: مسار في هذا الموقع (/oferta/…) أو عنوان http(s)."
PLG_SYSTEM_BETTERSEARCH_DID_YOU_MEAN_LABEL="«هل تقصد…»"
PLG_SYSTEM_BETTERSEARCH_DID_YOU_MEAN_DESC="عند عدم العثور على شيء، اقترح عمليات بحث لها نتائج وتُكتب بشكل شبه مطابق (من إحصاءات البحث)."
PLG_SYSTEM_BETTERSEARCH_LIVE_SUGGESTIONS_LABEL="اقتراح عمليات البحث الشائعة"
PLG_SYSTEM_BETTERSEARCH_LIVE_SUGGESTIONS_DESC="فوق النتائج الفورية: عمليات بحث لها نتائج وتبدأ مثل النص المكتوب، الأكثر بحثًا أولًا (من إحصاءات البحث). النقر عليها يبحث عنها."
PLG_SYSTEM_BETTERSEARCH_LIVE_SUGGESTIONS_LIMIT_LABEL="عدد الاقتراحات"
PLG_SYSTEM_BETTERSEARCH_SUGGEST_MIN_SEARCHES_LABEL="الاقتراح بعد … عمليات بحث"
PLG_SYSTEM_BETTERSEARCH_SUGGEST_MIN_SEARCHES_DESC="لا تُقترح العبارة إلا إذا بُحث عنها هذا العدد من المرات على الأقل (فلا يُقترح خطأ إملائي عابر على الآخرين)."
PLG_SYSTEM_BETTERSEARCH_PAGE_FACETS_LABEL="عوامل التصفية بجانب النتائج"
PLG_SYSTEM_BETTERSEARCH_PAGE_FACETS_DESC="العلامة التجارية ونطاق السعر والتخفيضات فقط والمتوفر فقط. يُظهر كل عامل تصفية عدد النتائج التي يُبقيها؛ ولا تُعرض العوامل التي لن تغيّر شيئًا."
