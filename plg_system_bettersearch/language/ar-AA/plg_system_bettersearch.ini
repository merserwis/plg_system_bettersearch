; ---------------------------------------------------------------- عام
PLG_SYSTEM_BETTERSEARCH_INFO_LABEL="Better Search for Gridbox"
PLG_SYSTEM_BETTERSEARCH_INFO_DESC="تعرض حقول البحث في Gridbox (بحث المتجر وعناصر البحث) نتائج فورية من هذه الإضافة، وتسرد صفحة نتائج بحث Gridbox نتائجها. يُعثر على رموز الطرازات أيًّا كانت طريقة كتابتها: <b>MI 3155</b> و<b>MI3155</b> و<b>MI-3155</b> هي المنتج نفسه. بعد التثبيت، ابنِ الفهرس من التبويب <b>الفهرس &amp; الأدوات</b>."
PLG_SYSTEM_BETTERSEARCH_APPS_LABEL="التطبيقات المشمولة بالبحث"
PLG_SYSTEM_BETTERSEARCH_APPS_DESC="تطبيقات Gridbox التي يُبحث في صفحاتها. فارغ = جميع تطبيقات المتجر. أضف تطبيقات المدونة للعثور على المقالات أيضًا (تُعرض كمجموعة مستقلة)."
PLG_SYSTEM_BETTERSEARCH_LIVE_ENABLED_LABEL="النتائج الفورية"
PLG_SYSTEM_BETTERSEARCH_LIVE_ENABLED_DESC="نتائج أسفل حقل البحث أثناء الكتابة. معطّل = يقود الحقل إلى صفحة النتائج فقط."
PLG_SYSTEM_BETTERSEARCH_REPLACE_RESULTS_LABEL="استبدال صفحة النتائج"
PLG_SYSTEM_BETTERSEARCH_REPLACE_RESULTS_DESC="تعرض صفحة نتائج بحث Gridbox نتائج هذه الإضافة (لا يجري Gridbox أي بحث)."
PLG_SYSTEM_BETTERSEARCH_RESULTS_URL_LABEL="عنوان صفحة النتائج"
PLG_SYSTEM_BETTERSEARCH_RESULTS_URL_DESC="الوجهة التي يقود إليها Enter و«عرض كل النتائج»، مثل /szukaj. فارغ = العنوان المحدد في عنصر بحث Gridbox (أو صفحة بحث متجر Gridbox)."
PLG_SYSTEM_BETTERSEARCH_SELECTOR_LABEL="حقول البحث (محدد CSS)"
PLG_SYSTEM_BETTERSEARCH_SELECTOR_DESC="الحقول التي تتولاها الإضافة. فارغ = حقول بحث Gridbox وحقل وحدة Better Search."
PLG_SYSTEM_BETTERSEARCH_LOAD_EVERYWHERE_LABEL="التحميل في كل صفحة"
PLG_SYSTEM_BETTERSEARCH_LOAD_EVERYWHERE_DESC="يُضاف السكربت فقط إلى الصفحات التي تحتوي على حقل بحث Gridbox. فعّله عند استخدام محدد خاص لحقول إضافات أخرى."
PLG_SYSTEM_BETTERSEARCH_ICON_SUBMIT_LABEL="أيقونة العدسة تبدأ البحث"
PLG_SYSTEM_BETTERSEARCH_ICON_SUBMIT_DESC="النقر على أيقونة حقل بحث Gridbox يفتح صفحة النتائج (يستخدمها Gridbox لمسح الحقل)."
PLG_SYSTEM_BETTERSEARCH_AUTO_SYNC_LABEL="تحديث الفهرس تلقائيًا"
PLG_SYSTEM_BETTERSEARCH_AUTO_SYNC_DESC="يحفظ Gridbox المنتجات دون إشعار الإضافات الأخرى. تقارن الإضافة المنتجات بالفهرس بعد إرسال صفحة الزائر، وتفهرس المنتجات الجديدة والمعدّلة."
PLG_SYSTEM_BETTERSEARCH_SYNC_INTERVAL_LABEL="التحقق كل (دقائق)"
PLG_SYSTEM_BETTERSEARCH_SYNC_INTERVAL_DESC="عدد مرات مقارنة الفهرس مع Gridbox. يمكن العثور على المنتج المعدّل باسمه الجديد بعد هذه المدة كحد أقصى."
PLG_SYSTEM_BETTERSEARCH_SYNC_BUDGET_LABEL="عدد المنتجات في كل تحقق"
PLG_SYSTEM_BETTERSEARCH_SYNC_BUDGET_DESC="يُفهرس هذا العدد من المنتجات كحد أقصى في تحقق تلقائي واحد؛ ويُستكمل الباقي في عمليات التحقق التالية."
PLG_SYSTEM_BETTERSEARCH_CACHE_LABEL="تخزين النتائج مؤقتًا (دقائق)"
PLG_SYSTEM_BETTERSEARCH_CACHE_DESC="تُحفظ نتائج الاستعلام نفسه طوال هذه المدة. كل تحديث للفهرس وكل تغيير في الإعدادات يبدأ من جديد. 0 = بلا تخزين مؤقت."
PLG_SYSTEM_BETTERSEARCH_LOG_LABEL="إحصاءات البحث"
PLG_SYSTEM_BETTERSEARCH_LOG_DESC="يحصي استعلامات صفحة النتائج (دون بيانات شخصية): الأكثر بحثًا، وبلا نتائج. راجع التبويب «الفهرس &amp; الأدوات»."
PLG_SYSTEM_BETTERSEARCH_SUPPORT_LABEL="المشروع &amp; الدعم"
