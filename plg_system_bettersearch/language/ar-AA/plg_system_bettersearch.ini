PLG_SYSTEM_BETTERSEARCH_FIELDSET_GSC="Google Search Console"
PLG_SYSTEM_BETTERSEARCH_GSC_NOTE="<p class=\"mb-1\">الاستعلامات التي يستخدمها الناس في Google للعثور على موقعك، بجانب ما يجده لهم هذا البحث: العبارات التي لا نتائج لها هنا مرشّحة للمرادفات أو لإعادة التوجيه.</p><p class=\"mb-0\"><strong>تلقائيًا (مرة يوميًا):</strong> أنشئ حساب خدمة في Google Cloud، وفعّل «Google Search Console API»، وأضف عنوان البريد الإلكتروني للحساب كمستخدم لموقعك في Search Console، والصق مفتاح JSON الخاص به أدناه. <strong>بدون مفتاح:</strong> صدّر جدول «طلبات البحث» من Search Console كملف CSV واستورده بالزر أدناه.</p>"
