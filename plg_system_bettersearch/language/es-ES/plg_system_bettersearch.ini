; 1.4.0
PLG_SYSTEM_BETTERSEARCH_INSTANT_REINDEX_LABEL="Actualizar el índice justo después de un cambio"
PLG_SYSTEM_BETTERSEARCH_INSTANT_REINDEX_DESC="Cuando una página o un producto de Gridbox se guarda, publica, despublica o envía a la papelera (en el editor de Gridbox o en las listas), los elementos modificados se vuelven a indexar justo después de esa petición, de modo que la búsqueda muestra el cambio al instante y no tras la siguiente comprobación."
PLG_SYSTEM_BETTERSEARCH_TRACK_CONVERSIONS_LABEL="Estadísticas de conversión"
PLG_SYSTEM_BETTERSEARCH_TRACK_CONVERSIONS_DESC="Cuenta los clics en los resultados de búsqueda y los productos añadidos al carrito tras ese clic, por consulta (Herramientas → Conversiones). Una cookie propia (bs_src: id de producto → consulta, durante 30 días) vincula el carrito con la búsqueda; no se guardan datos personales."
PLG_SYSTEM_BETTERSEARCH_REDIRECTS_LABEL="Redirecciones"
PLG_SYSTEM_BETTERSEARCH_REDIRECTS_DESC="Una por línea: frases (separadas por comas) =&gt; dirección, opcionalmente | etiqueta. Una búsqueda de exactamente esa frase (escrita de cualquier forma: «MI-3155» = «mi 3155») abre la dirección en lugar de la página de resultados; los resultados en vivo la muestran como primera opción. Direcciones: una ruta de este sitio (/oferta/…) o una dirección http(s)."
PLG_SYSTEM_BETTERSEARCH_DID_YOU_MEAN_LABEL="«Quizás quiso decir…»"
PLG_SYSTEM_BETTERSEARCH_DID_YOU_MEAN_DESC="Cuando no se encuentra nada, sugerir búsquedas con resultados que se escriben casi igual (a partir de las estadísticas de búsqueda)."
PLG_SYSTEM_BETTERSEARCH_LIVE_SUGGESTIONS_LABEL="Sugerir búsquedas populares"
PLG_SYSTEM_BETTERSEARCH_LIVE_SUGGESTIONS_DESC="Encima de los resultados en vivo: búsquedas con resultados que empiezan como el texto escrito, las más buscadas primero (a partir de las estadísticas de búsqueda). Un clic la busca."
