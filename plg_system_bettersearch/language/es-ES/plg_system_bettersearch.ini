PLG_SYSTEM_BETTERSEARCH="Sistema - Better Search for Gridbox"
PLG_SYSTEM_BETTERSEARCH_XML_DESCRIPTION="Sustituye la búsqueda de Gridbox: resultados en vivo bajo los campos de búsqueda y página de resultados, a partir de un índice propio en el que los códigos de modelo coinciden se escriban como se escriban (MI 3155 = MI3155 = MI-3155). Orden manual, exclusiones y control total del aspecto."
PLG_SYSTEM_BETTERSEARCH_INSTALL_NO_GRIDBOX="Better Search for Gridbox funciona con Balbooa Gridbox, que no está instalado en este sitio."
PLG_SYSTEM_BETTERSEARCH_INSTALL_BUILD_INDEX="Better Search for Gridbox: abra el plugin, pestaña «Índice & herramientas», y haga clic en «Actualizar índice» para crear el índice de búsqueda (también se crea automáticamente en las primeras visitas)."

