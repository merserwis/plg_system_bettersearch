PLG_SYSTEM_BETTERSEARCH_SEO_CANONICAL_DESC="La dirección canónica de la página de resultados es la página solo con la consulta, sin ordenación, filtros, número de página ni otros parámetros. Sustituye a la dirección canonical establecida por la plantilla (que a menudo apunta a la página de inicio)."
PLG_SYSTEM_BETTERSEARCH_SEO_TITLE_LABEL="Título de la página con la consulta"
PLG_SYSTEM_BETTERSEARCH_SEO_TITLE_DESC="El título de la página de resultados (pestaña del navegador, buscadores, enlaces compartidos) indica la consulta y el número de resultados. El nombre del sitio se añade según la Configuración global."
