PLG_SYSTEM_BETTERSEARCH_FIELDSET_GSC="Google Search Console"
PLG_SYSTEM_BETTERSEARCH_GSC_NOTE="<p class=\"mb-1\">Consultas que la gente usa en Google para encontrar su sitio, junto a lo que esta búsqueda encuentra para ellas: las frases sin resultados aquí son candidatas a sinónimos o redirecciones.</p><p class=\"mb-0\"><strong>Automático (una vez al día):</strong> cree una cuenta de servicio en Google Cloud, active la «Google Search Console API», añada la dirección de correo electrónico de la cuenta como usuario de su propiedad de Search Console y pegue su clave JSON abajo. <strong>Sin clave:</strong> exporte la tabla «Consultas» de Search Console como CSV e impórtela con el botón de abajo.</p>"
