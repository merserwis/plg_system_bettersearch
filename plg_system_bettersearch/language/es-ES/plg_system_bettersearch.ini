PLG_SYSTEM_BETTERSEARCH_SEO_NOFOLLOW_DESC="Los enlaces que solo reordenan o filtran una búsqueda reciben rel=«nofollow», para que los robots de los buscadores no rastreen sus infinitas combinaciones en lugar de la tienda."
