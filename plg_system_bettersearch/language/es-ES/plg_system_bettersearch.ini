; ---------------------------------------------------------------- general
PLG_SYSTEM_BETTERSEARCH_INFO_LABEL="Better Search for Gridbox"
PLG_SYSTEM_BETTERSEARCH_INFO_DESC="Los campos de búsqueda de Gridbox (búsqueda de la tienda y elementos de búsqueda) muestran resultados en vivo de este plugin, y la página de resultados de búsqueda de Gridbox presenta sus resultados. Los códigos de modelo se encuentran se escriban como se escriban: <b>MI 3155</b>, <b>MI3155</b> y <b>MI-3155</b> son el mismo producto. Tras la instalación, cree el índice en la pestaña <b>Índice &amp; herramientas</b>."
PLG_SYSTEM_BETTERSEARCH_APPS_LABEL="Aplicaciones en las que buscar"
PLG_SYSTEM_BETTERSEARCH_APPS_DESC="Aplicaciones de Gridbox cuyas páginas se encuentran. Vacío = todas las aplicaciones de tienda. Añada aplicaciones de blog para encontrar también artículos (se muestran como grupo propio)."
PLG_SYSTEM_BETTERSEARCH_LIVE_ENABLED_LABEL="Resultados en vivo"
PLG_SYSTEM_BETTERSEARCH_LIVE_ENABLED_DESC="Resultados bajo el campo de búsqueda mientras se escribe. Desactivado = el campo solo lleva a la página de resultados."
PLG_SYSTEM_BETTERSEARCH_REPLACE_RESULTS_LABEL="Sustituir la página de resultados"
PLG_SYSTEM_BETTERSEARCH_REPLACE_RESULTS_DESC="La página de resultados de búsqueda de Gridbox muestra los resultados de este plugin (Gridbox no realiza ninguna búsqueda)."
PLG_SYSTEM_BETTERSEARCH_RESULTS_URL_LABEL="Dirección de la página de resultados"
PLG_SYSTEM_BETTERSEARCH_RESULTS_URL_DESC="Adónde llevan Intro y «Ver todos los resultados», p. ej. /szukaj. Vacío = la dirección configurada en el elemento de búsqueda de Gridbox (o la página de búsqueda de la tienda Gridbox)."
PLG_SYSTEM_BETTERSEARCH_SELECTOR_LABEL="Campos de búsqueda (selector CSS)"
PLG_SYSTEM_BETTERSEARCH_SELECTOR_DESC="Campos que gestiona el plugin. Vacío = los campos de búsqueda de Gridbox y el campo del módulo Better Search."
PLG_SYSTEM_BETTERSEARCH_LOAD_EVERYWHERE_LABEL="Cargar en todas las páginas"
PLG_SYSTEM_BETTERSEARCH_LOAD_EVERYWHERE_DESC="El script solo se añade a las páginas con un campo de búsqueda de Gridbox. Actívelo si usa un selector propio para campos de otras extensiones."
PLG_SYSTEM_BETTERSEARCH_ICON_SUBMIT_LABEL="El icono de lupa busca"
PLG_SYSTEM_BETTERSEARCH_ICON_SUBMIT_DESC="Al hacer clic en el icono de un campo de búsqueda de Gridbox se abre la página de resultados (Gridbox lo usa para vaciar el campo)."
PLG_SYSTEM_BETTERSEARCH_AUTO_SYNC_LABEL="Actualizar el índice automáticamente"
PLG_SYSTEM_BETTERSEARCH_AUTO_SYNC_DESC="Gridbox guarda los productos sin avisar a otras extensiones. El plugin compara los productos con el índice después de enviar la página a un visitante e indexa los nuevos y los modificados."
PLG_SYSTEM_BETTERSEARCH_SYNC_INTERVAL_LABEL="Comprobar cada (minutos)"
PLG_SYSTEM_BETTERSEARCH_SYNC_INTERVAL_DESC="Con qué frecuencia se compara el índice con Gridbox. Un producto modificado se podrá encontrar por su nuevo nombre como máximo tras este tiempo."
PLG_SYSTEM_BETTERSEARCH_SYNC_BUDGET_LABEL="Productos por comprobación"
PLG_SYSTEM_BETTERSEARCH_SYNC_BUDGET_DESC="Como máximo se indexan estos productos en una comprobación automática; el resto, en las siguientes."
PLG_SYSTEM_BETTERSEARCH_CACHE_LABEL="Caché de resultados (minutos)"
PLG_SYSTEM_BETTERSEARCH_CACHE_DESC="Los resultados de una misma consulta se guardan durante este tiempo. Cada actualización del índice y cada cambio de configuración vacían la caché. 0 = sin caché."
PLG_SYSTEM_BETTERSEARCH_LOG_LABEL="Estadísticas de búsqueda"
PLG_SYSTEM_BETTERSEARCH_LOG_DESC="Cuenta las consultas de la página de resultados (sin datos personales): las más buscadas, sin resultados. Véase la pestaña «Índice &amp; herramientas»."
PLG_SYSTEM_BETTERSEARCH_SUPPORT_LABEL="Proyecto &amp; soporte"
PLG_SYSTEM_BETTERSEARCH_SUPPORT_DESC="<a href=\"https://github.com/merserwis/\" target=\"_blank\" rel=\"noopener\">github.com/merserwis</a>"

; ---------------------------------------------------------------- motor
PLG_SYSTEM_BETTERSEARCH_ENGINE_NOTE="Cada palabra de la consulta debe encontrarse en el producto. Las partes contiguas de un código de modelo forman una sola palabra: <b>MI 3155</b> se busca como <b>mi3155</b> y también coincide con «MI-3155» o «MI3155» en el producto. Los cambios en esta pestaña afectan al índice: actualícelo en la pestaña «Índice &amp; herramientas» (o espere a la comprobación automática)."
PLG_SYSTEM_BETTERSEARCH_INDEX_FIELDS_LABEL="Campos de producto en los que buscar"
PLG_SYSTEM_BETTERSEARCH_INDEX_FIELDS_DESC="Se buscan los valores de estos campos de Gridbox (p. ej. fabricante, modelo, parámetros). Omita los campos comunes a muchos productos, como las personas de contacto: harían que todos los productos coincidieran con sus nombres."
PLG_SYSTEM_BETTERSEARCH_INDEX_VARIATION_SKU_LABEL="Buscar códigos de variantes (SKU)"
PLG_SYSTEM_BETTERSEARCH_INDEX_PARENT_CATS_LABEL="Buscar nombres de categorías superiores"
PLG_SYSTEM_BETTERSEARCH_INDEX_PARENT_CATS_DESC="Una consulta con el nombre de una categoría encuentra también los productos de sus subcategorías."
PLG_SYSTEM_BETTERSEARCH_INDEX_TAGS_LABEL="Buscar etiquetas"
PLG_SYSTEM_BETTERSEARCH_SEARCH_BODY_LABEL="Buscar en descripciones"
PLG_SYSTEM_BETTERSEARCH_SEARCH_BODY_DESC="Las palabras encontradas solo en las descripciones cuentan mucho menos que en nombres, códigos, campos y categorías."
PLG_SYSTEM_BETTERSEARCH_INDEX_INTRO_LABEL="Texto de introducción"
PLG_SYSTEM_BETTERSEARCH_INDEX_META_LABEL="Metadescripción y palabras clave"
PLG_SYSTEM_BETTERSEARCH_INDEX_CONTENT_LABEL="Contenido de la página"
PLG_SYSTEM_BETTERSEARCH_INDEX_CONTENT_DESC="El texto del diseño de la página de producto (pestañas, descripciones, especificaciones)."
PLG_SYSTEM_BETTERSEARCH_CONTENT_LIMIT_LABEL="Caracteres de descripción por producto"
PLG_SYSTEM_BETTERSEARCH_MIN_CHARS_LABEL="Longitud mínima de la consulta"
PLG_SYSTEM_BETTERSEARCH_STEMMING_LABEL="Terminaciones de palabras"
PLG_SYSTEM_BETTERSEARCH_STEMMING_DESC="«mierników» también encuentra «miernik», «mierniki». Reglas ligeras para el polaco."
PLG_SYSTEM_BETTERSEARCH_TYPO_LABEL="Corrección de erratas"
PLG_SYSTEM_BETTERSEARCH_TYPO_DESC="Si no se encuentra nada, las palabras desconocidas para el índice se sustituyen por la palabra conocida más parecida («eurotset» → «eurotest»)."
PLG_SYSTEM_BETTERSEARCH_PARTIAL_LABEL="Coincidencias parciales"
PLG_SYSTEM_BETTERSEARCH_PARTIAL_DESC="Si ningún producto contiene todas las palabras, mostrar los productos que contienen la mayoría (con un aviso)."
PLG_SYSTEM_BETTERSEARCH_MIN_RELEVANCE_LABEL="Descartar coincidencias débiles (%)"
PLG_SYSTEM_BETTERSEARCH_MIN_RELEVANCE_DESC="Se omiten los resultados con una puntuación inferior a este porcentaje del mejor resultado (p. ej. productos que solo mencionan la palabra en lo más profundo de la descripción). 0 = conservar todos."
PLG_SYSTEM_BETTERSEARCH_SYNONYMS_LABEL="Sinónimos"
PLG_SYSTEM_BETTERSEARCH_SYNONYMS_DESC="Un grupo por línea, separado por comas: <code>multimetr, miernik uniwersalny</code> — cada término encuentra los demás. En un solo sentido: <code>rcd =&gt; wyłącznik różnicowoprądowy</code>. Las líneas que empiezan por # se ignoran."
PLG_SYSTEM_BETTERSEARCH_STOPWORDS_LABEL="Palabras ignoradas"
PLG_SYSTEM_BETTERSEARCH_STOPWORDS_DESC="Separadas por comas. Se ignoran salvo que la consulta no contenga nada más, y nunca dentro de un código de modelo («A 1199»)."
PLG_SYSTEM_BETTERSEARCH_WEIGHTS_LABEL="Pesos"
PLG_SYSTEM_BETTERSEARCH_WEIGHTS_DESC="Cuánto cuenta una palabra según dónde se encuentre. La consola de prueba de la pestaña «Índice &amp; herramientas» muestra la puntuación de cada resultado y su motivo."
