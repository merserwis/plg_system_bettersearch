PLG_SYSTEM_BETTERSEARCH_SEO_PATTERN_DESC="Vacío = el texto del idioma del sitio. <code>{query}</code> = la consulta, <code>{count}</code> = el número de resultados, <code>{site}</code> = el nombre del sitio."
