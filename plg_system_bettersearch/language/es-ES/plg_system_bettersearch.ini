PLG_SYSTEM_BETTERSEARCH_FIELDSET_SEO="SEO"
PLG_SYSTEM_BETTERSEARCH_SEO_NOTE="Cómo ven los buscadores la página de resultados. Los resultados de búsqueda son páginas de poco contenido y siempre cambiantes: por defecto se mantienen fuera del índice mientras se siguen sus enlaces a los productos, la dirección de cada vista ordenada o filtrada apunta a los resultados simples de la consulta y la página recibe su propio título y descripción."
PLG_SYSTEM_BETTERSEARCH_SEO_ROBOTS_LABEL="Robots"
PLG_SYSTEM_BETTERSEARCH_SEO_ROBOTS_DESC="La metaetiqueta robots de la página de resultados. Con «index», las páginas ordenadas, filtradas, siguientes y vacías reciben igualmente «noindex, follow»."
