PLG_SYSTEM_BETTERSEARCH_INFO_LABEL="Better Search for Gridbox"
PLG_SYSTEM_BETTERSEARCH_INFO_DESC="Gridbox paieškos laukai (parduotuvės paieška ir paieškos elementai) rodo šio įskiepio tiesioginius rezultatus, o Gridbox paieškos rezultatų puslapis pateikia jo rezultatus. Modelių kodai randami, kad ir kaip būtų įvesti: <b>MI 3155</b>, <b>MI3155</b> ir <b>MI-3155</b> yra tas pats produktas. Įdiegę sukurkite indeksą skirtuke <b>Indeksas &amp; įrankiai</b>."
PLG_SYSTEM_BETTERSEARCH_APPS_LABEL="Ieškomos programos"
PLG_SYSTEM_BETTERSEARCH_APPS_DESC="Gridbox programos, kurių puslapiai randami. Tuščia = visos parduotuvės programos. Pridėkite tinklaraščio programas, kad būtų randami ir straipsniai (jie rodomi atskira grupe)."
PLG_SYSTEM_BETTERSEARCH_LIVE_ENABLED_LABEL="Tiesioginiai rezultatai"
PLG_SYSTEM_BETTERSEARCH_LIVE_ENABLED_DESC="Rezultatai po paieškos lauku rašant. Išjungta = laukas tik nukreipia į rezultatų puslapį."
PLG_SYSTEM_BETTERSEARCH_REPLACE_RESULTS_LABEL="Pakeisti rezultatų puslapį"
PLG_SYSTEM_BETTERSEARCH_REPLACE_RESULTS_DESC="Gridbox paieškos rezultatų puslapis rodo šio įskiepio rezultatus (Gridbox pats visai neieško)."
PLG_SYSTEM_BETTERSEARCH_RESULTS_URL_LABEL="Rezultatų puslapio adresas"
PLG_SYSTEM_BETTERSEARCH_RESULTS_URL_DESC="Kur nukreipia Enter ir „Rodyti visus rezultatus“, pvz., /szukaj. Tuščia = adresas, nustatytas Gridbox paieškos elemente (arba Gridbox parduotuvės paieškos puslapis)."
PLG_SYSTEM_BETTERSEARCH_SELECTOR_LABEL="Paieškos laukai (CSS selektorius)"
PLG_SYSTEM_BETTERSEARCH_SELECTOR_DESC="Laukai, kuriuos perima įskiepis. Tuščia = Gridbox paieškos laukai ir Better Search modulio laukas."
PLG_SYSTEM_BETTERSEARCH_LOAD_EVERYWHERE_LABEL="Įkelti kiekviename puslapyje"
PLG_SYSTEM_BETTERSEARCH_LOAD_EVERYWHERE_DESC="Scenarijus pridedamas tik prie puslapių su Gridbox paieškos lauku. Įjunkite, jei naudojate savo selektorių kitų plėtinių laukams."
PLG_SYSTEM_BETTERSEARCH_ICON_SUBMIT_LABEL="Didinamojo stiklo piktograma ieško"
PLG_SYSTEM_BETTERSEARCH_ICON_SUBMIT_DESC="Spustelėjus Gridbox paieškos lauko piktogramą atidaromas rezultatų puslapis (Gridbox ją naudoja laukui išvalyti)."
PLG_SYSTEM_BETTERSEARCH_AUTO_SYNC_LABEL="Atnaujinti indeksą automatiškai"
PLG_SYSTEM_BETTERSEARCH_AUTO_SYNC_DESC="Gridbox išsaugo produktus nepranešdamas kitiems plėtiniams. Įskiepis, išsiuntęs lankytojui puslapį, palygina produktus su indeksu ir indeksuoja naujus bei pakeistus."
PLG_SYSTEM_BETTERSEARCH_SYNC_INTERVAL_LABEL="Tikrinti kas (minutės)"
PLG_SYSTEM_BETTERSEARCH_SYNC_INTERVAL_DESC="Kaip dažnai indeksas lyginamas su Gridbox. Pakeistas produktas pagal naują pavadinimą randamas ne vėliau kaip po šio laiko."
PLG_SYSTEM_BETTERSEARCH_SYNC_BUDGET_LABEL="Produktų per patikrinimą"
PLG_SYSTEM_BETTERSEARCH_SYNC_BUDGET_DESC="Per vieną automatinį patikrinimą indeksuojama ne daugiau kaip tiek produktų; likę – per kitus patikrinimus."
PLG_SYSTEM_BETTERSEARCH_CACHE_LABEL="Rezultatų talpykla (minutės)"
PLG_SYSTEM_BETTERSEARCH_CACHE_DESC="To paties užklausos rezultatai saugomi šį laiką. Kiekvienas indekso atnaujinimas ir nustatymų pakeitimas pradeda iš naujo. 0 = be talpyklos."
PLG_SYSTEM_BETTERSEARCH_LOG_LABEL="Paieškos statistika"
PLG_SYSTEM_BETTERSEARCH_LOG_DESC="Skaičiuoja rezultatų puslapio užklausas (be asmens duomenų): dažniausiai ieškomos, be rezultatų. Žr. skirtuką „Indeksas &amp; įrankiai“."
PLG_SYSTEM_BETTERSEARCH_SUPPORT_LABEL="Projektas &amp; pagalba"
PLG_SYSTEM_BETTERSEARCH_SUPPORT_DESC="<a href=\"https://github.com/merserwis/\" target=\"_blank\" rel=\"noopener\">github.com/merserwis</a>"

; ---------------------------------------------------------------- variklis
PLG_SYSTEM_BETTERSEARCH_ENGINE_NOTE="Kiekvienas užklausos žodis turi būti rastas produkte. Gretimos modelio kodo dalys laikomos vienu žodžiu: <b>MI 3155</b> ieškoma kaip <b>mi3155</b> ir taip pat atitinka „MI-3155“ arba „MI3155“ produkte. Šio skirtuko pakeitimai taikomi indeksui: atnaujinkite jį skirtuke „Indeksas &amp; įrankiai“ (arba palaukite automatinio patikrinimo)."
PLG_SYSTEM_BETTERSEARCH_INDEX_FIELDS_LABEL="Produkto laukai paieškai"
PLG_SYSTEM_BETTERSEARCH_INDEX_FIELDS_DESC="Randamos šių Gridbox laukų reikšmės (pvz., gamintojas, modelis, parametrai). Neįtraukite laukų, bendrų daugeliui produktų, pvz., kontaktinių asmenų – kitaip jų vardai atitiktų kiekvieną produktą."
