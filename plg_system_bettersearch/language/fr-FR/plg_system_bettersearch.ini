PLG_SYSTEM_BETTERSEARCH_RULES_NOTE="<b>Ordre manuel :</b> épinglez des produits en tête des résultats de requêtes choisies, dans l'ordre que vous définissez (faites glisser les produits). <b>Masquer</b> retire des produits des résultats de ces requêtes. Les bonus font monter (positifs) ou descendre (négatifs) des produits ou des catégories entières dans toutes les recherches."
PLG_SYSTEM_BETTERSEARCH_RULES_LABEL="Règles de requête"
