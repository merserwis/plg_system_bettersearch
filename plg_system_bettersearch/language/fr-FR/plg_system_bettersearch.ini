; ---------------------------------------------------------------- 1.6.2 statistics exclusions
PLG_SYSTEM_BETTERSEARCH_STATS_EXCLUDE_IPS_LABEL="Exclure des statistiques (adresses IP)"
PLG_SYSTEM_BETTERSEARCH_STATS_EXCLUDE_IPS_DESC="Les recherches, clics et paniers provenant de ces adresses ne sont pas comptés (statistiques de recherche, conversions, rapport par e-mail) – p. ex. les bureaux de l'entreprise, pour que les statistiques ne montrent que les clients. Une par ligne ou séparées par des virgules : une adresse (<code>83.1.2.3</code>, <code>2001:db8::1</code>), un réseau (<code>91.200.10.0/24</code>, <code>2001:db8::/48</code>) ou une adresse IPv4 avec * (<code>10.48.*</code>). Le texte après # est un commentaire. La recherche elle-même fonctionne de la même façon pour tous."
PLG_SYSTEM_BETTERSEARCH_STATS_EXCLUDE_GROUPS_LABEL="Exclure les utilisateurs connectés des groupes"
PLG_SYSTEM_BETTERSEARCH_STATS_EXCLUDE_GROUPS_DESC="Les recherches des membres connectés de ces groupes d'utilisateurs (p. ex. le personnel) ne sont pas comptées, quelle que soit l'adresse."
