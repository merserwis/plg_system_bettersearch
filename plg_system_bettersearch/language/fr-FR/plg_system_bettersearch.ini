PLG_SYSTEM_BETTERSEARCH_SEO_ROBOTS_KEEP="Laisser la valeur définie par le site"
PLG_SYSTEM_BETTERSEARCH_SEO_CANONICAL_LABEL="Adresse canonique"
PLG_SYSTEM_BETTERSEARCH_SEO_CANONICAL_DESC="L'adresse canonique de la page de résultats est la page avec la requête seule — sans tri, filtres, numéro de page ni autres paramètres. Elle remplace une adresse canonique définie par le thème (qui pointe souvent vers la page d'accueil)."
PLG_SYSTEM_BETTERSEARCH_SEO_TITLE_LABEL="Titre de page avec la requête"
PLG_SYSTEM_BETTERSEARCH_SEO_TITLE_DESC="Le titre de la page de résultats (onglet du navigateur, moteurs de recherche, liens partagés) indique la requête et le nombre de résultats. Le nom du site est ajouté selon la Configuration globale."
PLG_SYSTEM_BETTERSEARCH_SEO_TITLE_PATTERN_LABEL="Titre"
PLG_SYSTEM_BETTERSEARCH_SEO_PATTERN_DESC="Vide = le texte de la langue du site. <code>{query}</code> = la requête, <code>{count}</code> = le nombre de résultats, <code>{site}</code> = le nom du site."
PLG_SYSTEM_BETTERSEARCH_SEO_DESCRIPTION_LABEL="Méta-description"
PLG_SYSTEM_BETTERSEARCH_SEO_DESCRIPTION_PATTERN_LABEL="Description"
PLG_SYSTEM_BETTERSEARCH_SEO_NOFOLLOW_LABEL="nofollow sur le tri, les filtres et les pages"
PLG_SYSTEM_BETTERSEARCH_SEO_NOFOLLOW_DESC="Les liens qui ne font que trier ou filtrer une recherche reçoivent rel=« nofollow », afin que les robots des moteurs de recherche n'explorent pas leurs combinaisons infinies au lieu de la boutique."
PLG_SYSTEM_BETTERSEARCH_SEO_JSONLD_LABEL="Données structurées des résultats"
