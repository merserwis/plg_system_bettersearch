; 1.4.0
PLG_SYSTEM_BETTERSEARCH_INSTANT_REINDEX_LABEL="Mettre à jour l'index dès une modification"
PLG_SYSTEM_BETTERSEARCH_INSTANT_REINDEX_DESC="Lorsqu'une page ou un produit Gridbox est enregistré, publié, dépublié ou mis à la corbeille (dans l'éditeur Gridbox ou dans les listes), les éléments modifiés sont indexés à nouveau juste après cette requête : la recherche reflète le changement immédiatement, sans attendre la prochaine vérification."
PLG_SYSTEM_BETTERSEARCH_TRACK_CONVERSIONS_LABEL="Statistiques de conversion"
PLG_SYSTEM_BETTERSEARCH_TRACK_CONVERSIONS_DESC="Compte, pour chaque requête, les clics sur les résultats de recherche et les produits ajoutés au panier après un tel clic (Outils → Conversions). Un cookie interne (bs_src : ID du produit → requête, pendant 30 jours) relie le panier à la recherche ; aucune donnée personnelle n'est enregistrée."
PLG_SYSTEM_BETTERSEARCH_REDIRECTS_LABEL="Redirections"
PLG_SYSTEM_BETTERSEARCH_REDIRECTS_DESC="Une par ligne : expressions (séparées par des virgules) =&gt; adresse, éventuellement | libellé. Une recherche portant exactement sur cette expression (quelle que soit son écriture : « MI-3155 » = « mi 3155 ») ouvre l'adresse au lieu de la page de résultats ; les résultats instantanés la proposent en première option. Adresses : un chemin de ce site (/oferta/…) ou une adresse http(s)."
PLG_SYSTEM_BETTERSEARCH_DID_YOU_MEAN_LABEL="« Vouliez-vous dire… »"
PLG_SYSTEM_BETTERSEARCH_DID_YOU_MEAN_DESC="Lorsque rien n'est trouvé, propose des recherches avec résultats qui s'écrivent presque de la même façon (d'après les statistiques de recherche)."
PLG_SYSTEM_BETTERSEARCH_LIVE_SUGGESTIONS_LABEL="Suggérer les recherches populaires"
PLG_SYSTEM_BETTERSEARCH_LIVE_SUGGESTIONS_DESC="Au-dessus des résultats instantanés : les recherches avec résultats qui commencent comme le texte saisi, les plus recherchées en premier (d'après les statistiques de recherche). Un clic lance la recherche."
PLG_SYSTEM_BETTERSEARCH_LIVE_SUGGESTIONS_LIMIT_LABEL="Nombre de suggestions"
PLG_SYSTEM_BETTERSEARCH_SUGGEST_MIN_SEARCHES_LABEL="Suggérer après … recherches"
PLG_SYSTEM_BETTERSEARCH_SUGGEST_MIN_SEARCHES_DESC="Une expression n'est suggérée que si elle a été recherchée au moins ce nombre de fois (une faute de frappe isolée n'est pas suggérée aux autres)."
PLG_SYSTEM_BETTERSEARCH_PAGE_FACETS_LABEL="Filtres à côté des résultats"
PLG_SYSTEM_BETTERSEARCH_PAGE_FACETS_DESC="Marque, fourchette de prix, promotions uniquement et en stock uniquement. Chaque filtre indique combien de résultats il laisse ; les filtres qui ne changeraient rien ne sont pas affichés."
PLG_SYSTEM_BETTERSEARCH_PAGE_FACETS_POSITION_LABEL="Position des filtres"
PLG_SYSTEM_BETTERSEARCH_PAGE_FACETS_POSITION_SIDE="À côté des résultats (au-dessus sur téléphone)"
PLG_SYSTEM_BETTERSEARCH_PAGE_FACETS_POSITION_TOP="Au-dessus des résultats"
PLG_SYSTEM_BETTERSEARCH_FACET_BRAND_FIELD_LABEL="Champ de la marque"
PLG_SYSTEM_BETTERSEARCH_FACET_BRAND_FIELD_DESC="Le champ produit Gridbox contenant la marque (un champ liste, par ex. « Fabricant »). Vide = pas de filtre par marque."
PLG_SYSTEM_BETTERSEARCH_FACET_BRAND_NONE="— pas de filtre par marque —"
PLG_SYSTEM_BETTERSEARCH_FACET_PRICE_LABEL="Filtre de prix"
PLG_SYSTEM_BETTERSEARCH_FACET_PRICE_DESC="De–à, dans la devise du visiteur, selon le prix actuel (après promotions)."
PLG_SYSTEM_BETTERSEARCH_FACET_SALE_LABEL="Filtre « Promotions uniquement »"
PLG_SYSTEM_BETTERSEARCH_FACET_SALE_DESC="Produits avec un prix promo ou une promotion active de la boutique."
PLG_SYSTEM_BETTERSEARCH_FACET_STOCK_LABEL="Filtre « En stock uniquement »"
PLG_SYSTEM_BETTERSEARCH_FACET_STOCK_DESC="Produits en stock (selon l'index)."
PLG_SYSTEM_BETTERSEARCH_FIELDSET_GSC="Google Search Console"
PLG_SYSTEM_BETTERSEARCH_GSC_NOTE="<p class=\"mb-1\">Les requêtes que les internautes utilisent sur Google pour trouver votre site, à côté de ce que cette recherche trouve pour eux : les expressions sans résultat ici sont des candidates pour des synonymes ou des redirections.</p><p class=\"mb-0\"><strong>Automatique (une fois par jour) :</strong> créez un compte de service dans Google Cloud, activez « Google Search Console API », ajoutez l'adresse e-mail du compte comme utilisateur de votre propriété Search Console et collez sa clé JSON ci-dessous. <strong>Sans clé :</strong> exportez le tableau « Requêtes » de Search Console au format CSV et importez-le avec le bouton ci-dessous.</p>"
