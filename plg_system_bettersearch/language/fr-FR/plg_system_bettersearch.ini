; ---------------------------------------------------------------- 1.3.0: SEO and prices
PLG_SYSTEM_BETTERSEARCH_FIELDSET_SEO="SEO"
PLG_SYSTEM_BETTERSEARCH_SEO_NOTE="Comment les moteurs de recherche voient la page de résultats. Les résultats de recherche sont des pages pauvres et changeantes : par défaut, elles sont exclues de l'index tandis que leurs liens vers les produits sont suivis, l'adresse de chaque vue triée ou filtrée pointe vers les résultats simples de la requête, et la page reçoit son propre titre et sa propre description."
PLG_SYSTEM_BETTERSEARCH_SEO_ROBOTS_LABEL="Robots"
PLG_SYSTEM_BETTERSEARCH_SEO_ROBOTS_DESC="La balise meta robots de la page de résultats. Avec « index », les pages triées, filtrées, suivantes et vides reçoivent quand même « noindex, follow »."
PLG_SYSTEM_BETTERSEARCH_SEO_ROBOTS_NOINDEX_FOLLOW="noindex, follow (recommandé)"
PLG_SYSTEM_BETTERSEARCH_SEO_ROBOTS_NOINDEX_NOFOLLOW="noindex, nofollow"
