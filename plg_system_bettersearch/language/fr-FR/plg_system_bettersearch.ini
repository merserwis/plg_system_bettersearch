PLG_SYSTEM_BETTERSEARCH_FIELDSET_ENGINE="Moteur de recherche"
PLG_SYSTEM_BETTERSEARCH_FIELDSET_RULES="Classement &amp; exclusions"
PLG_SYSTEM_BETTERSEARCH_FIELDSET_LIVE="Résultats instantanés"
PLG_SYSTEM_BETTERSEARCH_FIELDSET_PAGE="Page de résultats"
PLG_SYSTEM_BETTERSEARCH_FIELDSET_TEXTS="Textes &amp; images"
PLG_SYSTEM_BETTERSEARCH_FIELDSET_TOOLS="Index &amp; outils"

; ---------------------------------------------------------------- general
PLG_SYSTEM_BETTERSEARCH_INFO_LABEL="Better Search for Gridbox"
PLG_SYSTEM_BETTERSEARCH_INFO_DESC="Les champs de recherche de Gridbox (recherche de la boutique et éléments de recherche) affichent les résultats instantanés de ce plugin, et la page de résultats de recherche de Gridbox liste ses résultats. Les codes de modèle sont trouvés quelle que soit leur saisie : <b>MI 3155</b>, <b>MI3155</b> et <b>MI-3155</b> désignent le même produit. Après l'installation, construisez l'index dans l'onglet <b>Index &amp; outils</b>."
PLG_SYSTEM_BETTERSEARCH_APPS_LABEL="Applications recherchées"
PLG_SYSTEM_BETTERSEARCH_APPS_DESC="Applications Gridbox dont les pages sont trouvées. Vide = toutes les applications boutique. Ajoutez des applications blog pour trouver aussi des articles (ils sont affichés dans leur propre groupe)."
PLG_SYSTEM_BETTERSEARCH_LIVE_ENABLED_LABEL="Résultats instantanés"
PLG_SYSTEM_BETTERSEARCH_LIVE_ENABLED_DESC="Résultats sous le champ de recherche pendant la saisie. Désactivé = le champ mène uniquement à la page de résultats."
PLG_SYSTEM_BETTERSEARCH_REPLACE_RESULTS_LABEL="Remplacer la page de résultats"
PLG_SYSTEM_BETTERSEARCH_REPLACE_RESULTS_DESC="La page de résultats de recherche de Gridbox affiche les résultats de ce plugin (Gridbox n'effectue plus aucune recherche)."
PLG_SYSTEM_BETTERSEARCH_RESULTS_URL_LABEL="Adresse de la page de résultats"
PLG_SYSTEM_BETTERSEARCH_RESULTS_URL_DESC="Destination de la touche Entrée et du bouton « Afficher tous les résultats », par ex. /szukaj. Vide = l'adresse définie dans l'élément de recherche Gridbox (ou la page de recherche de la boutique Gridbox)."
PLG_SYSTEM_BETTERSEARCH_SELECTOR_LABEL="Champs de recherche (sélecteur CSS)"
PLG_SYSTEM_BETTERSEARCH_SELECTOR_DESC="Champs pris en charge par le plugin. Vide = les champs de recherche Gridbox et le champ du module Better Search."
PLG_SYSTEM_BETTERSEARCH_LOAD_EVERYWHERE_LABEL="Charger sur toutes les pages"
PLG_SYSTEM_BETTERSEARCH_LOAD_EVERYWHERE_DESC="Le script n'est ajouté qu'aux pages comportant un champ de recherche Gridbox. Activez cette option si vous utilisez votre propre sélecteur pour des champs d'autres extensions."
PLG_SYSTEM_BETTERSEARCH_ICON_SUBMIT_LABEL="La loupe lance la recherche"
PLG_SYSTEM_BETTERSEARCH_ICON_SUBMIT_DESC="Un clic sur l'icône d'un champ de recherche Gridbox ouvre la page de résultats (Gridbox l'utilise pour vider le champ)."
PLG_SYSTEM_BETTERSEARCH_AUTO_SYNC_LABEL="Mettre à jour l'index automatiquement"
PLG_SYSTEM_BETTERSEARCH_AUTO_SYNC_DESC="Gridbox enregistre les produits sans prévenir les autres extensions. Le plugin compare les produits avec l'index après l'envoi de la page à un visiteur et indexe les produits nouveaux et modifiés."
PLG_SYSTEM_BETTERSEARCH_SYNC_INTERVAL_LABEL="Vérifier toutes les (minutes)"
PLG_SYSTEM_BETTERSEARCH_SYNC_INTERVAL_DESC="Fréquence de comparaison de l'index avec Gridbox. Un produit modifié peut être trouvé sous son nouveau nom au plus tard après ce délai."
PLG_SYSTEM_BETTERSEARCH_SYNC_BUDGET_LABEL="Produits par vérification"
PLG_SYSTEM_BETTERSEARCH_SYNC_BUDGET_DESC="Nombre maximal de produits indexés lors d'une vérification automatique ; les autres suivent lors des vérifications suivantes."
PLG_SYSTEM_BETTERSEARCH_CACHE_LABEL="Mise en cache des résultats (minutes)"
PLG_SYSTEM_BETTERSEARCH_CACHE_DESC="Les résultats d'une même requête sont conservés pendant cette durée. Chaque mise à jour de l'index et chaque modification des paramètres vident le cache. 0 = pas de cache."
PLG_SYSTEM_BETTERSEARCH_LOG_LABEL="Statistiques de recherche"
PLG_SYSTEM_BETTERSEARCH_LOG_DESC="Compte les requêtes de la page de résultats (aucune donnée personnelle) : les plus recherchées, sans résultat. Voir l'onglet « Index &amp; outils »."
PLG_SYSTEM_BETTERSEARCH_SUPPORT_LABEL="Projet &amp; support"
PLG_SYSTEM_BETTERSEARCH_SUPPORT_DESC="<a href=\"https://github.com/merserwis/\" target=\"_blank\" rel=\"noopener\">github.com/merserwis</a>"

; ---------------------------------------------------------------- engine
PLG_SYSTEM_BETTERSEARCH_ENGINE_NOTE="Chaque mot de la requête doit être trouvé dans un produit. Les parties voisines d'un code de modèle forment un seul mot : <b>MI 3155</b> est recherché comme <b>mi3155</b> et correspond aussi à « MI-3155 » ou « MI3155 » dans le produit. Les modifications de cet onglet s'appliquent à l'index : mettez-le à jour dans l'onglet « Index &amp; outils » (ou attendez la vérification automatique)."
PLG_SYSTEM_BETTERSEARCH_INDEX_FIELDS_LABEL="Champs produit à rechercher"
PLG_SYSTEM_BETTERSEARCH_INDEX_FIELDS_DESC="Les valeurs de ces champs Gridbox sont recherchées (par ex. fabricant, modèle, caractéristiques). Excluez les champs communs à de nombreux produits, comme les personnes de contact : tous les produits correspondraient à leurs noms."
PLG_SYSTEM_BETTERSEARCH_INDEX_VARIATION_SKU_LABEL="Rechercher les codes des variantes (SKU)"
PLG_SYSTEM_BETTERSEARCH_INDEX_PARENT_CATS_LABEL="Rechercher les noms des catégories parentes"
PLG_SYSTEM_BETTERSEARCH_INDEX_PARENT_CATS_DESC="Une requête contenant le nom d'une catégorie trouve aussi les produits de ses sous-catégories."
PLG_SYSTEM_BETTERSEARCH_INDEX_TAGS_LABEL="Rechercher les tags"
PLG_SYSTEM_BETTERSEARCH_INDEX_REDIRECTS_LABEL="Trouver les produits par les redirections"
PLG_SYSTEM_BETTERSEARCH_INDEX_REDIRECTS_DESC="Redirections de Joomla (composant Redirections) : un produit dont l'adresse est redirigée vers un autre donne à ce produit son ancien nom. Une recherche de l'ancien nom (p. ex. AAA) affiche le nouveau produit (BBB) avec le badge « Remplacé ». L'ancien nom est le titre de l'ancien produit (s'il est encore dans Gridbox, p. ex. non publié), sinon les mots de son adresse, plus la note de la redirection."
PLG_SYSTEM_BETTERSEARCH_SEARCH_BODY_LABEL="Rechercher les descriptions"
PLG_SYSTEM_BETTERSEARCH_SEARCH_BODY_DESC="Les mots trouvés uniquement dans les descriptions comptent beaucoup moins que dans les noms, codes, champs et catégories."
PLG_SYSTEM_BETTERSEARCH_INDEX_INTRO_LABEL="Texte d'introduction"
PLG_SYSTEM_BETTERSEARCH_INDEX_META_LABEL="Méta-description et mots-clés"
PLG_SYSTEM_BETTERSEARCH_INDEX_CONTENT_LABEL="Contenu de la page"
PLG_SYSTEM_BETTERSEARCH_INDEX_CONTENT_DESC="Le texte de la mise en page de la fiche produit (onglets, descriptions, caractéristiques)."
PLG_SYSTEM_BETTERSEARCH_CONTENT_LIMIT_LABEL="Caractères de description par produit"
PLG_SYSTEM_BETTERSEARCH_MIN_CHARS_LABEL="Longueur minimale de la requête"
PLG_SYSTEM_BETTERSEARCH_STEMMING_LABEL="Terminaisons des mots"
PLG_SYSTEM_BETTERSEARCH_STEMMING_DESC="« appareils » trouve aussi « appareil », « Messgeräten » trouve « Messgerät ». Règles simples : toujours le polonais (avec les pluriels anglais), plus celles de la langue du site — anglais, allemand, français, tchèque ou néerlandais."
PLG_SYSTEM_BETTERSEARCH_TYPO_LABEL="Correction des fautes de frappe"
PLG_SYSTEM_BETTERSEARCH_TYPO_DESC="Si rien n'est trouvé, les mots inconnus de l'index sont remplacés par le mot connu le plus proche (« eurotset » → « eurotest »)."
PLG_SYSTEM_BETTERSEARCH_PARTIAL_LABEL="Correspondances partielles"
PLG_SYSTEM_BETTERSEARCH_PARTIAL_DESC="Si aucun produit ne contient tous les mots, afficher les produits qui en contiennent le plus (avec une mention)."
PLG_SYSTEM_BETTERSEARCH_MIN_RELEVANCE_LABEL="Écarter les correspondances faibles (%)"
PLG_SYSTEM_BETTERSEARCH_MIN_RELEVANCE_DESC="Les résultats dont le score est inférieur à ce pourcentage du meilleur résultat sont écartés (par ex. les produits qui ne mentionnent le mot que loin dans la description). 0 = tout conserver."
PLG_SYSTEM_BETTERSEARCH_SYNONYMS_LABEL="Synonymes"
PLG_SYSTEM_BETTERSEARCH_SYNONYMS_DESC="Un groupe par ligne, séparé par des virgules : <code>multimetr, miernik uniwersalny</code> — chacun trouve les autres. Sens unique : <code>rcd =&gt; wyłącznik różnicowoprądowy</code>. Les lignes commençant par # sont ignorées."
PLG_SYSTEM_BETTERSEARCH_STOPWORDS_LABEL="Mots ignorés"
PLG_SYSTEM_BETTERSEARCH_STOPWORDS_DESC="Séparés par des virgules. Ignorés sauf si la requête ne contient rien d’autre, et jamais à l’intérieur d’une référence de modèle (« A 1199 »). Vide = la liste intégrée : mots polonais et anglais, plus ceux de la langue du site (allemand, français, tchèque ou néerlandais)."
PLG_SYSTEM_BETTERSEARCH_STOPWORDS_HINT="Vide = liste intégrée pour la langue du site"
PLG_SYSTEM_BETTERSEARCH_WEIGHTS_LABEL="Pondérations"
PLG_SYSTEM_BETTERSEARCH_WEIGHTS_DESC="Poids d'un mot selon l'endroit où il est trouvé. La console de test de l'onglet « Index &amp; outils » affiche le score de chaque résultat et sa justification."
PLG_SYSTEM_BETTERSEARCH_W_SKU_LABEL="Code produit (SKU)"
PLG_SYSTEM_BETTERSEARCH_W_TITLE_LABEL="Nom"
PLG_SYSTEM_BETTERSEARCH_W_FIELDS_LABEL="Champs"
PLG_SYSTEM_BETTERSEARCH_W_CATS_LABEL="Catégories et tags"
PLG_SYSTEM_BETTERSEARCH_W_BODY_LABEL="Descriptions"
PLG_SYSTEM_BETTERSEARCH_W_DIGITS_LABEL="Mots avec chiffres ×"
PLG_SYSTEM_BETTERSEARCH_W_DIGITS_DESC="Les numéros de modèle sont plus parlants que les mots : leur poids est multiplié par ce facteur."
PLG_SYSTEM_BETTERSEARCH_POPULARITY_LABEL="Popularité"
PLG_SYSTEM_BETTERSEARCH_POPULARITY_DESC="Points pour les consultations de la page (logarithmique) : à correspondance égale, le produit le plus consulté passe en premier. 0 = désactivé."
PLG_SYSTEM_BETTERSEARCH_MAX_CANDIDATES_LABEL="Nombre maximal de candidats par requête"

