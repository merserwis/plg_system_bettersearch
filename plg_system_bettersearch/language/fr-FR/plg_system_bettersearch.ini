PLG_SYSTEM_BETTERSEARCH="Système - Better Search for Gridbox"
PLG_SYSTEM_BETTERSEARCH_XML_DESCRIPTION="Remplace la recherche de Gridbox : résultats instantanés sous les champs de recherche et page de résultats, à partir d'un index propre dans lequel les codes de modèle correspondent quelle que soit leur saisie (MI 3155 = MI3155 = MI-3155). Classement manuel, exclusions et contrôle total de l'apparence."
PLG_SYSTEM_BETTERSEARCH_INSTALL_NO_GRIDBOX="Better Search for Gridbox fonctionne avec Balbooa Gridbox, qui n'est pas installé sur ce site."
PLG_SYSTEM_BETTERSEARCH_INSTALL_BUILD_INDEX="Better Search for Gridbox : ouvrez le plugin, onglet « Index & outils », et cliquez sur « Mettre à jour l'index » pour construire l'index de recherche (il est aussi construit automatiquement lors des premières visites)."

