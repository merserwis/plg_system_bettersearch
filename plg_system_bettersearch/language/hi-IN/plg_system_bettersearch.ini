PLG_SYSTEM_BETTERSEARCH_INFO_LABEL="Better Search for Gridbox"
PLG_SYSTEM_BETTERSEARCH_INFO_DESC="Gridbox के सर्च फ़ील्ड (स्टोर सर्च और सर्च एलिमेंट) इस प्लगइन से लाइव परिणाम दिखाते हैं, और Gridbox का सर्च परिणाम पेज इसके परिणाम सूचीबद्ध करता है। मॉडल कोड चाहे किसी भी तरह टाइप किए जाएँ, मिल जाते हैं: <b>MI 3155</b>, <b>MI3155</b> और <b>MI-3155</b> एक ही उत्पाद हैं। इंस्टॉल करने के बाद टैब <b>इंडेक्स &amp; टूल्स</b> पर इंडेक्स बनाएँ।"
PLG_SYSTEM_BETTERSEARCH_APPS_LABEL="खोजे जाने वाले ऐप"
PLG_SYSTEM_BETTERSEARCH_APPS_DESC="Gridbox ऐप जिनके पेज खोजे जाते हैं। खाली = सभी स्टोर ऐप। लेख भी खोजने के लिए ब्लॉग ऐप जोड़ें (वे अपने अलग समूह में दिखाए जाते हैं)।"
PLG_SYSTEM_BETTERSEARCH_LIVE_ENABLED_LABEL="लाइव परिणाम"
PLG_SYSTEM_BETTERSEARCH_LIVE_ENABLED_DESC="टाइप करते समय सर्च फ़ील्ड के नीचे परिणाम। बंद = फ़ील्ड केवल परिणाम पेज पर ले जाता है।"
PLG_SYSTEM_BETTERSEARCH_REPLACE_RESULTS_LABEL="परिणाम पेज बदलें"
PLG_SYSTEM_BETTERSEARCH_REPLACE_RESULTS_DESC="Gridbox का सर्च परिणाम पेज इस प्लगइन के परिणाम दिखाता है (Gridbox स्वयं बिल्कुल नहीं खोजता)।"
PLG_SYSTEM_BETTERSEARCH_RESULTS_URL_LABEL="परिणाम पेज का पता"
PLG_SYSTEM_BETTERSEARCH_RESULTS_URL_DESC="Enter और “सभी परिणाम देखें” कहाँ ले जाते हैं, उदा. /szukaj। खाली = Gridbox सर्च एलिमेंट में सेट किया गया पता (या Gridbox स्टोर सर्च पेज)।"
PLG_SYSTEM_BETTERSEARCH_SELECTOR_LABEL="सर्च फ़ील्ड (CSS सेलेक्टर)"
PLG_SYSTEM_BETTERSEARCH_SELECTOR_DESC="वे फ़ील्ड जिन्हें प्लगइन संभालता है। खाली = Gridbox के सर्च फ़ील्ड और Better Search मॉड्यूल का फ़ील्ड।"
PLG_SYSTEM_BETTERSEARCH_LOAD_EVERYWHERE_LABEL="हर पेज पर लोड करें"
PLG_SYSTEM_BETTERSEARCH_LOAD_EVERYWHERE_DESC="स्क्रिप्ट केवल उन्हीं पेजों पर जोड़ी जाती है जिनमें Gridbox सर्च फ़ील्ड हो। अन्य एक्सटेंशन के फ़ील्ड के लिए अपना सेलेक्टर उपयोग करते समय इसे चालू करें।"
PLG_SYSTEM_BETTERSEARCH_ICON_SUBMIT_LABEL="मैग्निफ़ायर आइकन से खोज"
PLG_SYSTEM_BETTERSEARCH_ICON_SUBMIT_DESC="Gridbox सर्च फ़ील्ड के आइकन पर क्लिक करने से परिणाम पेज खुलता है (Gridbox इसका उपयोग फ़ील्ड खाली करने के लिए करता है)।"
PLG_SYSTEM_BETTERSEARCH_AUTO_SYNC_LABEL="इंडेक्स अपने-आप अपडेट करें"
PLG_SYSTEM_BETTERSEARCH_AUTO_SYNC_DESC="Gridbox उत्पाद सहेजते समय अन्य एक्सटेंशन को सूचित नहीं करता। विज़िटर का पेज भेजे जाने के बाद प्लगइन उत्पादों की तुलना इंडेक्स से करता है और नए व बदले हुए उत्पादों को इंडेक्स करता है।"
PLG_SYSTEM_BETTERSEARCH_SYNC_INTERVAL_LABEL="हर (मिनट) पर जाँचें"
PLG_SYSTEM_BETTERSEARCH_SYNC_INTERVAL_DESC="इंडेक्स की तुलना Gridbox से कितनी बार की जाए। बदला हुआ उत्पाद अधिकतम इतने समय बाद अपने नए नाम से मिल सकता है।"
PLG_SYSTEM_BETTERSEARCH_SYNC_BUDGET_LABEL="प्रति जाँच उत्पाद"
PLG_SYSTEM_BETTERSEARCH_SYNC_BUDGET_DESC="एक स्वचालित जाँच में अधिकतम इतने उत्पाद इंडेक्स किए जाते हैं; बाकी अगली जाँचों में होते हैं।"
PLG_SYSTEM_BETTERSEARCH_CACHE_LABEL="परिणाम कैश करें (मिनट)"
PLG_SYSTEM_BETTERSEARCH_CACHE_DESC="एक ही क्वेरी के परिणाम इतने समय तक रखे जाते हैं। हर इंडेक्स अपडेट और सेटिंग्स का हर बदलाव कैश को नए सिरे से शुरू करता है। 0 = कोई कैश नहीं।"
PLG_SYSTEM_BETTERSEARCH_LOG_LABEL="सर्च आँकड़े"
PLG_SYSTEM_BETTERSEARCH_LOG_DESC="परिणाम पेज की क्वेरी गिनता है (कोई व्यक्तिगत डेटा नहीं): सबसे अधिक खोजी गई, बिना परिणाम वाली। टैब “इंडेक्स &amp; टूल्स” देखें।"
PLG_SYSTEM_BETTERSEARCH_SUPPORT_LABEL="प्रोजेक्ट &amp; सहायता"
PLG_SYSTEM_BETTERSEARCH_SUPPORT_DESC="<a href=\"https://github.com/merserwis/\" target=\"_blank\" rel=\"noopener\">github.com/merserwis</a>"

; ---------------------------------------------------------------- इंजन
PLG_SYSTEM_BETTERSEARCH_ENGINE_NOTE="क्वेरी का हर शब्द उत्पाद में मिलना चाहिए। मॉडल कोड के पास-पास के हिस्से एक शब्द माने जाते हैं: <b>MI 3155</b> को <b>mi3155</b> के रूप में खोजा जाता है और यह उत्पाद में “MI-3155” या “MI3155” से भी मेल खाता है। इस टैब के बदलाव इंडेक्स पर लागू होते हैं: इसे टैब “इंडेक्स &amp; टूल्स” पर अपडेट करें (या स्वचालित जाँच की प्रतीक्षा करें)।"
