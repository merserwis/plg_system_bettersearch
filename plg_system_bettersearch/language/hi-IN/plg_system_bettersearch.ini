PLG_SYSTEM_BETTERSEARCH="सिस्टम - Better Search for Gridbox"
PLG_SYSTEM_BETTERSEARCH_XML_DESCRIPTION="Gridbox सर्च की जगह लेता है: सर्च फ़ील्ड के नीचे लाइव परिणाम और परिणाम पेज, अपने स्वयं के इंडेक्स से, जिसमें मॉडल कोड चाहे किसी भी तरह टाइप किए जाएँ, मिल जाते हैं (MI 3155 = MI3155 = MI-3155)। मैन्युअल रैंकिंग, बहिष्करण और रूप-रंग पर पूरा नियंत्रण।"
PLG_SYSTEM_BETTERSEARCH_INSTALL_NO_GRIDBOX="Better Search for Gridbox, Balbooa Gridbox के साथ काम करता है, जो इस साइट पर इंस्टॉल नहीं है।"
PLG_SYSTEM_BETTERSEARCH_INSTALL_BUILD_INDEX="Better Search for Gridbox: सर्च इंडेक्स बनाने के लिए प्लगइन खोलें, टैब “इंडेक्स & टूल्स” पर जाएँ और “इंडेक्स अपडेट करें” पर क्लिक करें (पहली कुछ विज़िट पर यह अपने-आप भी बन जाता है)।"

