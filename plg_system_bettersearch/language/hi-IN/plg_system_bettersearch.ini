PLG_SYSTEM_BETTERSEARCH_RULES_NOTE="<b>मैन्युअल क्रम:</b> चुनी गई क्वेरी के परिणामों में उत्पादों को आपके तय किए क्रम में सबसे ऊपर पिन करें (उत्पादों को खींचें)। <b>छिपाएँ</b> इन क्वेरी के परिणामों से उत्पाद हटा देता है। बूस्ट हर खोज में उत्पादों या पूरी श्रेणियों को ऊपर (धनात्मक) या नीचे (ऋणात्मक) ले जाते हैं।"
