PLG_SYSTEM_BETTERSEARCH_INDEX_PARENT_CATS_LABEL="Search parent category names"
PLG_SYSTEM_BETTERSEARCH_INDEX_PARENT_CATS_DESC="A query with a category name also finds the products of its subcategories."
PLG_SYSTEM_BETTERSEARCH_INDEX_TAGS_LABEL="Search tags"
PLG_SYSTEM_BETTERSEARCH_SEARCH_BODY_LABEL="Search descriptions"
PLG_SYSTEM_BETTERSEARCH_SEARCH_BODY_DESC="Words found only in descriptions count much less than in names, codes, fields and categories."
