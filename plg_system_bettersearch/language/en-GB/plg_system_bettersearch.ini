PLG_SYSTEM_BETTERSEARCH_SYNONYMS_DESC="One group per line, comma separated: <code>multimetr, miernik uniwersalny</code> — each finds the others. One-way: <code>rcd =&gt; wyłącznik różnicowoprądowy</code>. Lines starting with # are ignored."
PLG_SYSTEM_BETTERSEARCH_STOPWORDS_LABEL="Ignored words"
PLG_SYSTEM_BETTERSEARCH_STOPWORDS_DESC="Comma separated. Ignored unless the query has nothing else, and never inside a model code (“A 1199”)."
PLG_SYSTEM_BETTERSEARCH_WEIGHTS_LABEL="Weights"
PLG_SYSTEM_BETTERSEARCH_WEIGHTS_DESC="How much a word counts where it is found. The test console on the tab “Index &amp; tools” shows the score of each result and why."
