PLG_SYSTEM_BETTERSEARCH="System - Better Search for Gridbox"
PLG_SYSTEM_BETTERSEARCH_XML_DESCRIPTION="Replaces the Gridbox search: live results under the search fields and the results page, from an own index in which model codes match however they are typed (MI 3155 = MI3155 = MI-3155). Manual ranking, exclusions and full control over the look."
PLG_SYSTEM_BETTERSEARCH_INSTALL_NO_GRIDBOX="Better Search for Gridbox works with Balbooa Gridbox, which is not installed on this site."
PLG_SYSTEM_BETTERSEARCH_INSTALL_BUILD_INDEX="Better Search for Gridbox: open the plugin, tab “Index & tools”, and click “Update index” to build the search index (it is also built automatically on the first visits)."

