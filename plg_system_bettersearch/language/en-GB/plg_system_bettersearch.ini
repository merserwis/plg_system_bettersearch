; ---------------------------------------------------------------- general
PLG_SYSTEM_BETTERSEARCH_INFO_LABEL="Better Search for Gridbox"
PLG_SYSTEM_BETTERSEARCH_INFO_DESC="The search fields of Gridbox (store search and search elements) show live results from this plugin, and the Gridbox search results page lists its results. Model codes are found however they are typed: <b>MI 3155</b>, <b>MI3155</b> and <b>MI-3155</b> are the same product. After installing, build the index on the tab <b>Index &amp; tools</b>."
PLG_SYSTEM_BETTERSEARCH_APPS_LABEL="Searched apps"
PLG_SYSTEM_BETTERSEARCH_APPS_DESC="Gridbox apps whose pages are found. Empty = every store app. Add blog apps to find articles too (they are shown as their own group)."
PLG_SYSTEM_BETTERSEARCH_LIVE_ENABLED_LABEL="Live results"
PLG_SYSTEM_BETTERSEARCH_LIVE_ENABLED_DESC="Results under the search field while typing. Off = the field only leads to the results page."
PLG_SYSTEM_BETTERSEARCH_REPLACE_RESULTS_LABEL="Replace the results page"
PLG_SYSTEM_BETTERSEARCH_REPLACE_RESULTS_DESC="The Gridbox search results page shows the results of this plugin (Gridbox does not search at all)."
PLG_SYSTEM_BETTERSEARCH_RESULTS_URL_LABEL="Results page address"
PLG_SYSTEM_BETTERSEARCH_RESULTS_URL_DESC="Where Enter and “Show all results” lead, e.g. /szukaj. Empty = the address set in the Gridbox search element (or the Gridbox store search page)."
PLG_SYSTEM_BETTERSEARCH_SELECTOR_LABEL="Search fields (CSS selector)"
PLG_SYSTEM_BETTERSEARCH_SELECTOR_DESC="Fields taken over by the plugin. Empty = the Gridbox search fields and the field of the Better Search module."
PLG_SYSTEM_BETTERSEARCH_LOAD_EVERYWHERE_LABEL="Load on every page"
PLG_SYSTEM_BETTERSEARCH_LOAD_EVERYWHERE_DESC="The script is added only to pages with a Gridbox search field. Turn on when you use an own selector for fields of other extensions."
PLG_SYSTEM_BETTERSEARCH_ICON_SUBMIT_LABEL="Magnifier icon searches"
PLG_SYSTEM_BETTERSEARCH_ICON_SUBMIT_DESC="Clicking the icon of a Gridbox search field opens the results page (Gridbox uses it to clear the field)."
PLG_SYSTEM_BETTERSEARCH_AUTO_SYNC_LABEL="Update the index automatically"
PLG_SYSTEM_BETTERSEARCH_AUTO_SYNC_DESC="Gridbox saves products without notifying other extensions. The plugin compares the products with the index after a visitor's page has been sent and indexes new and changed ones."
PLG_SYSTEM_BETTERSEARCH_SYNC_INTERVAL_LABEL="Check every (minutes)"
PLG_SYSTEM_BETTERSEARCH_SYNC_INTERVAL_DESC="How often the index is compared with Gridbox. A changed product can be found under its new name after at most this time."
PLG_SYSTEM_BETTERSEARCH_SYNC_BUDGET_LABEL="Products per check"
PLG_SYSTEM_BETTERSEARCH_SYNC_BUDGET_DESC="At most this many products are indexed in one automatic check; the rest follows in the next ones."
PLG_SYSTEM_BETTERSEARCH_CACHE_LABEL="Cache results (minutes)"
PLG_SYSTEM_BETTERSEARCH_CACHE_DESC="Results of the same query are kept for this time. Every index update and every change of settings starts afresh. 0 = no cache."
PLG_SYSTEM_BETTERSEARCH_LOG_LABEL="Search statistics"
PLG_SYSTEM_BETTERSEARCH_LOG_DESC="Counts the queries of the results page (no personal data): most searched, without results. See tab “Index &amp; tools”."
PLG_SYSTEM_BETTERSEARCH_SUPPORT_LABEL="Project &amp; support"
PLG_SYSTEM_BETTERSEARCH_SUPPORT_DESC="<a href=\"https://github.com/merserwis/\" target=\"_blank\" rel=\"noopener\">github.com/merserwis</a>"

; ---------------------------------------------------------------- engine
PLG_SYSTEM_BETTERSEARCH_ENGINE_NOTE="Every word of the query must be found in a product. Neighbouring parts of a model code are one word: <b>MI 3155</b> is searched as <b>mi3155</b> and also matches “MI-3155” or “MI3155” in the product. Changes on this tab apply to the index: update it on the tab “Index &amp; tools” (or wait for the automatic check)."
PLG_SYSTEM_BETTERSEARCH_INDEX_FIELDS_LABEL="Product fields to search"
PLG_SYSTEM_BETTERSEARCH_INDEX_FIELDS_DESC="Values of these Gridbox fields are found (e.g. manufacturer, model, parameters). Leave out fields shared by many products, such as contact persons — they would make every product match their names."
