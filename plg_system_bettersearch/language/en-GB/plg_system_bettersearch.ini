PLG_SYSTEM_BETTERSEARCH_MIN_CHARS_LABEL="Minimum query length"
PLG_SYSTEM_BETTERSEARCH_STEMMING_LABEL="Word endings"
PLG_SYSTEM_BETTERSEARCH_STEMMING_DESC="“mierników” also finds “miernik”, “mierniki”. Light rules for Polish."
PLG_SYSTEM_BETTERSEARCH_TYPO_LABEL="Typo correction"
PLG_SYSTEM_BETTERSEARCH_TYPO_DESC="When nothing is found, words unknown to the index are replaced by the closest known word (“eurotset” → “eurotest”)."
PLG_SYSTEM_BETTERSEARCH_PARTIAL_LABEL="Partial matches"
PLG_SYSTEM_BETTERSEARCH_PARTIAL_DESC="When no product has all the words, show the products with most of them (with a note)."
PLG_SYSTEM_BETTERSEARCH_MIN_RELEVANCE_LABEL="Cut weak matches (%)"
PLG_SYSTEM_BETTERSEARCH_MIN_RELEVANCE_DESC="Results scoring below this percentage of the best result are left out (e.g. products that only mention the word deep in the description). 0 = keep all."
