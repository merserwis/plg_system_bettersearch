; ---------------------------------------------------------------- правила
PLG_SYSTEM_BETTERSEARCH_RULES_NOTE="<b>Ручний порядок:</b> закріплюйте товари вгорі результатів вибраних запитів у заданому вами порядку (перетягуйте товари). <b>Приховати</b> вилучає товари з результатів цих запитів. Підсилення піднімають товари або цілі категорії вгору (додатні) чи опускають униз (від’ємні) у кожному пошуку."
PLG_SYSTEM_BETTERSEARCH_RULES_LABEL="Правила запитів"
PLG_SYSTEM_BETTERSEARCH_RULES_DESC="Закріплені або приховані товари для заданих запитів."
