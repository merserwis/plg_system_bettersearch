PLG_SYSTEM_BETTERSEARCH_REDIRECTS_DESC="Одне на рядок: фрази (через кому) =&gt; адреса, за бажанням | підпис. Пошук саме цієї фрази (написаної будь-як: «MI-3155» = «mi 3155») відкриває адресу замість сторінки результатів; миттєві результати показують її першим варіантом. Адреси: шлях на цьому сайті (/oferta/…) або адреса http(s)."
