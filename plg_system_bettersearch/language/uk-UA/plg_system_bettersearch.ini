PLG_SYSTEM_BETTERSEARCH_RESULTS_ORDER_LABEL="Порядок розділів результатів"
PLG_SYSTEM_BETTERSEARCH_RESULTS_ORDER_DESC="Перетягніть розділи (або скористайтеся стрілками) у порядку, в якому вони мають з’являтися в живих підказках: відповідні категорії, кожен застосунок (магазин, блог…) і сторінки. Перший застосунок показує найбільше результатів («Кількість товарів»), решта – «Елементів інших застосунків». У цьому порядку й фільтри застосунків на сторінці результатів."
