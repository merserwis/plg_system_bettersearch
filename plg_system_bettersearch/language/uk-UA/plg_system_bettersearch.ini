PLG_SYSTEM_BETTERSEARCH_SUGGEST_MIN_SEARCHES_DESC="Фраза пропонується лише тоді, коли її шукали щонайменше стільки разів (одноразова помилка не пропонується іншим)."
PLG_SYSTEM_BETTERSEARCH_PAGE_FACETS_LABEL="Фільтри поруч із результатами"
PLG_SYSTEM_BETTERSEARCH_PAGE_FACETS_DESC="Бренд, діапазон цін, лише зі знижкою та лише в наявності. Кожен фільтр показує, скільки результатів залишиться; фільтри, які нічого не змінять, не показуються."
