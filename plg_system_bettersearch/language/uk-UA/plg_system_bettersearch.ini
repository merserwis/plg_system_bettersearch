PLG_SYSTEM_BETTERSEARCH="System - Better Search for Gridbox"
PLG_SYSTEM_BETTERSEARCH_XML_DESCRIPTION="Замінює пошук Gridbox: миттєві результати під полями пошуку та сторінка результатів із власного індексу, у якому коди моделей збігаються незалежно від способу написання (MI 3155 = MI3155 = MI-3155). Ручне ранжування, винятки та повний контроль над виглядом."
PLG_SYSTEM_BETTERSEARCH_INSTALL_NO_GRIDBOX="Better Search for Gridbox працює з Balbooa Gridbox, який не встановлено на цьому сайті."
PLG_SYSTEM_BETTERSEARCH_INSTALL_BUILD_INDEX="Better Search for Gridbox: відкрийте плагін, вкладку «Індекс & інструменти», і натисніть «Оновити індекс», щоб створити пошуковий індекс (він також створюється автоматично під час перших відвідувань)."

