PLG_SYSTEM_BETTERSEARCH_FIELDSET_TEXTS="Тексти &amp; зображення"
PLG_SYSTEM_BETTERSEARCH_FIELDSET_TOOLS="Індекс &amp; інструменти"

; ---------------------------------------------------------------- загальні
PLG_SYSTEM_BETTERSEARCH_INFO_LABEL="Better Search for Gridbox"
PLG_SYSTEM_BETTERSEARCH_INFO_DESC="Поля пошуку Gridbox (пошук магазину та пошукові елементи) показують миттєві результати цього плагіна, а сторінка результатів пошуку Gridbox виводить його результати. Коди моделей знаходяться незалежно від способу написання: <b>MI 3155</b>, <b>MI3155</b> і <b>MI-3155</b> — це той самий товар. Після встановлення створіть індекс на вкладці <b>Індекс &amp; інструменти</b>."
PLG_SYSTEM_BETTERSEARCH_APPS_LABEL="Застосунки для пошуку"
PLG_SYSTEM_BETTERSEARCH_APPS_DESC="Застосунки Gridbox, сторінки яких знаходяться. Порожньо = усі застосунки магазину. Додайте застосунки блогу, щоб знаходити також статті (вони показуються окремою групою)."
PLG_SYSTEM_BETTERSEARCH_LIVE_ENABLED_LABEL="Миттєві результати"
PLG_SYSTEM_BETTERSEARCH_LIVE_ENABLED_DESC="Результати під полем пошуку під час введення. Вимкнено = поле лише веде на сторінку результатів."
PLG_SYSTEM_BETTERSEARCH_REPLACE_RESULTS_LABEL="Замінити сторінку результатів"
PLG_SYSTEM_BETTERSEARCH_REPLACE_RESULTS_DESC="Сторінка результатів пошуку Gridbox показує результати цього плагіна (Gridbox взагалі не виконує пошук)."
PLG_SYSTEM_BETTERSEARCH_RESULTS_URL_LABEL="Адреса сторінки результатів"
PLG_SYSTEM_BETTERSEARCH_RESULTS_URL_DESC="Куди ведуть Enter і «Показати всі результати», наприклад /szukaj. Порожньо = адреса, задана в пошуковому елементі Gridbox (або сторінка пошуку магазину Gridbox)."
PLG_SYSTEM_BETTERSEARCH_SELECTOR_LABEL="Поля пошуку (селектор CSS)"
PLG_SYSTEM_BETTERSEARCH_SELECTOR_DESC="Поля, які обслуговує плагін. Порожньо = поля пошуку Gridbox і поле модуля Better Search."
PLG_SYSTEM_BETTERSEARCH_LOAD_EVERYWHERE_LABEL="Завантажувати на кожній сторінці"
PLG_SYSTEM_BETTERSEARCH_LOAD_EVERYWHERE_DESC="Скрипт додається лише на сторінки з полем пошуку Gridbox. Увімкніть, якщо використовуєте власний селектор для полів інших розширень."
PLG_SYSTEM_BETTERSEARCH_ICON_SUBMIT_LABEL="Іконка лупи запускає пошук"
PLG_SYSTEM_BETTERSEARCH_ICON_SUBMIT_DESC="Натискання іконки поля пошуку Gridbox відкриває сторінку результатів (Gridbox використовує її для очищення поля)."
PLG_SYSTEM_BETTERSEARCH_AUTO_SYNC_LABEL="Оновлювати індекс автоматично"
PLG_SYSTEM_BETTERSEARCH_AUTO_SYNC_DESC="Gridbox зберігає товари, не повідомляючи інші розширення. Плагін порівнює товари з індексом після надсилання сторінки відвідувачу та індексує нові й змінені."
PLG_SYSTEM_BETTERSEARCH_SYNC_INTERVAL_LABEL="Перевіряти кожні (хвилин)"
PLG_SYSTEM_BETTERSEARCH_SYNC_INTERVAL_DESC="Як часто індекс порівнюється з Gridbox. Змінений товар можна знайти за новою назвою не пізніше, ніж через цей час."
PLG_SYSTEM_BETTERSEARCH_SYNC_BUDGET_LABEL="Товарів за одну перевірку"
PLG_SYSTEM_BETTERSEARCH_SYNC_BUDGET_DESC="Не більше стількох товарів індексується за одну автоматичну перевірку; решта — під час наступних."
PLG_SYSTEM_BETTERSEARCH_CACHE_LABEL="Кешувати результати (хвилин)"
PLG_SYSTEM_BETTERSEARCH_CACHE_DESC="Результати того самого запиту зберігаються протягом цього часу. Кожне оновлення індексу та кожна зміна налаштувань скидають кеш. 0 = без кешу."
PLG_SYSTEM_BETTERSEARCH_LOG_LABEL="Статистика пошуку"
PLG_SYSTEM_BETTERSEARCH_LOG_DESC="Підраховує запити сторінки результатів (без персональних даних): найпопулярніші, без результатів. Див. вкладку «Індекс &amp; інструменти»."
PLG_SYSTEM_BETTERSEARCH_SUPPORT_LABEL="Проєкт &amp; підтримка"
PLG_SYSTEM_BETTERSEARCH_SUPPORT_DESC="<a href=\"https://github.com/merserwis/\" target=\"_blank\" rel=\"noopener\">github.com/merserwis</a>"

; ---------------------------------------------------------------- пошуковий механізм
PLG_SYSTEM_BETTERSEARCH_ENGINE_NOTE="Кожне слово запиту має бути знайдене в товарі. Сусідні частини коду моделі вважаються одним словом: <b>MI 3155</b> шукається як <b>mi3155</b> і також збігається з «MI-3155» або «MI3155» у товарі. Зміни на цій вкладці стосуються індексу: оновіть його на вкладці «Індекс &amp; інструменти» (або дочекайтеся автоматичної перевірки)."
PLG_SYSTEM_BETTERSEARCH_INDEX_FIELDS_LABEL="Поля товару для пошуку"
PLG_SYSTEM_BETTERSEARCH_INDEX_FIELDS_DESC="Значення цих полів Gridbox знаходяться (наприклад, виробник, модель, параметри). Не додавайте поля, спільні для багатьох товарів, як-от контактні особи — інакше кожен товар збігатиметься з їхніми іменами."
PLG_SYSTEM_BETTERSEARCH_INDEX_VARIATION_SKU_LABEL="Шукати коди варіантів (SKU)"
PLG_SYSTEM_BETTERSEARCH_INDEX_PARENT_CATS_LABEL="Шукати назви батьківських категорій"
PLG_SYSTEM_BETTERSEARCH_INDEX_PARENT_CATS_DESC="Запит із назвою категорії знаходить також товари її підкатегорій."
PLG_SYSTEM_BETTERSEARCH_INDEX_TAGS_LABEL="Шукати теги"
PLG_SYSTEM_BETTERSEARCH_SEARCH_BODY_LABEL="Шукати в описах"
PLG_SYSTEM_BETTERSEARCH_SEARCH_BODY_DESC="Слова, знайдені лише в описах, важать значно менше, ніж у назвах, кодах, полях і категоріях."
PLG_SYSTEM_BETTERSEARCH_INDEX_INTRO_LABEL="Вступний текст"
PLG_SYSTEM_BETTERSEARCH_INDEX_META_LABEL="Метаопис і ключові слова"
PLG_SYSTEM_BETTERSEARCH_INDEX_CONTENT_LABEL="Вміст сторінки"
PLG_SYSTEM_BETTERSEARCH_INDEX_CONTENT_DESC="Текст макета сторінки товару (вкладки, описи, характеристики)."
PLG_SYSTEM_BETTERSEARCH_CONTENT_LIMIT_LABEL="Символів опису на товар"
PLG_SYSTEM_BETTERSEARCH_MIN_CHARS_LABEL="Мінімальна довжина запиту"
PLG_SYSTEM_BETTERSEARCH_STEMMING_LABEL="Закінчення слів"
PLG_SYSTEM_BETTERSEARCH_STEMMING_DESC="«mierników» знаходить також «miernik», «mierniki». Прості правила для польської мови."
PLG_SYSTEM_BETTERSEARCH_TYPO_LABEL="Виправлення помилок"
PLG_SYSTEM_BETTERSEARCH_TYPO_DESC="Якщо нічого не знайдено, невідомі індексу слова замінюються найближчим відомим словом («eurotset» → «eurotest»)."
PLG_SYSTEM_BETTERSEARCH_PARTIAL_LABEL="Часткові збіги"
PLG_SYSTEM_BETTERSEARCH_PARTIAL_DESC="Якщо жоден товар не містить усіх слів, показати товари з найбільшою їх кількістю (з приміткою)."
PLG_SYSTEM_BETTERSEARCH_MIN_RELEVANCE_LABEL="Відсікати слабкі збіги (%)"
PLG_SYSTEM_BETTERSEARCH_MIN_RELEVANCE_DESC="Результати з оцінкою нижче цього відсотка від найкращого результату пропускаються (наприклад, товари, що згадують слово лише глибоко в описі). 0 = залишати всі."
PLG_SYSTEM_BETTERSEARCH_SYNONYMS_LABEL="Синоніми"
PLG_SYSTEM_BETTERSEARCH_SYNONYMS_DESC="Одна група на рядок, через кому: <code>multimetr, miernik uniwersalny</code> — кожне слово знаходить інші. В один бік: <code>rcd =&gt; wyłącznik różnicowoprądowy</code>. Рядки, що починаються з #, ігноруються."
PLG_SYSTEM_BETTERSEARCH_STOPWORDS_LABEL="Ігноровані слова"
PLG_SYSTEM_BETTERSEARCH_STOPWORDS_DESC="Через кому. Ігноруються, якщо в запиті є щось інше, і ніколи всередині коду моделі («A 1199»)."
PLG_SYSTEM_BETTERSEARCH_WEIGHTS_LABEL="Ваги"
PLG_SYSTEM_BETTERSEARCH_WEIGHTS_DESC="Скільки важить слово залежно від місця, де його знайдено. Тестова консоль на вкладці «Індекс &amp; інструменти» показує оцінку кожного результату та її причини."
PLG_SYSTEM_BETTERSEARCH_W_SKU_LABEL="Код товару (SKU)"
PLG_SYSTEM_BETTERSEARCH_W_TITLE_LABEL="Назва"
PLG_SYSTEM_BETTERSEARCH_W_FIELDS_LABEL="Поля"
PLG_SYSTEM_BETTERSEARCH_W_CATS_LABEL="Категорії та теги"
PLG_SYSTEM_BETTERSEARCH_W_BODY_LABEL="Описи"
PLG_SYSTEM_BETTERSEARCH_W_DIGITS_LABEL="Слова з цифрами ×"
PLG_SYSTEM_BETTERSEARCH_W_DIGITS_DESC="Номери моделей важать більше за слова: їхня вага множиться на цей коефіцієнт."
PLG_SYSTEM_BETTERSEARCH_POPULARITY_LABEL="Популярність"
PLG_SYSTEM_BETTERSEARCH_POPULARITY_DESC="Бали за перегляди сторінки (логарифмічно): за однакових збігів першим іде товар, який переглядали частіше. 0 = вимкнено."
