PLG_SYSTEM_BETTERSEARCH_GSC_NOTE="<p class=\"mb-1\">Запити, якими люди знаходять ваш сайт у Google, поруч із тим, що знаходить для них цей пошук: фрази без результатів тут — кандидати на синоніми або переспрямування.</p><p class=\"mb-0\"><strong>Автоматично (раз на добу):</strong> створіть сервісний обліковий запис у Google Cloud, увімкніть «Google Search Console API», додайте e-mail облікового запису як користувача вашого ресурсу Search Console і вставте нижче його ключ JSON. <strong>Без ключа:</strong> експортуйте таблицю «Запити» з Search Console у CSV та імпортуйте її кнопкою нижче.</p>"
