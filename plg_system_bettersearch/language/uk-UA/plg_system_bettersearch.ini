PLG_SYSTEM_BETTERSEARCH_PAGE_GROUP_ORDER_LABEL="Групувати за порядком розділів"
PLG_SYSTEM_BETTERSEARCH_PAGE_GROUP_ORDER_DESC="При сортуванні «Найкращий збіг»: спершу результати першого розділу, потім наступного (у кожному за релевантністю). Вимкнено = усі результати змішані за релевантністю."
; ---------------------------------------------------------------- 1.6.2 statistics exclusions
PLG_SYSTEM_BETTERSEARCH_STATS_EXCLUDE_IPS_LABEL="Не збирати статистику з IP-адрес"
PLG_SYSTEM_BETTERSEARCH_STATS_EXCLUDE_IPS_DESC="Пошуки, кліки й додавання в кошик з цих адрес не враховуються (статистика пошуку, конверсії, звіт e-mail) – напр. офіс компанії, щоб статистика показувала лише клієнтів. По одній у рядку або через кому: адреса (<code>83.1.2.3</code>, <code>2001:db8::1</code>), мережа (<code>91.200.10.0/24</code>, <code>2001:db8::/48</code>) або адреса IPv4 з * (<code>10.48.*</code>). Текст після # – коментар. Сам пошук працює для всіх однаково."
PLG_SYSTEM_BETTERSEARCH_STATS_EXCLUDE_GROUPS_LABEL="Не збирати статистику авторизованих із груп"
PLG_SYSTEM_BETTERSEARCH_STATS_EXCLUDE_GROUPS_DESC="Пошуки авторизованих членів цих груп користувачів (напр. працівників) не враховуються – з будь-якої адреси."
PLG_SYSTEM_BETTERSEARCH_STATS_IP_SOURCE_LABEL="Адреса відвідувача з"
PLG_SYSTEM_BETTERSEARCH_STATS_IP_SOURCE_DESC="Звідки брати адресу відвідувача. Автоматично: за Cloudflare чи іншим проксі – адреса, яку він передає (CF-Connecting-IP, X-Real-IP, X-Forwarded-For), інакше адреса з’єднання. Лише з’єднання: коли перед сайтом немає проксі."
