PLG_SYSTEM_BETTERSEARCH_INSTANT_REINDEX_LABEL="Оновлювати індекс одразу після зміни"
PLG_SYSTEM_BETTERSEARCH_INSTANT_REINDEX_DESC="Коли сторінку або товар Gridbox зберігають, публікують, знімають з публікації чи переміщують у кошик (у редакторі Gridbox або в списках), змінені елементи індексуються знову одразу після цього запиту, тож пошук показує зміну відразу, а не після наступної перевірки."
PLG_SYSTEM_BETTERSEARCH_TRACK_CONVERSIONS_LABEL="Статистика конверсій"
PLG_SYSTEM_BETTERSEARCH_TRACK_CONVERSIONS_DESC="Підраховує кліки на результати пошуку та товари, додані до кошика після такого кліку, для кожного запиту (Інструменти → Конверсії). Власний cookie сайту (bs_src: id товару → запит, на 30 днів) пов’язує кошик із пошуком; персональні дані не зберігаються."
PLG_SYSTEM_BETTERSEARCH_REDIRECTS_LABEL="Переспрямування"
PLG_SYSTEM_BETTERSEARCH_REDIRECTS_DESC="Одне на рядок: фрази (через кому) =&gt; адреса, за бажанням | підпис. Пошук саме цієї фрази (написаної будь-як: «MI-3155» = «mi 3155») відкриває адресу замість сторінки результатів; миттєві результати показують її першим варіантом. Адреси: шлях на цьому сайті (/oferta/…) або адреса http(s)."
PLG_SYSTEM_BETTERSEARCH_DID_YOU_MEAN_LABEL="«Можливо, ви мали на увазі…»"
PLG_SYSTEM_BETTERSEARCH_DID_YOU_MEAN_DESC="Якщо нічого не знайдено, пропонувати запити з результатами, написані майже так само (зі статистики пошуку)."
PLG_SYSTEM_BETTERSEARCH_LIVE_SUGGESTIONS_LABEL="Пропонувати популярні запити"
PLG_SYSTEM_BETTERSEARCH_LIVE_SUGGESTIONS_DESC="Над миттєвими результатами: запити з результатами, що починаються як введений текст, найпопулярніші першими (зі статистики пошуку). Клік запускає пошук."
PLG_SYSTEM_BETTERSEARCH_LIVE_SUGGESTIONS_LIMIT_LABEL="Кількість підказок"
