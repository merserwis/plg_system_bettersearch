PLG_SYSTEM_BETTERSEARCH="Systém - Better Search for Gridbox"
PLG_SYSTEM_BETTERSEARCH_XML_DESCRIPTION="Nahrádza vyhľadávanie Gridbox: živé výsledky pod vyhľadávacími poľami a stránka výsledkov z vlastného indexu, v ktorom sa kódy modelov zhodujú bez ohľadu na spôsob zápisu (MI 3155 = MI3155 = MI-3155). Ručné poradie, vylúčenia a úplná kontrola nad vzhľadom."
PLG_SYSTEM_BETTERSEARCH_INSTALL_NO_GRIDBOX="Better Search for Gridbox spolupracuje s Balbooa Gridbox, ktorý na tomto webe nie je nainštalovaný."
PLG_SYSTEM_BETTERSEARCH_INSTALL_BUILD_INDEX="Better Search for Gridbox: otvorte doplnok, kartu „Index & nástroje“, a kliknite na „Aktualizovať index“, aby sa vytvoril vyhľadávací index (vytvorí sa aj automaticky pri prvých návštevách)."

