PLG_SYSTEM_BETTERSEARCH_WEIGHTS_DESC="Akú váhu má slovo podľa toho, kde sa nájde. Testovacia konzola na karte „Index &amp; nástroje“ zobrazuje skóre každého výsledku a jeho dôvody."
