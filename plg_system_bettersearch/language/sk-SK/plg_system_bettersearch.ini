PLG_SYSTEM_BETTERSEARCH_STOPWORDS_DESC="Oddelené čiarkou. Ignorujú sa, pokiaľ dopyt neobsahuje nič iné, a nikdy nie vo vnútri kódu modelu („A 1199“)."
