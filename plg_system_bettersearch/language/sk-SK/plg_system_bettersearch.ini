; ---------------------------------------------------------------- všeobecné
PLG_SYSTEM_BETTERSEARCH_INFO_LABEL="Better Search for Gridbox"
PLG_SYSTEM_BETTERSEARCH_INFO_DESC="Vyhľadávacie polia Gridbox (vyhľadávanie v obchode a vyhľadávacie prvky) zobrazujú živé výsledky z tohto doplnku a stránka výsledkov vyhľadávania Gridbox uvádza jeho výsledky. Kódy modelov sa nájdu bez ohľadu na spôsob zápisu: <b>MI 3155</b>, <b>MI3155</b> a <b>MI-3155</b> sú ten istý produkt. Po inštalácii vytvorte index na karte <b>Index &amp; nástroje</b>."
PLG_SYSTEM_BETTERSEARCH_APPS_LABEL="Prehľadávané aplikácie"
PLG_SYSTEM_BETTERSEARCH_APPS_DESC="Aplikácie Gridbox, ktorých stránky sa vyhľadávajú. Prázdne = všetky aplikácie obchodu. Pridajte aplikácie blogu, ak sa majú nájsť aj články (zobrazia sa ako samostatná skupina)."
PLG_SYSTEM_BETTERSEARCH_LIVE_ENABLED_LABEL="Živé výsledky"
PLG_SYSTEM_BETTERSEARCH_LIVE_ENABLED_DESC="Výsledky pod vyhľadávacím poľom počas písania. Vypnuté = pole vedie iba na stránku výsledkov."
PLG_SYSTEM_BETTERSEARCH_REPLACE_RESULTS_LABEL="Nahradiť stránku výsledkov"
PLG_SYSTEM_BETTERSEARCH_REPLACE_RESULTS_DESC="Stránka výsledkov vyhľadávania Gridbox zobrazuje výsledky tohto doplnku (Gridbox vôbec nevyhľadáva)."
PLG_SYSTEM_BETTERSEARCH_RESULTS_URL_LABEL="Adresa stránky výsledkov"
PLG_SYSTEM_BETTERSEARCH_RESULTS_URL_DESC="Kam vedie Enter a „Zobraziť všetky výsledky“, napr. /szukaj. Prázdne = adresa nastavená vo vyhľadávacom prvku Gridbox (alebo stránka vyhľadávania obchodu Gridbox)."
PLG_SYSTEM_BETTERSEARCH_SELECTOR_LABEL="Vyhľadávacie polia (selektor CSS)"
PLG_SYSTEM_BETTERSEARCH_SELECTOR_DESC="Polia, ktoré doplnok preberá. Prázdne = vyhľadávacie polia Gridbox a pole modulu Better Search."
PLG_SYSTEM_BETTERSEARCH_LOAD_EVERYWHERE_LABEL="Načítať na každej stránke"
PLG_SYSTEM_BETTERSEARCH_LOAD_EVERYWHERE_DESC="Skript sa pridáva iba na stránky s vyhľadávacím poľom Gridbox. Zapnite, ak používate vlastný selektor pre polia iných rozšírení."
PLG_SYSTEM_BETTERSEARCH_ICON_SUBMIT_LABEL="Ikona lupy spúšťa vyhľadávanie"
PLG_SYSTEM_BETTERSEARCH_ICON_SUBMIT_DESC="Kliknutie na ikonu vyhľadávacieho poľa Gridbox otvorí stránku výsledkov (Gridbox ju používa na vymazanie poľa)."
PLG_SYSTEM_BETTERSEARCH_AUTO_SYNC_LABEL="Aktualizovať index automaticky"
PLG_SYSTEM_BETTERSEARCH_AUTO_SYNC_DESC="Gridbox ukladá produkty bez upozornenia iných rozšírení. Doplnok po odoslaní stránky návštevníkovi porovná produkty s indexom a zaindexuje nové a zmenené."
PLG_SYSTEM_BETTERSEARCH_SYNC_INTERVAL_LABEL="Kontrolovať každých (minút)"
PLG_SYSTEM_BETTERSEARCH_SYNC_INTERVAL_DESC="Ako často sa index porovnáva s Gridbox. Zmenený produkt sa dá nájsť pod novým názvom najneskôr po tomto čase."
PLG_SYSTEM_BETTERSEARCH_SYNC_BUDGET_LABEL="Produktov na kontrolu"
PLG_SYSTEM_BETTERSEARCH_SYNC_BUDGET_DESC="Pri jednej automatickej kontrole sa zaindexuje najviac toľkoto produktov; zvyšok nasleduje pri ďalších."
PLG_SYSTEM_BETTERSEARCH_CACHE_LABEL="Ukladať výsledky do vyrovnávacej pamäte (minúty)"
PLG_SYSTEM_BETTERSEARCH_CACHE_DESC="Výsledky rovnakého dopytu sa uchovávajú po tento čas. Každá aktualizácia indexu a každá zmena nastavení začína odznova. 0 = bez vyrovnávacej pamäte."
PLG_SYSTEM_BETTERSEARCH_LOG_LABEL="Štatistiky vyhľadávania"
PLG_SYSTEM_BETTERSEARCH_LOG_DESC="Počíta dopyty stránky výsledkov (bez osobných údajov): najhľadanejšie, bez výsledkov. Pozri kartu „Index &amp; nástroje“."
PLG_SYSTEM_BETTERSEARCH_SUPPORT_LABEL="Projekt &amp; podpora"
PLG_SYSTEM_BETTERSEARCH_SUPPORT_DESC="<a href=\"https://github.com/merserwis/\" target=\"_blank\" rel=\"noopener\">github.com/merserwis</a>"

; ---------------------------------------------------------------- vyhľadávač
PLG_SYSTEM_BETTERSEARCH_ENGINE_NOTE="Každé slovo dopytu sa musí v produkte nájsť. Susedné časti kódu modelu tvoria jedno slovo: <b>MI 3155</b> sa hľadá ako <b>mi3155</b> a zodpovedá aj „MI-3155“ alebo „MI3155“ v produkte. Zmeny na tejto karte sa týkajú indexu: aktualizujte ho na karte „Index &amp; nástroje“ (alebo počkajte na automatickú kontrolu)."
PLG_SYSTEM_BETTERSEARCH_INDEX_FIELDS_LABEL="Prehľadávané polia produktu"
PLG_SYSTEM_BETTERSEARCH_INDEX_FIELDS_DESC="Hodnoty týchto polí Gridbox sa vyhľadávajú (napr. výrobca, model, parametre). Vynechajte polia spoločné pre mnoho produktov, napríklad kontaktné osoby — inak by ich mená zodpovedali každému produktu."
PLG_SYSTEM_BETTERSEARCH_INDEX_VARIATION_SKU_LABEL="Prehľadávať kódy variantov (SKU)"
PLG_SYSTEM_BETTERSEARCH_INDEX_PARENT_CATS_LABEL="Prehľadávať názvy nadradených kategórií"
PLG_SYSTEM_BETTERSEARCH_INDEX_PARENT_CATS_DESC="Dopyt s názvom kategórie nájde aj produkty jej podkategórií."
PLG_SYSTEM_BETTERSEARCH_INDEX_TAGS_LABEL="Prehľadávať značky"
PLG_SYSTEM_BETTERSEARCH_SEARCH_BODY_LABEL="Prehľadávať popisy"
PLG_SYSTEM_BETTERSEARCH_SEARCH_BODY_DESC="Slová nájdené iba v popisoch majú oveľa menšiu váhu ako v názvoch, kódoch, poliach a kategóriách."
PLG_SYSTEM_BETTERSEARCH_INDEX_INTRO_LABEL="Úvodný text"
PLG_SYSTEM_BETTERSEARCH_INDEX_META_LABEL="Meta popis a kľúčové slová"
PLG_SYSTEM_BETTERSEARCH_INDEX_CONTENT_LABEL="Obsah stránky"
PLG_SYSTEM_BETTERSEARCH_INDEX_CONTENT_DESC="Text rozloženia stránky produktu (karty, popisy, špecifikácie)."
PLG_SYSTEM_BETTERSEARCH_CONTENT_LIMIT_LABEL="Znakov popisu na produkt"
PLG_SYSTEM_BETTERSEARCH_MIN_CHARS_LABEL="Minimálna dĺžka dopytu"
