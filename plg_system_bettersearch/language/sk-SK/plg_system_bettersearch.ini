PLG_SYSTEM_BETTERSEARCH_STEMMING_DESC="„mierników“ nájde aj „miernik“, „mierniki“. Jednoduché pravidlá pre poľštinu."
PLG_SYSTEM_BETTERSEARCH_TYPO_LABEL="Oprava preklepov"
PLG_SYSTEM_BETTERSEARCH_TYPO_DESC="Ak sa nič nenájde, slová, ktoré index nepozná, sa nahradia najbližším známym slovom („eurotset“ → „eurotest“)."
PLG_SYSTEM_BETTERSEARCH_PARTIAL_LABEL="Čiastočné zhody"
PLG_SYSTEM_BETTERSEARCH_PARTIAL_DESC="Ak žiadny produkt neobsahuje všetky slová, zobraziť produkty s väčšinou z nich (s poznámkou)."
PLG_SYSTEM_BETTERSEARCH_MIN_RELEVANCE_LABEL="Odstrániť slabé zhody (%)"
PLG_SYSTEM_BETTERSEARCH_MIN_RELEVANCE_DESC="Výsledky so skóre pod týmto percentom najlepšieho výsledku sa vynechajú (napr. produkty, ktoré slovo spomínajú iba hlboko v popise). 0 = ponechať všetky."
PLG_SYSTEM_BETTERSEARCH_SYNONYMS_LABEL="Synonymá"
