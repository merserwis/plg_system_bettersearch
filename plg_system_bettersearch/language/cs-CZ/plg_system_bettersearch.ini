PLG_SYSTEM_BETTERSEARCH_FACET_STOCK_DESC="Produkty skladem (podle indexu)."
PLG_SYSTEM_BETTERSEARCH_FIELDSET_GSC="Google Search Console"
PLG_SYSTEM_BETTERSEARCH_GSC_NOTE="<p class=\"mb-1\">Dotazy, kterými lidé na Googlu nacházejí váš web, vedle toho, co pro ně najde toto vyhledávání: fráze bez výsledků zde jsou kandidáty na synonyma nebo přesměrování.</p><p class=\"mb-0\"><strong>Automaticky (jednou denně):</strong> vytvořte servisní účet v Google Cloud, zapněte „Google Search Console API“, přidejte e-mailovou adresu účtu jako uživatele své služby v Search Console a níže vložte jeho klíč JSON. <strong>Bez klíče:</strong> exportujte z Search Console tabulku „Dotazy“ jako CSV a importujte ji tlačítkem níže.</p>"
