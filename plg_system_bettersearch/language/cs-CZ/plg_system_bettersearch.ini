PLG_SYSTEM_BETTERSEARCH_RULES_NOTE="<b>Ruční pořadí:</b> připněte produkty na začátek výsledků vybraných dotazů v pořadí, které nastavíte (přetažením produktů). <b>Skrýt</b> odstraní produkty z výsledků těchto dotazů. Zvýhodnění posouvají produkty nebo celé kategorie výše (kladné) nebo níže (záporné) při každém vyhledávání."
