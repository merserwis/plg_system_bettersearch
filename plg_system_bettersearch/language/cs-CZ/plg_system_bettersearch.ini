PLG_SYSTEM_BETTERSEARCH_PAGE_FACETS_LABEL="Filtry vedle výsledků"
PLG_SYSTEM_BETTERSEARCH_PAGE_FACETS_DESC="Značka, cenové rozpětí, jen v akci a jen skladem. Každý filtr ukazuje, kolik výsledků ponechá; filtry, které by nic nezměnily, se nezobrazují."
