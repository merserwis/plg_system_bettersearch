PLG_SYSTEM_BETTERSEARCH_W_DIGITS_DESC="Čísla modelů vypovídají víc než slova: jejich váha se násobí tímto koeficientem."
PLG_SYSTEM_BETTERSEARCH_POPULARITY_LABEL="Oblíbenost"
PLG_SYSTEM_BETTERSEARCH_POPULARITY_DESC="Body za zobrazení stránky (logaritmicky): při stejné shodě má přednost častěji zobrazovaný produkt. 0 = vypnuto."
