PLG_SYSTEM_BETTERSEARCH_FIELDSET_SEO="SEO"
PLG_SYSTEM_BETTERSEARCH_SEO_NOTE="Jak stránku výsledků vidí vyhledávače. Výsledky vyhledávání jsou chudé, neustále se měnící stránky: ve výchozím nastavení se neindexují, ale jejich odkazy na produkty se sledují, adresa každého seřazeného nebo filtrovaného zobrazení odkazuje na prosté výsledky dotazu a stránka dostane vlastní titulek a popis."
