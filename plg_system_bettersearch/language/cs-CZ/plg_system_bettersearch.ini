PLG_SYSTEM_BETTERSEARCH_RESULTS_ORDER_DESC="Přetáhněte sekce (nebo použijte šipky) do pořadí, v jakém se zobrazí v okamžitých výsledcích: odpovídající kategorie, každá aplikace (obchod, blog…) a stránky. První aplikace zobrazuje nejvíce výsledků („Zobrazené produkty“), ostatní „Položky dalších aplikací“. V tomto pořadí uvádí své filtry aplikací i stránka výsledků."
