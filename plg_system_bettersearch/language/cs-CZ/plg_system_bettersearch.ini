PLG_SYSTEM_BETTERSEARCH_INSTANT_REINDEX_LABEL="Aktualizovat index hned po změně"
PLG_SYSTEM_BETTERSEARCH_INSTANT_REINDEX_DESC="Když se stránka nebo produkt Gridbox uloží, publikuje, zruší publikování nebo přesune do koše (v editoru Gridbox nebo v seznamech), změněné položky se zaindexují znovu hned po tomto požadavku, takže vyhledávání ukáže změnu okamžitě, a ne až po příští kontrole."
