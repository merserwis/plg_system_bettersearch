PLG_SYSTEM_BETTERSEARCH_LIVE_SUGGESTIONS_DESC="Nad okamžitými výsledky: hledání s výsledky, která začínají jako napsaný text, nejhledanější první (ze statistik vyhledávání). Kliknutí je vyhledá."
