PLG_SYSTEM_BETTERSEARCH_STATS_EXCLUDE_IPS_LABEL="Vynechat ze statistik (IP adresy)"
PLG_SYSTEM_BETTERSEARCH_STATS_EXCLUDE_IPS_DESC="Hledání, kliknutí a košíky z těchto adres se nezapočítávají (statistiky vyhledávání, konverze, zpráva e-mailem) – např. kancelář firmy, aby statistiky ukazovaly jen zákazníky. Jedna na řádek nebo oddělené čárkami: adresa (<code>83.1.2.3</code>, <code>2001:db8::1</code>), síť (<code>91.200.10.0/24</code>, <code>2001:db8::/48</code>) nebo adresa IPv4 s * (<code>10.48.*</code>). Text za # je komentář. Samotné vyhledávání funguje pro všechny stejně."
PLG_SYSTEM_BETTERSEARCH_STATS_EXCLUDE_GROUPS_LABEL="Vynechat přihlášené uživatele skupin"
PLG_SYSTEM_BETTERSEARCH_STATS_EXCLUDE_GROUPS_DESC="Hledání přihlášených členů těchto skupin uživatelů (např. zaměstnanců) se nezapočítávají, z jakékoli adresy."
