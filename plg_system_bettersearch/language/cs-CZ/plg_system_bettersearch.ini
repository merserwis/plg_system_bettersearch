PLG_SYSTEM_BETTERSEARCH="Systém - Better Search for Gridbox"
PLG_SYSTEM_BETTERSEARCH_XML_DESCRIPTION="Nahrazuje vyhledávání Gridbox: okamžité výsledky pod vyhledávacími poli a stránka výsledků z vlastního indexu, ve kterém se kódy modelů shodují bez ohledu na způsob zápisu (MI 3155 = MI3155 = MI-3155). Ruční řazení, vyloučení a plná kontrola nad vzhledem."
PLG_SYSTEM_BETTERSEARCH_INSTALL_NO_GRIDBOX="Better Search for Gridbox funguje s Balbooa Gridbox, který na tomto webu není nainstalován."
PLG_SYSTEM_BETTERSEARCH_INSTALL_BUILD_INDEX="Better Search for Gridbox: otevřete plugin, kartu „Index & nástroje“, a klikněte na „Aktualizovat index“ pro sestavení vyhledávacího indexu (sestaví se také automaticky při prvních návštěvách)."

