PLG_SYSTEM_BETTERSEARCH_TRACK_CONVERSIONS_DESC="Počítá kliknutí na výsledky vyhledávání a produkty vložené do košíku po takovém kliknutí, pro každý dotaz (Nástroje → Konverze). Vlastní cookie (bs_src: id produktu → dotaz, na 30 dní) propojí košík s vyhledáváním; neukládají se žádné osobní údaje."
PLG_SYSTEM_BETTERSEARCH_REDIRECTS_LABEL="Přesměrování"
PLG_SYSTEM_BETTERSEARCH_REDIRECTS_DESC="Jedno na řádek: fráze (oddělené čárkami) =&gt; adresa, volitelně | popisek. Hledání přesně této fráze (zapsané jakkoli: „MI-3155“ = „mi 3155“) otevře adresu místo stránky výsledků; okamžité výsledky ji ukážou jako první možnost. Adresy: cesta na tomto webu (/oferta/…) nebo adresa http(s)."
PLG_SYSTEM_BETTERSEARCH_DID_YOU_MEAN_LABEL="„Měli jste na mysli…“"
PLG_SYSTEM_BETTERSEARCH_DID_YOU_MEAN_DESC="Když se nic nenajde, navrhnout hledání s výsledky, která se píší téměř stejně (ze statistik vyhledávání)."
PLG_SYSTEM_BETTERSEARCH_LIVE_SUGGESTIONS_LABEL="Navrhovat oblíbená hledání"
PLG_SYSTEM_BETTERSEARCH_LIVE_SUGGESTIONS_DESC="Nad okamžitými výsledky: hledání s výsledky, která začínají jako napsaný text, nejhledanější první (ze statistik vyhledávání). Kliknutí je vyhledá."
PLG_SYSTEM_BETTERSEARCH_LIVE_SUGGESTIONS_LIMIT_LABEL="Počet návrhů"
