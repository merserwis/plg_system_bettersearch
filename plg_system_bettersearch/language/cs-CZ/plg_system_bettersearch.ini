PLG_SYSTEM_BETTERSEARCH_SEO_CANONICAL_DESC="Kanonická adresa stránky výsledků je stránka pouze s dotazem — bez řazení, filtrů, čísla stránky a dalších parametrů. Nahrazuje kanonickou adresu nastavenou šablonou (která často odkazuje na úvodní stránku)."
PLG_SYSTEM_BETTERSEARCH_SEO_TITLE_LABEL="Titulek stránky s dotazem"
PLG_SYSTEM_BETTERSEARCH_SEO_TITLE_DESC="Titulek stránky výsledků (karta prohlížeče, vyhledávače, sdílené odkazy) uvádí dotaz a počet výsledků. Název webu se přidá podle Globálního nastavení."
PLG_SYSTEM_BETTERSEARCH_SEO_TITLE_PATTERN_LABEL="Titulek"
PLG_SYSTEM_BETTERSEARCH_SEO_PATTERN_DESC="Prázdné = text jazyka webu. <code>{query}</code> = dotaz, <code>{count}</code> = počet výsledků, <code>{site}</code> = název webu."
