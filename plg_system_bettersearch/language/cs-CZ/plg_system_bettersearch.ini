; ---------------------------------------------------------------- general
PLG_SYSTEM_BETTERSEARCH_INFO_LABEL="Better Search for Gridbox"
PLG_SYSTEM_BETTERSEARCH_INFO_DESC="Vyhledávací pole Gridbox (vyhledávání v obchodě a vyhledávací prvky) zobrazují okamžité výsledky z tohoto pluginu a stránka výsledků vyhledávání Gridbox vypisuje jeho výsledky. Kódy modelů se najdou bez ohledu na způsob zápisu: <b>MI 3155</b>, <b>MI3155</b> a <b>MI-3155</b> jsou tentýž produkt. Po instalaci sestavte index na kartě <b>Index &amp; nástroje</b>."
PLG_SYSTEM_BETTERSEARCH_APPS_LABEL="Prohledávané aplikace"
PLG_SYSTEM_BETTERSEARCH_APPS_DESC="Aplikace Gridbox, jejichž stránky se vyhledávají. Prázdné = všechny aplikace obchodu. Přidejte aplikace blogu, aby se našly i články (zobrazí se jako samostatná skupina)."
PLG_SYSTEM_BETTERSEARCH_LIVE_ENABLED_LABEL="Okamžité výsledky"
PLG_SYSTEM_BETTERSEARCH_LIVE_ENABLED_DESC="Výsledky pod vyhledávacím polem během psaní. Vypnuto = pole vede pouze na stránku výsledků."
PLG_SYSTEM_BETTERSEARCH_REPLACE_RESULTS_LABEL="Nahradit stránku výsledků"
PLG_SYSTEM_BETTERSEARCH_REPLACE_RESULTS_DESC="Stránka výsledků vyhledávání Gridbox zobrazuje výsledky tohoto pluginu (Gridbox vůbec nevyhledává)."
PLG_SYSTEM_BETTERSEARCH_RESULTS_URL_LABEL="Adresa stránky výsledků"
PLG_SYSTEM_BETTERSEARCH_RESULTS_URL_DESC="Kam vede Enter a „Zobrazit všechny výsledky“, např. /szukaj. Prázdné = adresa nastavená ve vyhledávacím prvku Gridbox (nebo stránka vyhledávání obchodu Gridbox)."
PLG_SYSTEM_BETTERSEARCH_SELECTOR_LABEL="Vyhledávací pole (selektor CSS)"
PLG_SYSTEM_BETTERSEARCH_SELECTOR_DESC="Pole, která plugin převezme. Prázdné = vyhledávací pole Gridbox a pole modulu Better Search."
PLG_SYSTEM_BETTERSEARCH_LOAD_EVERYWHERE_LABEL="Načítat na každé stránce"
PLG_SYSTEM_BETTERSEARCH_LOAD_EVERYWHERE_DESC="Skript se přidává pouze na stránky s vyhledávacím polem Gridbox. Zapněte, pokud používáte vlastní selektor pro pole jiných rozšíření."
PLG_SYSTEM_BETTERSEARCH_ICON_SUBMIT_LABEL="Ikona lupy vyhledává"
PLG_SYSTEM_BETTERSEARCH_ICON_SUBMIT_DESC="Kliknutí na ikonu vyhledávacího pole Gridbox otevře stránku výsledků (Gridbox ji používá k vymazání pole)."
PLG_SYSTEM_BETTERSEARCH_AUTO_SYNC_LABEL="Aktualizovat index automaticky"
PLG_SYSTEM_BETTERSEARCH_AUTO_SYNC_DESC="Gridbox ukládá produkty, aniž by informoval ostatní rozšíření. Plugin porovná produkty s indexem po odeslání stránky návštěvníkovi a zaindexuje nové a změněné."
PLG_SYSTEM_BETTERSEARCH_SYNC_INTERVAL_LABEL="Kontrolovat každých (minut)"
PLG_SYSTEM_BETTERSEARCH_SYNC_INTERVAL_DESC="Jak často se index porovnává s Gridbox. Změněný produkt lze pod novým názvem najít nejpozději po této době."
PLG_SYSTEM_BETTERSEARCH_SYNC_BUDGET_LABEL="Produktů na kontrolu"
PLG_SYSTEM_BETTERSEARCH_SYNC_BUDGET_DESC="Při jedné automatické kontrole se zaindexuje nejvýše tolik produktů; zbytek následuje při dalších."
PLG_SYSTEM_BETTERSEARCH_CACHE_LABEL="Mezipaměť výsledků (minuty)"
PLG_SYSTEM_BETTERSEARCH_CACHE_DESC="Výsledky stejného dotazu se uchovávají po tuto dobu. Každá aktualizace indexu a každá změna nastavení začíná znovu. 0 = bez mezipaměti."
PLG_SYSTEM_BETTERSEARCH_LOG_LABEL="Statistiky vyhledávání"
PLG_SYSTEM_BETTERSEARCH_LOG_DESC="Počítá dotazy stránky výsledků (bez osobních údajů): nejhledanější, bez výsledků. Viz karta „Index &amp; nástroje“."
PLG_SYSTEM_BETTERSEARCH_SUPPORT_LABEL="Projekt &amp; podpora"
PLG_SYSTEM_BETTERSEARCH_SUPPORT_DESC="<a href=\"https://github.com/merserwis/\" target=\"_blank\" rel=\"noopener\">github.com/merserwis</a>"

; ---------------------------------------------------------------- engine
PLG_SYSTEM_BETTERSEARCH_ENGINE_NOTE="Každé slovo dotazu musí být v produktu nalezeno. Sousední části kódu modelu tvoří jedno slovo: <b>MI 3155</b> se hledá jako <b>mi3155</b> a odpovídá také „MI-3155“ nebo „MI3155“ v produktu. Změny na této kartě se týkají indexu: aktualizujte jej na kartě „Index &amp; nástroje“ (nebo počkejte na automatickou kontrolu)."
PLG_SYSTEM_BETTERSEARCH_INDEX_FIELDS_LABEL="Prohledávaná pole produktu"
PLG_SYSTEM_BETTERSEARCH_INDEX_FIELDS_DESC="Hodnoty těchto polí Gridbox se vyhledávají (např. výrobce, model, parametry). Vynechejte pole společná mnoha produktům, například kontaktní osoby — jinak by jejich jména odpovídala každému produktu."
PLG_SYSTEM_BETTERSEARCH_INDEX_VARIATION_SKU_LABEL="Prohledávat kódy variant (SKU)"
PLG_SYSTEM_BETTERSEARCH_INDEX_PARENT_CATS_LABEL="Prohledávat názvy nadřazených kategorií"
PLG_SYSTEM_BETTERSEARCH_INDEX_PARENT_CATS_DESC="Dotaz s názvem kategorie najde i produkty jejích podkategorií."
PLG_SYSTEM_BETTERSEARCH_INDEX_TAGS_LABEL="Prohledávat štítky"
PLG_SYSTEM_BETTERSEARCH_INDEX_REDIRECTS_LABEL="Najít produkty podle přesměrování"
PLG_SYSTEM_BETTERSEARCH_INDEX_REDIRECTS_DESC="Přesměrování Joomly (komponenta Přesměrování): produkt, jehož adresa je přesměrována na jiný, předá tomuto produktu svůj starý název. Hledání starého názvu (např. AAA) zobrazí nový produkt (BBB) se štítkem „Nahrazeno“. Starým názvem je název starého produktu (pokud je v Gridboxu stále, např. nepublikovaný), jinak slova jeho adresy, a k tomu poznámka přesměrování."
PLG_SYSTEM_BETTERSEARCH_SEARCH_BODY_LABEL="Prohledávat popisy"
PLG_SYSTEM_BETTERSEARCH_SEARCH_BODY_DESC="Slova nalezená pouze v popisech mají mnohem menší váhu než v názvech, kódech, polích a kategoriích."
PLG_SYSTEM_BETTERSEARCH_INDEX_INTRO_LABEL="Úvodní text"
PLG_SYSTEM_BETTERSEARCH_INDEX_META_LABEL="Meta popis a klíčová slova"
PLG_SYSTEM_BETTERSEARCH_INDEX_CONTENT_LABEL="Obsah stránky"
PLG_SYSTEM_BETTERSEARCH_INDEX_CONTENT_DESC="Text rozvržení stránky produktu (karty, popisy, specifikace)."
PLG_SYSTEM_BETTERSEARCH_CONTENT_LIMIT_LABEL="Znaků popisu na produkt"
PLG_SYSTEM_BETTERSEARCH_MIN_CHARS_LABEL="Minimální délka dotazu"
PLG_SYSTEM_BETTERSEARCH_STEMMING_LABEL="Koncovky slov"
PLG_SYSTEM_BETTERSEARCH_STEMMING_DESC="„multimetrů“ najde i „multimetr“, „Messgeräten“ najde „Messgerät“. Jednoduchá pravidla: vždy polská (s anglickým množným číslem) a navíc pravidla jazyka webu – angličtiny, němčiny, francouzštiny, češtiny nebo nizozemštiny."
PLG_SYSTEM_BETTERSEARCH_TYPO_LABEL="Oprava překlepů"
PLG_SYSTEM_BETTERSEARCH_TYPO_DESC="Když se nic nenajde, slova neznámá indexu se nahradí nejbližším známým slovem („eurotset“ → „eurotest“)."
PLG_SYSTEM_BETTERSEARCH_PARTIAL_LABEL="Částečné shody"
PLG_SYSTEM_BETTERSEARCH_PARTIAL_DESC="Když žádný produkt neobsahuje všechna slova, zobrazit produkty s jejich většinou (s upozorněním)."
PLG_SYSTEM_BETTERSEARCH_MIN_RELEVANCE_LABEL="Odříznout slabé shody (%)"
PLG_SYSTEM_BETTERSEARCH_MIN_RELEVANCE_DESC="Výsledky se skóre pod tímto procentem nejlepšího výsledku se vynechají (např. produkty, které slovo zmiňují jen hluboko v popisu). 0 = ponechat vše."
PLG_SYSTEM_BETTERSEARCH_SYNONYMS_LABEL="Synonyma"
PLG_SYSTEM_BETTERSEARCH_SYNONYMS_DESC="Jedna skupina na řádek, oddělená čárkami: <code>multimetr, miernik uniwersalny</code> — každé najde ostatní. Jednosměrně: <code>rcd =&gt; wyłącznik różnicowoprądowy</code>. Řádky začínající # se ignorují."
PLG_SYSTEM_BETTERSEARCH_STOPWORDS_LABEL="Ignorovaná slova"
PLG_SYSTEM_BETTERSEARCH_STOPWORDS_DESC="Oddělené čárkami. Ignorují se, pokud dotaz neobsahuje nic jiného, a nikdy uvnitř označení modelu („A 1199“). Prázdné = vestavěný seznam: polská a anglická slova a navíc slova jazyka webu (němčiny, francouzštiny, češtiny nebo nizozemštiny)."
PLG_SYSTEM_BETTERSEARCH_STOPWORDS_HINT="Prázdné = vestavěný seznam pro jazyk webu"
PLG_SYSTEM_BETTERSEARCH_WEIGHTS_LABEL="Váhy"
PLG_SYSTEM_BETTERSEARCH_WEIGHTS_DESC="Jakou váhu má slovo podle toho, kde je nalezeno. Testovací konzole na kartě „Index &amp; nástroje“ ukazuje skóre každého výsledku a jeho důvody."
PLG_SYSTEM_BETTERSEARCH_W_SKU_LABEL="Kód produktu (SKU)"
PLG_SYSTEM_BETTERSEARCH_W_TITLE_LABEL="Název"
PLG_SYSTEM_BETTERSEARCH_W_FIELDS_LABEL="Pole"
PLG_SYSTEM_BETTERSEARCH_W_CATS_LABEL="Kategorie a štítky"
PLG_SYSTEM_BETTERSEARCH_W_BODY_LABEL="Popisy"
PLG_SYSTEM_BETTERSEARCH_W_DIGITS_LABEL="Slova s číslicemi ×"
PLG_SYSTEM_BETTERSEARCH_W_DIGITS_DESC="Čísla modelů vypovídají víc než slova: jejich váha se násobí tímto koeficientem."
PLG_SYSTEM_BETTERSEARCH_POPULARITY_LABEL="Oblíbenost"
PLG_SYSTEM_BETTERSEARCH_POPULARITY_DESC="Body za zobrazení stránky (logaritmicky): při stejné shodě má přednost častěji zobrazovaný produkt. 0 = vypnuto."
PLG_SYSTEM_BETTERSEARCH_MAX_CANDIDATES_LABEL="Maximum kandidátů na dotaz"

