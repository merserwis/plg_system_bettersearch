PLG_SYSTEM_BETTERSEARCH_LIVE_RECENT_DESC="Kliknięcie w puste pole wyszukiwania pokazuje ostatnie wyszukiwania odwiedzającego. Są zapisane tylko w jego przeglądarce (nic nie trafia na serwer); może je usuwać pojedynczo lub wszystkie naraz."
PLG_SYSTEM_BETTERSEARCH_LIVE_RECENT_LIMIT_LABEL="Liczba ostatnich wyszukiwań"
PLG_SYSTEM_BETTERSEARCH_PRODUCTS_NOTE="Wyróżnione produkty, dostępność z czasem dostawy oraz przyciski, którymi odwiedzający doda produkt do koszyka albo zapyta o ofertę prosto z wyników. Które produkty są wyróżnione przy jakich frazach, ustawiają reguły z akcją <b>Wyróżnij</b> na karcie „Kolejność &amp; wykluczenia”."
