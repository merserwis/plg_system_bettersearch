PLG_SYSTEM_BETTERSEARCH_FIELDSET_TOOLS="Indeks &amp; narzędzia"

; ---------------------------------------------------------------- ogólne
PLG_SYSTEM_BETTERSEARCH_INFO_LABEL="Better Search for Gridbox"
PLG_SYSTEM_BETTERSEARCH_INFO_DESC="Pola wyszukiwania Gridbox (wyszukiwarka sklepu i elementy wyszukiwania) pokazują wyniki na żywo z tej wtyczki, a strona wyników wyszukiwania Gridbox wyświetla jej wyniki. Kody modeli są znajdowane niezależnie od zapisu: <b>MI 3155</b>, <b>MI3155</b> i <b>MI-3155</b> to ten sam produkt. Po instalacji zbuduj indeks na karcie <b>Indeks &amp; narzędzia</b>."
PLG_SYSTEM_BETTERSEARCH_APPS_LABEL="Przeszukiwane aplikacje"
PLG_SYSTEM_BETTERSEARCH_APPS_DESC="Aplikacje Gridbox, których strony są wyszukiwane. Puste = wszystkie aplikacje sklepu. Dodaj aplikacje bloga, aby znajdować też artykuły (są pokazywane jako osobna grupa)."
PLG_SYSTEM_BETTERSEARCH_LIVE_ENABLED_LABEL="Wyniki na żywo"
PLG_SYSTEM_BETTERSEARCH_LIVE_ENABLED_DESC="Wyniki pod polem wyszukiwania podczas pisania. Wyłączone = pole prowadzi tylko do strony wyników."
PLG_SYSTEM_BETTERSEARCH_REPLACE_RESULTS_LABEL="Zastąp stronę wyników"
PLG_SYSTEM_BETTERSEARCH_REPLACE_RESULTS_DESC="Strona wyników wyszukiwania Gridbox pokazuje wyniki tej wtyczki (Gridbox w ogóle nie wyszukuje)."
PLG_SYSTEM_BETTERSEARCH_RESULTS_URL_LABEL="Adres strony wyników"
PLG_SYSTEM_BETTERSEARCH_RESULTS_URL_DESC="Dokąd prowadzą Enter i „Pokaż wszystkie wyniki”, np. /szukaj. Puste = adres ustawiony w elemencie wyszukiwania Gridbox (lub strona wyszukiwania sklepu Gridbox)."
PLG_SYSTEM_BETTERSEARCH_SELECTOR_LABEL="Pola wyszukiwania (selektor CSS)"
PLG_SYSTEM_BETTERSEARCH_SELECTOR_DESC="Pola przejmowane przez wtyczkę. Puste = pola wyszukiwania Gridbox i pole modułu Better Search."
PLG_SYSTEM_BETTERSEARCH_LOAD_EVERYWHERE_LABEL="Ładuj na każdej stronie"
PLG_SYSTEM_BETTERSEARCH_LOAD_EVERYWHERE_DESC="Skrypt jest dodawany tylko do stron z polem wyszukiwania Gridbox. Włącz, gdy używasz własnego selektora dla pól innych rozszerzeń."
PLG_SYSTEM_BETTERSEARCH_ICON_SUBMIT_LABEL="Ikona lupy wyszukuje"
PLG_SYSTEM_BETTERSEARCH_ICON_SUBMIT_DESC="Kliknięcie ikony pola wyszukiwania Gridbox otwiera stronę wyników (Gridbox używa jej do czyszczenia pola)."
PLG_SYSTEM_BETTERSEARCH_AUTO_SYNC_LABEL="Aktualizuj indeks automatycznie"
PLG_SYSTEM_BETTERSEARCH_AUTO_SYNC_DESC="Gridbox zapisuje produkty bez powiadamiania innych rozszerzeń. Wtyczka porównuje produkty z indeksem po wysłaniu strony odwiedzającemu i indeksuje nowe oraz zmienione."
PLG_SYSTEM_BETTERSEARCH_SYNC_INTERVAL_LABEL="Sprawdzaj co (minuty)"
PLG_SYSTEM_BETTERSEARCH_SYNC_INTERVAL_DESC="Jak często indeks jest porównywany z Gridbox. Zmieniony produkt da się znaleźć pod nową nazwą najpóźniej po tym czasie."
PLG_SYSTEM_BETTERSEARCH_SYNC_BUDGET_LABEL="Produktów na jedno sprawdzenie"
PLG_SYSTEM_BETTERSEARCH_SYNC_BUDGET_DESC="W jednym automatycznym sprawdzeniu indeksowanych jest co najwyżej tyle produktów; pozostałe w kolejnych."
PLG_SYSTEM_BETTERSEARCH_CACHE_LABEL="Pamięć podręczna wyników (minuty)"
PLG_SYSTEM_BETTERSEARCH_CACHE_DESC="Wyniki tego samego zapytania są przechowywane przez ten czas. Każda aktualizacja indeksu i każda zmiana ustawień zaczyna od nowa. 0 = bez pamięci podręcznej."
PLG_SYSTEM_BETTERSEARCH_LOG_LABEL="Statystyki wyszukiwania"
PLG_SYSTEM_BETTERSEARCH_LOG_DESC="Zlicza zapytania strony wyników (bez danych osobowych): najczęściej wyszukiwane, bez wyników. Zobacz kartę „Indeks &amp; narzędzia”."
PLG_SYSTEM_BETTERSEARCH_SUPPORT_LABEL="Projekt &amp; wsparcie"
PLG_SYSTEM_BETTERSEARCH_SUPPORT_DESC="<a href=\"https://github.com/merserwis/\" target=\"_blank\" rel=\"noopener\">github.com/merserwis</a>"

; ---------------------------------------------------------------- silnik
PLG_SYSTEM_BETTERSEARCH_ENGINE_NOTE="Każde słowo zapytania musi zostać znalezione w produkcie. Sąsiednie części kodu modelu to jedno słowo: <b>MI 3155</b> jest wyszukiwane jako <b>mi3155</b> i pasuje też do „MI-3155” lub „MI3155” w produkcie. Zmiany na tej karcie dotyczą indeksu: zaktualizuj go na karcie „Indeks &amp; narzędzia” (lub poczekaj na automatyczne sprawdzenie)."
PLG_SYSTEM_BETTERSEARCH_INDEX_FIELDS_LABEL="Przeszukiwane pola produktu"
PLG_SYSTEM_BETTERSEARCH_INDEX_FIELDS_DESC="Wartości tych pól Gridbox są wyszukiwane (np. producent, model, parametry). Pomiń pola wspólne dla wielu produktów, takie jak osoby kontaktowe — przez nie każdy produkt pasowałby do ich nazwisk."
PLG_SYSTEM_BETTERSEARCH_INDEX_VARIATION_SKU_LABEL="Przeszukuj kody wariantów (SKU)"
PLG_SYSTEM_BETTERSEARCH_INDEX_PARENT_CATS_LABEL="Przeszukuj nazwy kategorii nadrzędnych"
PLG_SYSTEM_BETTERSEARCH_INDEX_PARENT_CATS_DESC="Zapytanie z nazwą kategorii znajduje też produkty jej podkategorii."
PLG_SYSTEM_BETTERSEARCH_INDEX_TAGS_LABEL="Przeszukuj tagi"
PLG_SYSTEM_BETTERSEARCH_SEARCH_BODY_LABEL="Przeszukuj opisy"
PLG_SYSTEM_BETTERSEARCH_SEARCH_BODY_DESC="Słowa znalezione tylko w opisach liczą się znacznie mniej niż w nazwach, kodach, polach i kategoriach."
PLG_SYSTEM_BETTERSEARCH_INDEX_INTRO_LABEL="Tekst wprowadzający"
PLG_SYSTEM_BETTERSEARCH_INDEX_META_LABEL="Metaopis i słowa kluczowe"
PLG_SYSTEM_BETTERSEARCH_INDEX_CONTENT_LABEL="Treść strony"
PLG_SYSTEM_BETTERSEARCH_INDEX_CONTENT_DESC="Tekst układu strony produktu (karty, opisy, specyfikacje)."
PLG_SYSTEM_BETTERSEARCH_CONTENT_LIMIT_LABEL="Znaków opisu na produkt"
PLG_SYSTEM_BETTERSEARCH_MIN_CHARS_LABEL="Minimalna długość zapytania"
PLG_SYSTEM_BETTERSEARCH_STEMMING_LABEL="Końcówki wyrazów"
PLG_SYSTEM_BETTERSEARCH_STEMMING_DESC="„mierników” znajduje też „miernik”, „mierniki”. Proste reguły dla języka polskiego."
PLG_SYSTEM_BETTERSEARCH_TYPO_LABEL="Poprawianie literówek"
PLG_SYSTEM_BETTERSEARCH_TYPO_DESC="Gdy nic nie zostanie znalezione, słowa nieznane indeksowi są zastępowane najbliższym znanym słowem („eurotset” → „eurotest”)."
PLG_SYSTEM_BETTERSEARCH_PARTIAL_LABEL="Częściowe dopasowania"
PLG_SYSTEM_BETTERSEARCH_PARTIAL_DESC="Gdy żaden produkt nie zawiera wszystkich słów, pokaż produkty z największą ich liczbą (z adnotacją)."
PLG_SYSTEM_BETTERSEARCH_MIN_RELEVANCE_LABEL="Odrzucaj słabe dopasowania (%)"
PLG_SYSTEM_BETTERSEARCH_MIN_RELEVANCE_DESC="Wyniki z oceną poniżej tego odsetka najlepszego wyniku są pomijane (np. produkty, które wspominają słowo tylko głęboko w opisie). 0 = zachowaj wszystkie."
PLG_SYSTEM_BETTERSEARCH_SYNONYMS_LABEL="Synonimy"
PLG_SYSTEM_BETTERSEARCH_SYNONYMS_DESC="Jedna grupa w wierszu, oddzielona przecinkami: <code>multimetr, miernik uniwersalny</code> — każde słowo znajduje pozostałe. Jednokierunkowo: <code>rcd =&gt; wyłącznik różnicowoprądowy</code>. Wiersze zaczynające się od # są pomijane."
PLG_SYSTEM_BETTERSEARCH_STOPWORDS_LABEL="Pomijane słowa"
PLG_SYSTEM_BETTERSEARCH_STOPWORDS_DESC="Oddzielone przecinkami. Pomijane, chyba że zapytanie nie zawiera nic innego, i nigdy wewnątrz kodu modelu („A 1199”)."
PLG_SYSTEM_BETTERSEARCH_WEIGHTS_LABEL="Wagi"
PLG_SYSTEM_BETTERSEARCH_WEIGHTS_DESC="Ile znaczy słowo w zależności od miejsca, w którym zostało znalezione. Konsola testowa na karcie „Indeks &amp; narzędzia” pokazuje ocenę każdego wyniku i jej powody."
PLG_SYSTEM_BETTERSEARCH_W_SKU_LABEL="Kod produktu (SKU)"
PLG_SYSTEM_BETTERSEARCH_W_TITLE_LABEL="Nazwa"
PLG_SYSTEM_BETTERSEARCH_W_FIELDS_LABEL="Pola"
PLG_SYSTEM_BETTERSEARCH_W_CATS_LABEL="Kategorie i tagi"
PLG_SYSTEM_BETTERSEARCH_W_BODY_LABEL="Opisy"
PLG_SYSTEM_BETTERSEARCH_W_DIGITS_LABEL="Słowa z cyframi ×"
PLG_SYSTEM_BETTERSEARCH_W_DIGITS_DESC="Numery modeli mówią więcej niż słowa: ich waga jest mnożona przez ten współczynnik."
PLG_SYSTEM_BETTERSEARCH_POPULARITY_LABEL="Popularność"
PLG_SYSTEM_BETTERSEARCH_POPULARITY_DESC="Punkty za wyświetlenia strony (logarytmicznie): przy równym dopasowaniu częściej oglądany produkt jest wyżej. 0 = wyłączone."
PLG_SYSTEM_BETTERSEARCH_MAX_CANDIDATES_LABEL="Maksymalna liczba kandydatów na zapytanie"

; ---------------------------------------------------------------- reguły
PLG_SYSTEM_BETTERSEARCH_RULES_NOTE="<b>Ręczna kolejność:</b> przypnij produkty na górze wyników wybranych zapytań, w ustalonej kolejności (przeciągnij produkty). <b>Ukryj</b> usuwa produkty z wyników tych zapytań. Wzmocnienia przesuwają produkty lub całe kategorie w górę (dodatnie) lub w dół (ujemne) w każdym wyszukiwaniu."
PLG_SYSTEM_BETTERSEARCH_RULES_LABEL="Reguły zapytań"
