; 1.4.0
PLG_SYSTEM_BETTERSEARCH_INSTANT_REINDEX_LABEL="Aktualizuj indeks zaraz po zmianie"
PLG_SYSTEM_BETTERSEARCH_INSTANT_REINDEX_DESC="Gdy strona lub produkt Gridbox zostanie zapisany, opublikowany, wycofany z publikacji lub przeniesiony do kosza (w edytorze Gridbox lub na listach), zmienione pozycje są indeksowane ponownie zaraz po tym żądaniu, więc wyszukiwarka pokazuje zmianę od razu, a nie dopiero po kolejnym sprawdzeniu."
PLG_SYSTEM_BETTERSEARCH_TRACK_CONVERSIONS_LABEL="Statystyki konwersji"
PLG_SYSTEM_BETTERSEARCH_TRACK_CONVERSIONS_DESC="Zlicza kliknięcia w wyniki wyszukiwania i produkty dodane do koszyka po takim kliknięciu, osobno dla każdego zapytania (Narzędzia → Konwersje). Własne ciasteczko witryny (bs_src: id produktu → zapytanie, na 30 dni) łączy koszyk z wyszukiwaniem; dane osobowe nie są zapisywane."
PLG_SYSTEM_BETTERSEARCH_REDIRECTS_LABEL="Przekierowania"
PLG_SYSTEM_BETTERSEARCH_REDIRECTS_DESC="Jedno w wierszu: frazy (oddzielone przecinkami) =&gt; adres, opcjonalnie | etykieta. Wyszukanie dokładnie tej frazy (zapisanej dowolnie: „MI-3155” = „mi 3155”) otwiera adres zamiast strony wyników; wyniki na żywo pokazują go jako pierwszą opcję. Adresy: ścieżka w tej witrynie (/oferta/…) lub adres http(s)."
PLG_SYSTEM_BETTERSEARCH_DID_YOU_MEAN_LABEL="„Czy chodziło o…”"
PLG_SYSTEM_BETTERSEARCH_DID_YOU_MEAN_DESC="Gdy nic nie zostanie znalezione, proponuj wyszukiwania z wynikami, które są zapisane prawie tak samo (ze statystyk wyszukiwania)."
PLG_SYSTEM_BETTERSEARCH_LIVE_SUGGESTIONS_LABEL="Podpowiadaj popularne wyszukiwania"
PLG_SYSTEM_BETTERSEARCH_LIVE_SUGGESTIONS_DESC="Nad wynikami na żywo: wyszukiwania z wynikami, które zaczynają się jak wpisany tekst, od najczęściej wyszukiwanych (ze statystyk wyszukiwania). Kliknięcie wyszukuje daną frazę."
PLG_SYSTEM_BETTERSEARCH_LIVE_SUGGESTIONS_LIMIT_LABEL="Liczba podpowiedzi"
PLG_SYSTEM_BETTERSEARCH_SUGGEST_MIN_SEARCHES_LABEL="Podpowiadaj po … wyszukiwaniach"
PLG_SYSTEM_BETTERSEARCH_SUGGEST_MIN_SEARCHES_DESC="Fraza jest podpowiadana dopiero wtedy, gdy była wyszukiwana co najmniej tyle razy (jednorazowa literówka nie jest podpowiadana innym)."
PLG_SYSTEM_BETTERSEARCH_PAGE_FACETS_LABEL="Filtry obok wyników"
PLG_SYSTEM_BETTERSEARCH_PAGE_FACETS_DESC="Marka, zakres cen, tylko promocje i tylko dostępne. Każdy filtr pokazuje, ile wyników pozostawi; filtry, które niczego by nie zmieniły, nie są pokazywane."
PLG_SYSTEM_BETTERSEARCH_PAGE_FACETS_POSITION_LABEL="Położenie filtrów"
PLG_SYSTEM_BETTERSEARCH_PAGE_FACETS_POSITION_SIDE="Obok wyników (nad nimi na telefonach)"
