PLG_SYSTEM_BETTERSEARCH_INDEX_PAGES_DESC="Wyszukiwane są też pojedyncze strony Gridbox (Strony i aplikacje jednostronicowe), np. usługi, kontakt, o nas. Wyświetlają się jako osobna grupa „Strony”, bez ceny i koszyka. Pojedyncze strony można wykluczyć na karcie „Kolejność &amp; wykluczenia”."
