PLG_SYSTEM_BETTERSEARCH_FIELDSET_RULES="Kolejność &amp; wykluczenia"
PLG_SYSTEM_BETTERSEARCH_FIELDSET_LIVE="Wyniki na żywo"
PLG_SYSTEM_BETTERSEARCH_FIELDSET_PAGE="Strona wyników"
