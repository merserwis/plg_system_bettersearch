PLG_SYSTEM_BETTERSEARCH_TECH_PARAMS_LABEL="Parametry techniczne"
PLG_SYSTEM_BETTERSEARCH_TECH_PARAMS_DESC="Wartości z jednostką są porównywane jako wartości, a nie słowa: <b>1000 V</b> = <b>1 kV</b> = <b>1000V</b>, <b>200 GΩ</b>, <b>50 Hz</b>, <b>CAT IV</b> = <b>kat. IV</b>, <b>IP67</b>, zakresy jak <b>-20…50 °C</b> (znajdowane w produktach, których zakres go obejmuje, np. -20…+60 °C). Jednostki: V, A, W, VA, Wh, Ah, Hz, Ω, F, °C, dB, lx, Pa, bar, m z przedrostkami p, n, µ, m, k, M, G. Gdy żaden produkt nie ma danej wartości, tekst jest szukany jako słowa."
