PLG_SYSTEM_BETTERSEARCH="System - Better Search for Gridbox"
PLG_SYSTEM_BETTERSEARCH_XML_DESCRIPTION="Zastępuje wyszukiwarkę Gridbox: wyniki na żywo pod polami wyszukiwania oraz strona wyników, z własnego indeksu, w którym kody modeli pasują niezależnie od zapisu (MI 3155 = MI3155 = MI-3155). Ręczne ustalanie kolejności, wykluczenia i pełna kontrola nad wyglądem."
PLG_SYSTEM_BETTERSEARCH_INSTALL_NO_GRIDBOX="Better Search for Gridbox współpracuje z Balbooa Gridbox, który nie jest zainstalowany w tej witrynie."
PLG_SYSTEM_BETTERSEARCH_INSTALL_BUILD_INDEX="Better Search for Gridbox: otwórz wtyczkę, kartę „Indeks & narzędzia”, i kliknij „Aktualizuj indeks”, aby zbudować indeks wyszukiwania (buduje się też automatycznie podczas pierwszych odwiedzin)."

