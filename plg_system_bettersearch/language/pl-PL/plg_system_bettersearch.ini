PLG_SYSTEM_BETTERSEARCH_GSC_NOTE="<p class=\"mb-1\">Zapytania, po których ludzie znajdują Twoją witrynę w Google, obok tego, co znajduje dla nich ta wyszukiwarka: frazy bez wyników tutaj to kandydaci na synonimy lub przekierowania.</p><p class=\"mb-0\"><strong>Automatycznie (raz dziennie):</strong> utwórz konto usługi w Google Cloud, włącz „Google Search Console API”, dodaj adres e-mail tego konta jako użytkownika swojej usługi w Search Console i wklej poniżej jego klucz JSON. <strong>Bez klucza:</strong> wyeksportuj tabelę „Zapytania” z Search Console jako CSV i zaimportuj ją przyciskiem poniżej.</p>"
