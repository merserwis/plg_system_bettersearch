; ---------------------------------------------------------------- 1.3.0: SEO i ceny
PLG_SYSTEM_BETTERSEARCH_FIELDSET_SEO="SEO"
PLG_SYSTEM_BETTERSEARCH_SEO_NOTE="Jak wyszukiwarki internetowe widzą stronę wyników. Wyniki wyszukiwania to ubogie, ciągle zmieniające się strony: domyślnie są wyłączone z indeksowania, a ich linki do produktów są śledzone, adres każdego posortowanego lub przefiltrowanego widoku wskazuje na zwykłe wyniki zapytania, a strona dostaje własny tytuł i opis."
PLG_SYSTEM_BETTERSEARCH_SEO_ROBOTS_LABEL="Robots"
PLG_SYSTEM_BETTERSEARCH_SEO_ROBOTS_DESC="Metatag robots strony wyników. Przy „index” strony posortowane, przefiltrowane, kolejne i puste nadal dostają „noindex, follow”."
PLG_SYSTEM_BETTERSEARCH_SEO_ROBOTS_NOINDEX_FOLLOW="noindex, follow (zalecane)"
PLG_SYSTEM_BETTERSEARCH_SEO_ROBOTS_NOINDEX_NOFOLLOW="noindex, nofollow"
PLG_SYSTEM_BETTERSEARCH_SEO_ROBOTS_INDEX_FOLLOW="index, follow"
PLG_SYSTEM_BETTERSEARCH_SEO_ROBOTS_KEEP="Pozostaw ustawienie witryny"
PLG_SYSTEM_BETTERSEARCH_SEO_CANONICAL_LABEL="Adres kanoniczny (canonical)"
PLG_SYSTEM_BETTERSEARCH_SEO_CANONICAL_DESC="Adresem kanonicznym strony wyników jest strona z samym zapytaniem — bez sortowania, filtrów, numeru strony i innych parametrów. Zastępuje adres kanoniczny ustawiony przez szablon (który często wskazuje na stronę główną)."
PLG_SYSTEM_BETTERSEARCH_SEO_TITLE_LABEL="Tytuł strony z zapytaniem"
PLG_SYSTEM_BETTERSEARCH_SEO_TITLE_DESC="Tytuł strony wyników (karta przeglądarki, wyszukiwarki internetowe, udostępniane linki) zawiera zapytanie i liczbę wyników. Nazwa witryny jest dodawana zgodnie z Konfiguracją globalną."
PLG_SYSTEM_BETTERSEARCH_SEO_TITLE_PATTERN_LABEL="Tytuł"
PLG_SYSTEM_BETTERSEARCH_SEO_PATTERN_DESC="Puste = tekst języka witryny. <code>{query}</code> = zapytanie, <code>{count}</code> = liczba wyników, <code>{site}</code> = nazwa witryny."
PLG_SYSTEM_BETTERSEARCH_SEO_DESCRIPTION_LABEL="Metaopis"
PLG_SYSTEM_BETTERSEARCH_SEO_DESCRIPTION_PATTERN_LABEL="Opis"
PLG_SYSTEM_BETTERSEARCH_SEO_NOFOLLOW_LABEL="nofollow przy sortowaniu, filtrach i stronach"
PLG_SYSTEM_BETTERSEARCH_SEO_NOFOLLOW_DESC="Linki, które tylko zmieniają sortowanie lub filtrują jedno wyszukiwanie, dostają rel=„nofollow”, dzięki czemu roboty wyszukiwarek nie przeszukują ich niekończących się kombinacji zamiast sklepu."
PLG_SYSTEM_BETTERSEARCH_SEO_JSONLD_LABEL="Dane strukturalne wyników"
PLG_SYSTEM_BETTERSEARCH_SEO_JSONLD_DESC="schema.org SearchResultsPage z listą pokazanych produktów (nazwa i adres)."
PLG_SYSTEM_BETTERSEARCH_SEO_OPENSEARCH_LABEL="OpenSearch"
PLG_SYSTEM_BETTERSEARCH_SEO_OPENSEARCH_DESC="Przeglądarki mogą dodać wyszukiwarkę sklepu do swoich wyszukiwarek (i przeszukiwać sklep wprost z paska adresu)."
PLG_SYSTEM_BETTERSEARCH_SEO_OPENSEARCH_NAME_LABEL="Nazwa OpenSearch"
PLG_SYSTEM_BETTERSEARCH_SEO_OPENSEARCH_NAME_DESC="Najwyżej 16 znaków. Puste = nazwa witryny."
PLG_SYSTEM_BETTERSEARCH_SEO_SITELINKS_LABEL="Dane pola wyszukiwania na stronie głównej"
PLG_SYSTEM_BETTERSEARCH_SEO_SITELINKS_DESC="schema.org WebSite z SearchAction na stronie głównej. Google nie pokazuje już na tej podstawie pola wyszukiwania (od listopada 2024); inne usługi mogą je nadal odczytywać."
