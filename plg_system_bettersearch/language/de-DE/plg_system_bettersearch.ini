; ---------------------------------------------------------------- Allgemein
PLG_SYSTEM_BETTERSEARCH_INFO_LABEL="Better Search for Gridbox"
PLG_SYSTEM_BETTERSEARCH_INFO_DESC="Die Suchfelder von Gridbox (Shop-Suche und Suchelemente) zeigen Live-Ergebnisse dieses Plugins, und die Gridbox-Suchergebnisseite listet seine Ergebnisse auf. Modellcodes werden unabhängig von der Schreibweise gefunden: <b>MI 3155</b>, <b>MI3155</b> und <b>MI-3155</b> sind dasselbe Produkt. Bauen Sie nach der Installation den Index im Reiter <b>Index &amp; Werkzeuge</b> auf."
PLG_SYSTEM_BETTERSEARCH_APPS_LABEL="Durchsuchte Apps"
PLG_SYSTEM_BETTERSEARCH_APPS_DESC="Gridbox-Apps, deren Seiten gefunden werden. Leer = alle Shop-Apps. Fügen Sie Blog-Apps hinzu, um auch Beiträge zu finden (sie werden als eigene Gruppe angezeigt)."
PLG_SYSTEM_BETTERSEARCH_LIVE_ENABLED_LABEL="Live-Ergebnisse"
PLG_SYSTEM_BETTERSEARCH_LIVE_ENABLED_DESC="Ergebnisse unter dem Suchfeld während der Eingabe. Aus = das Feld führt nur zur Ergebnisseite."
PLG_SYSTEM_BETTERSEARCH_REPLACE_RESULTS_LABEL="Ergebnisseite ersetzen"
PLG_SYSTEM_BETTERSEARCH_REPLACE_RESULTS_DESC="Die Gridbox-Suchergebnisseite zeigt die Ergebnisse dieses Plugins (Gridbox sucht dann gar nicht)."
PLG_SYSTEM_BETTERSEARCH_RESULTS_URL_LABEL="Adresse der Ergebnisseite"
PLG_SYSTEM_BETTERSEARCH_RESULTS_URL_DESC="Wohin die Eingabetaste und „Alle Ergebnisse anzeigen“ führen, z. B. /szukaj. Leer = die im Gridbox-Suchelement eingestellte Adresse (oder die Gridbox-Shop-Suchseite)."
PLG_SYSTEM_BETTERSEARCH_SELECTOR_LABEL="Suchfelder (CSS-Selektor)"
PLG_SYSTEM_BETTERSEARCH_SELECTOR_DESC="Felder, die das Plugin übernimmt. Leer = die Gridbox-Suchfelder und das Feld des Better-Search-Moduls."
PLG_SYSTEM_BETTERSEARCH_LOAD_EVERYWHERE_LABEL="Auf jeder Seite laden"
PLG_SYSTEM_BETTERSEARCH_LOAD_EVERYWHERE_DESC="Das Skript wird nur auf Seiten mit einem Gridbox-Suchfeld eingebunden. Aktivieren Sie diese Option, wenn Sie einen eigenen Selektor für Felder anderer Erweiterungen verwenden."
PLG_SYSTEM_BETTERSEARCH_ICON_SUBMIT_LABEL="Lupensymbol startet die Suche"
PLG_SYSTEM_BETTERSEARCH_ICON_SUBMIT_DESC="Ein Klick auf das Symbol eines Gridbox-Suchfelds öffnet die Ergebnisseite (Gridbox leert damit sonst das Feld)."
PLG_SYSTEM_BETTERSEARCH_AUTO_SYNC_LABEL="Index automatisch aktualisieren"
PLG_SYSTEM_BETTERSEARCH_AUTO_SYNC_DESC="Gridbox speichert Produkte, ohne andere Erweiterungen zu benachrichtigen. Das Plugin vergleicht die Produkte mit dem Index, nachdem die Seite eines Besuchers ausgeliefert wurde, und indexiert neue und geänderte Produkte."
PLG_SYSTEM_BETTERSEARCH_SYNC_INTERVAL_LABEL="Prüfen alle (Minuten)"
PLG_SYSTEM_BETTERSEARCH_SYNC_INTERVAL_DESC="Wie oft der Index mit Gridbox verglichen wird. Ein geändertes Produkt ist spätestens nach dieser Zeit unter seinem neuen Namen auffindbar."
PLG_SYSTEM_BETTERSEARCH_SYNC_BUDGET_LABEL="Produkte pro Prüfung"
PLG_SYSTEM_BETTERSEARCH_SYNC_BUDGET_DESC="Höchstens so viele Produkte werden bei einer automatischen Prüfung indexiert; der Rest folgt bei den nächsten."
PLG_SYSTEM_BETTERSEARCH_CACHE_LABEL="Ergebnisse zwischenspeichern (Minuten)"
PLG_SYSTEM_BETTERSEARCH_CACHE_DESC="Ergebnisse derselben Suchanfrage werden so lange aufbewahrt. Jede Indexaktualisierung und jede Änderung der Einstellungen leert den Cache. 0 = kein Cache."
PLG_SYSTEM_BETTERSEARCH_LOG_LABEL="Suchstatistik"
PLG_SYSTEM_BETTERSEARCH_LOG_DESC="Zählt die Suchanfragen der Ergebnisseite (keine personenbezogenen Daten): meistgesucht, ohne Ergebnisse. Siehe Reiter „Index &amp; Werkzeuge“."
PLG_SYSTEM_BETTERSEARCH_SUPPORT_LABEL="Projekt &amp; Support"
PLG_SYSTEM_BETTERSEARCH_SUPPORT_DESC="<a href=\"https://github.com/merserwis/\" target=\"_blank\" rel=\"noopener\">github.com/merserwis</a>"

; ---------------------------------------------------------------- Suchlogik
PLG_SYSTEM_BETTERSEARCH_ENGINE_NOTE="Jedes Wort der Suchanfrage muss in einem Produkt gefunden werden. Benachbarte Teile eines Modellcodes gelten als ein Wort: <b>MI 3155</b> wird als <b>mi3155</b> gesucht und findet im Produkt auch „MI-3155“ oder „MI3155“. Änderungen in diesem Reiter wirken sich auf den Index aus: Aktualisieren Sie ihn im Reiter „Index &amp; Werkzeuge“ (oder warten Sie auf die automatische Prüfung)."
PLG_SYSTEM_BETTERSEARCH_INDEX_FIELDS_LABEL="Zu durchsuchende Produktfelder"
PLG_SYSTEM_BETTERSEARCH_INDEX_FIELDS_DESC="Werte dieser Gridbox-Felder werden gefunden (z. B. Hersteller, Modell, Parameter). Lassen Sie Felder weg, die viele Produkte gemeinsam haben, etwa Ansprechpartner – sonst würde jedes Produkt bei deren Namen gefunden."
PLG_SYSTEM_BETTERSEARCH_INDEX_VARIATION_SKU_LABEL="Variantencodes durchsuchen (SKU)"
PLG_SYSTEM_BETTERSEARCH_INDEX_PARENT_CATS_LABEL="Namen übergeordneter Kategorien durchsuchen"
PLG_SYSTEM_BETTERSEARCH_INDEX_PARENT_CATS_DESC="Eine Suche nach einem Kategorienamen findet auch die Produkte ihrer Unterkategorien."
PLG_SYSTEM_BETTERSEARCH_INDEX_TAGS_LABEL="Schlagwörter durchsuchen"
PLG_SYSTEM_BETTERSEARCH_SEARCH_BODY_LABEL="Beschreibungen durchsuchen"
PLG_SYSTEM_BETTERSEARCH_SEARCH_BODY_DESC="Wörter, die nur in Beschreibungen vorkommen, zählen deutlich weniger als in Namen, Codes, Feldern und Kategorien."
PLG_SYSTEM_BETTERSEARCH_INDEX_INTRO_LABEL="Einleitungstext"
PLG_SYSTEM_BETTERSEARCH_INDEX_META_LABEL="Meta-Beschreibung und Schlüsselwörter"
PLG_SYSTEM_BETTERSEARCH_INDEX_CONTENT_LABEL="Seiteninhalt"
PLG_SYSTEM_BETTERSEARCH_INDEX_CONTENT_DESC="Der Text des Produktseiten-Layouts (Reiter, Beschreibungen, technische Daten)."
PLG_SYSTEM_BETTERSEARCH_CONTENT_LIMIT_LABEL="Zeichen der Beschreibung pro Produkt"
PLG_SYSTEM_BETTERSEARCH_MIN_CHARS_LABEL="Mindestlänge der Suchanfrage"
PLG_SYSTEM_BETTERSEARCH_STEMMING_LABEL="Wortendungen"
PLG_SYSTEM_BETTERSEARCH_STEMMING_DESC="„mierników“ findet auch „miernik“, „mierniki“. Einfache Regeln für Polnisch."
PLG_SYSTEM_BETTERSEARCH_TYPO_LABEL="Tippfehlerkorrektur"
PLG_SYSTEM_BETTERSEARCH_TYPO_DESC="Wird nichts gefunden, werden dem Index unbekannte Wörter durch das ähnlichste bekannte Wort ersetzt („eurotset“ → „eurotest“)."
PLG_SYSTEM_BETTERSEARCH_PARTIAL_LABEL="Teiltreffer"
PLG_SYSTEM_BETTERSEARCH_PARTIAL_DESC="Enthält kein Produkt alle Wörter, werden die Produkte mit den meisten davon angezeigt (mit einem Hinweis)."
PLG_SYSTEM_BETTERSEARCH_MIN_RELEVANCE_LABEL="Schwache Treffer ausblenden (%)"
PLG_SYSTEM_BETTERSEARCH_MIN_RELEVANCE_DESC="Ergebnisse, deren Punktzahl unter diesem Prozentsatz des besten Ergebnisses liegt, werden weggelassen (z. B. Produkte, die das Wort nur tief in der Beschreibung erwähnen). 0 = alle behalten."
PLG_SYSTEM_BETTERSEARCH_SYNONYMS_LABEL="Synonyme"
PLG_SYSTEM_BETTERSEARCH_SYNONYMS_DESC="Eine Gruppe pro Zeile, durch Kommas getrennt: <code>multimetr, miernik uniwersalny</code> – jedes Wort findet die anderen. In eine Richtung: <code>rcd =&gt; wyłącznik różnicowoprądowy</code>. Zeilen, die mit # beginnen, werden ignoriert."
PLG_SYSTEM_BETTERSEARCH_STOPWORDS_LABEL="Ignorierte Wörter"
PLG_SYSTEM_BETTERSEARCH_STOPWORDS_DESC="Durch Kommas getrennt. Werden ignoriert, außer die Suchanfrage enthält sonst nichts, und nie innerhalb eines Modellcodes („A 1199“)."
PLG_SYSTEM_BETTERSEARCH_WEIGHTS_LABEL="Gewichtung"
PLG_SYSTEM_BETTERSEARCH_WEIGHTS_DESC="Wie stark ein Wort zählt, je nachdem, wo es gefunden wird. Die Testkonsole im Reiter „Index &amp; Werkzeuge“ zeigt die Punktzahl jedes Ergebnisses und ihre Gründe."
PLG_SYSTEM_BETTERSEARCH_W_SKU_LABEL="Produktcode (SKU)"
PLG_SYSTEM_BETTERSEARCH_W_TITLE_LABEL="Name"
PLG_SYSTEM_BETTERSEARCH_W_FIELDS_LABEL="Felder"
PLG_SYSTEM_BETTERSEARCH_W_CATS_LABEL="Kategorien und Schlagwörter"
PLG_SYSTEM_BETTERSEARCH_W_BODY_LABEL="Beschreibungen"
PLG_SYSTEM_BETTERSEARCH_W_DIGITS_LABEL="Wörter mit Ziffern ×"
PLG_SYSTEM_BETTERSEARCH_W_DIGITS_DESC="Modellnummern sind aussagekräftiger als Wörter: Ihre Gewichtung wird mit diesem Faktor multipliziert."
PLG_SYSTEM_BETTERSEARCH_POPULARITY_LABEL="Beliebtheit"
PLG_SYSTEM_BETTERSEARCH_POPULARITY_DESC="Punkte für Seitenaufrufe (logarithmisch): Bei gleich guten Treffern steht das häufiger aufgerufene Produkt vorne. 0 = aus."
PLG_SYSTEM_BETTERSEARCH_MAX_CANDIDATES_LABEL="Maximale Kandidaten pro Suchanfrage"

; ---------------------------------------------------------------- Regeln
PLG_SYSTEM_BETTERSEARCH_RULES_NOTE="<b>Manuelle Reihenfolge:</b> Heften Sie Produkte in der von Ihnen festgelegten Reihenfolge an den Anfang der Ergebnisse bestimmter Suchanfragen (Produkte per Ziehen sortieren). <b>Ausblenden</b> entfernt Produkte aus den Ergebnissen dieser Suchanfragen. Boosts verschieben Produkte oder ganze Kategorien bei jeder Suche nach oben (positiv) oder nach unten (negativ)."
PLG_SYSTEM_BETTERSEARCH_RULES_LABEL="Suchanfrage-Regeln"
PLG_SYSTEM_BETTERSEARCH_RULES_DESC="Angeheftete oder ausgeblendete Produkte für bestimmte Suchanfragen."
