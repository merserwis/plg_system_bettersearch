; ---------------------------------------------------------------- 1.3.0: SEO und Preise
PLG_SYSTEM_BETTERSEARCH_FIELDSET_SEO="SEO"
PLG_SYSTEM_BETTERSEARCH_SEO_NOTE="Wie Suchmaschinen die Ergebnisseite sehen. Suchergebnisse sind inhaltsarme, ständig wechselnde Seiten: Standardmäßig werden sie aus dem Index herausgehalten, während ihren Links zu Produkten gefolgt wird, die Adresse jeder sortierten oder gefilterten Ansicht verweist auf die einfachen Ergebnisse der Suchanfrage, und die Seite erhält einen eigenen Titel und eine eigene Beschreibung."
PLG_SYSTEM_BETTERSEARCH_SEO_ROBOTS_LABEL="Robots"
PLG_SYSTEM_BETTERSEARCH_SEO_ROBOTS_DESC="Das robots-Meta-Tag der Ergebnisseite. Bei „index“ erhalten sortierte, gefilterte, weitere und leere Seiten trotzdem „noindex, follow“."
PLG_SYSTEM_BETTERSEARCH_SEO_ROBOTS_NOINDEX_FOLLOW="noindex, follow (empfohlen)"
PLG_SYSTEM_BETTERSEARCH_SEO_ROBOTS_NOINDEX_NOFOLLOW="noindex, nofollow"
PLG_SYSTEM_BETTERSEARCH_SEO_ROBOTS_INDEX_FOLLOW="index, follow"
PLG_SYSTEM_BETTERSEARCH_SEO_ROBOTS_KEEP="So lassen, wie die Website es festlegt"
PLG_SYSTEM_BETTERSEARCH_SEO_CANONICAL_LABEL="Kanonische Adresse"
PLG_SYSTEM_BETTERSEARCH_SEO_CANONICAL_DESC="Die kanonische Adresse der Ergebnisseite ist die Seite nur mit der Suchanfrage – ohne Sortierung, Filter, Seitenzahl oder andere Parameter. Sie ersetzt eine vom Theme gesetzte canonical-Adresse (die oft auf die Startseite verweist)."
PLG_SYSTEM_BETTERSEARCH_SEO_TITLE_LABEL="Seitentitel mit der Suchanfrage"
PLG_SYSTEM_BETTERSEARCH_SEO_TITLE_DESC="Der Titel der Ergebnisseite (Browser-Tab, Suchmaschinen, geteilte Links) nennt die Suchanfrage und die Anzahl der Ergebnisse. Der Name der Website wird wie in der globalen Konfiguration eingestellt hinzugefügt."
PLG_SYSTEM_BETTERSEARCH_SEO_TITLE_PATTERN_LABEL="Titel"
PLG_SYSTEM_BETTERSEARCH_SEO_PATTERN_DESC="Leer = der Text der Website-Sprache. <code>{query}</code> = die Suchanfrage, <code>{count}</code> = die Anzahl der Ergebnisse, <code>{site}</code> = der Name der Website."
PLG_SYSTEM_BETTERSEARCH_SEO_DESCRIPTION_LABEL="Meta-Beschreibung"
PLG_SYSTEM_BETTERSEARCH_SEO_DESCRIPTION_PATTERN_LABEL="Beschreibung"
PLG_SYSTEM_BETTERSEARCH_SEO_NOFOLLOW_LABEL="nofollow bei Sortierung, Filtern und Seiten"
PLG_SYSTEM_BETTERSEARCH_SEO_NOFOLLOW_DESC="Links, die eine Suche nur neu sortieren oder filtern, erhalten rel=„nofollow“, damit Suchmaschinen-Robots nicht deren endlose Kombinationen statt des Shops crawlen."
PLG_SYSTEM_BETTERSEARCH_SEO_JSONLD_LABEL="Strukturierte Daten der Ergebnisse"
PLG_SYSTEM_BETTERSEARCH_SEO_JSONLD_DESC="schema.org SearchResultsPage mit der Liste der angezeigten Produkte (Name und Adresse)."
