PLG_SYSTEM_BETTERSEARCH="System - Better Search for Gridbox"
PLG_SYSTEM_BETTERSEARCH_XML_DESCRIPTION="Ersetzt die Gridbox-Suche: Live-Ergebnisse unter den Suchfeldern und die Ergebnisseite, aus einem eigenen Index, in dem Modellcodes unabhängig von der Schreibweise gefunden werden (MI 3155 = MI3155 = MI-3155). Manuelle Reihenfolge, Ausschlüsse und volle Kontrolle über das Aussehen."
PLG_SYSTEM_BETTERSEARCH_INSTALL_NO_GRIDBOX="Better Search for Gridbox funktioniert mit Balbooa Gridbox, das auf dieser Website nicht installiert ist."
PLG_SYSTEM_BETTERSEARCH_INSTALL_BUILD_INDEX="Better Search for Gridbox: Öffnen Sie das Plugin, Reiter „Index & Werkzeuge“, und klicken Sie auf „Index aktualisieren“, um den Suchindex aufzubauen (er wird auch bei den ersten Besuchen automatisch aufgebaut)."

