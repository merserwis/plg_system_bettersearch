PLG_SYSTEM_BETTERSEARCH_RULE_QUERIES_DESC="Durch Kommas getrennt. Leerzeichen, Bindestriche und Groß-/Kleinschreibung spielen keine Rolle: „mi 3155“ deckt auch „MI-3155“ ab."
